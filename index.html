function Loans({ data, mut, showToast, sync, openTx }) {
  const [formOpen, setFormOpen] = useState(false);
  const [edit, setEdit] = useState(null);
  const [confirmDel, setConfirmDel] = useState(null);
  const [sortBy, setSortBy] = useState('name');
  const [showHistory, setShowHistory] = useState(false);

  const activeLoans = useMemo(() => data.loans.filter(l => !l.closed), [data.loans]);
  const closedLoans = useMemo(() => data.loans.filter(l => l.closed), [data.loans]);

  const total = activeLoans.reduce((s, l) => s + loanOutstandingPrincipal(l), 0);
  const scheduledTotal = activeLoans.reduce((s, l) => s + loanScheduledPayments(l), 0);
  const totalEmi = activeLoans.reduce((s, l) => s + (Number(l.emi) || 0), 0);

  const sortedActive = useMemo(() => {
    const arr = activeLoans.slice();
    if (sortBy === 'name') arr.sort((a, b) => naturalCompare(a.name, b.name));
    else arr.sort((a, b) => { const da = nextDueDate(a.dueDay || 5, a.paidCycles); const db = nextDueDate(b.dueDay || 5, b.paidCycles); if (da - db !== 0) return da - db; return naturalCompare(a.name, b.name); });
    return arr;
  }, [activeLoans, sortBy]);

  const sortedClosed = useMemo(() => { const arr = closedLoans.slice(); arr.sort((a, b) => (b.closedDate || '').localeCompare(a.closedDate || '')); return arr; }, [closedLoans]);

  const save = (payload, id) => {
    mut(d => {
      if (id) { const l = d.loans.find(x => x.id === id); if (l) Object.assign(l, payload); }
      else d.loans.push(Object.assign({ id: uid(), paidCycles: [] }, payload));
    });
    setFormOpen(false); setEdit(null);
    showToast(id ? 'Loan updated' : 'Loan added');
  };

  const markDone = (loan) => {
    const cycle = monthKey(nextDueDate(loan.dueDay || 5, loan.paidCycles));
    mut(d => { const l = d.loans.find(x => x.id === loan.id); if (l) l.paidCycles = (l.paidCycles || []).concat([cycle]); });
    showToast('Marked done for this month');
  };

  const skipLoan = (loan) => {
    const cycle = monthKey(nextDueDate(loan.dueDay || 5, loan.paidCycles));
    const id = loan.id;
    mut(d => { const l = d.loans.find(x => x.id === id); if (l) l.paidCycles = (l.paidCycles || []).concat([cycle]); });
    showToast(loan.name + ' skipped · moved to next month', () => {
      mut(d => { const l = d.loans.find(x => x.id === id); if (l) l.paidCycles = (l.paidCycles || []).filter(x => x !== cycle); });
      showToast('Skip undone');
    });
  };

  const openPay = (loan) => {
    const cycle = monthKey(nextDueDate(loan.dueDay || 5, loan.paidCycles));
    openTx({
      bankId: defaultBankId(data.banks),
      dir: 'out', amount: String(loan.emi),
      note: loan.name + ' EMI', category: 'Loan EMI',
      date: toISO(new Date()), affectsBalance: true,
      link: { type: 'loan', id: loan.id, cycle, monthsAdvanced: 1 }
    });
  };

  const getLoanStatus = (l) => {
    if (l.closed) return { label: 'Paid off', color: 'green' };
    const start = l.startDate ? parseISO(l.startDate) : startOfToday();
    const today = startOfToday();
    const monthsElapsed = (today.getFullYear() - start.getFullYear()) * 12 + (today.getMonth() - start.getMonth());
    const monthsPaid = (l.originalMonths || l.monthsLeft || 0) - (l.monthsLeft || 0);
    const diff = monthsPaid - monthsElapsed;
    if (diff > 0) return { label: 'Ahead by ' + diff + ' months', color: 'green' };
    if (diff === 0) return { label: 'On track', color: 'blue' };
    return { label: 'Behind by ' + Math.abs(diff) + ' months', color: 'red' };
  };

  const getPaidDuration = (l) => {
    if (!l.startDate || !l.closedDate) return '—';
    const start = parseISO(l.startDate); const end = parseISO(l.closedDate);
    const months = (end.getFullYear() - start.getFullYear()) * 12 + (end.getMonth() - start.getMonth());
    return months + ' month' + (months !== 1 ? 's' : '');
  };

  return (
    <div>
      <PageHead title="Loans" sub={'Principal outstanding ' + inr(total) + ' · Future scheduled payments ' + inr(scheduledTotal) + ' · Monthly EMI ' + inr(totalEmi)} sync={sync} openTx={openTx}>
        <div className="seg">
          <button className={'seg-btn' + (sortBy === 'name' ? ' active' : '')} onClick={() => setSortBy('name')}>By name</button>
          <button className={'seg-btn' + (sortBy === 'due' ? ' active' : '')} onClick={() => setSortBy('due')}>By due date</button>
        </div>
        <button className="btn btn-sm btn-primary" onClick={() => { setEdit(null); setFormOpen(true); }}>+ Add Loan</button>
      </PageHead>

      {activeLoans.length === 0 ? (
        <div className="glass"><EmptyState icon={Ico.loan} title="No active loans" sub="Add a loan to track EMIs, months left, interest and payoff progress." action={<button className="btn btn-sm btn-primary" onClick={() => { setEdit(null); setFormOpen(true); }}>Add your first loan</button>} /></div>
      ) : (
        <div className="list">
          {sortedActive.map(l => {
            const due = nextDueDate(l.dueDay || 5, l.paidCycles);
            const dd = daysUntil(due);
            const metrics = loanMetrics(l);
            const computedRemaining = metrics.principal;
            const paidPct = metrics.paidPct === null ? 0 : metrics.paidPct;
            const status = getLoanStatus(l);
            return (
              <div className="item" key={l.id} style={{ flexWrap: 'wrap' }}>
                <div className="item-ico">{Ico.loan}</div>
                <div className="item-body" style={{ minWidth: '220px' }}>
                  <div className="item-name">{l.name}</div>
                  <div className="item-meta">
                    <span className={'pill ' + (dd <= 3 ? 'red' : dd <= 7 ? 'amber' : 'blue')}><span className="pdot"></span>EMI due {relDays(dd)}</span>
                    <span className="pill">{l.monthsLeft || 0} months left</span>
                    <span className="pill amber">{l.rate}% interest</span>
                    <span>{fmtDate(due)}</span>
                  </div>
                  {l.principal ? (<div style={{ marginTop: '10px', maxWidth: '340px' }}><div style={{ height: '4px', borderRadius: '10px', background: 'var(--glass-3)', overflow: 'hidden' }}><div style={{ height: '100%', width: paidPct + '%', background: 'linear-gradient(90deg,var(--green),var(--accent))', borderRadius: '10px', transition: 'width .5s' }}></div></div><div style={{ fontSize: '11px', color: 'var(--muted)', marginTop: '5px' }}>{paidPct}% paid off</div></div>) : null}
                </div>
                <div style={{ textAlign: 'right' }}>
                  <div className="item-amt">{inr(computedRemaining)}</div>
                  <div style={{ fontSize: '11.5px', color: 'var(--muted)', marginTop: '3px' }}>Principal outstanding · EMI {inr(l.emi)}</div>
                  {l.foreclosureAmount ? (<div style={{ fontSize: '11.5px', color: 'var(--amber)', marginTop: '3px' }}>Foreclose at {inr(l.foreclosureAmount)}</div>) : null}
                </div>
                <div className="item-actions">
                  <div style={{ marginRight: '6px' }}><span className={'pill ' + status.color}><span className="pdot"></span>{status.label}</span></div>
                  <button className="btn btn-sm btn-primary" onClick={() => openPay(l)}>Pay</button>
                  <button className="btn btn-sm" onClick={() => markDone(l)}>Done</button>
                  <button className="btn btn-sm btn-warn" onClick={() => skipLoan(l)}>Skip</button>
                  <button className="btn btn-sm" onClick={() => { setEdit(l); setFormOpen(true); }}>Edit</button>
                  <button className="btn btn-sm btn-danger" onClick={() => setConfirmDel(l)}>Delete</button>
                </div>
              </div>
            );
          })}
        </div>
      )}

      {closedLoans.length > 0 && (
        <React.Fragment>
          <div className="section-head">
            <div className="section-title"><span className="dot"></span>Closed Loans History</div>
            <button className="btn btn-sm" onClick={() => setShowHistory(h => !h)}>{showHistory ? 'Hide' : 'Show'} History</button>
          </div>
          {showHistory && (
            <div className="list">
              {sortedClosed.map(l => (
                <div className="item" key={l.id} style={{ opacity: 0.7, flexWrap: 'wrap' }}>
                  <div className="item-ico" style={{ color: 'var(--green)' }}>{Ico.check}</div>
                  <div className="item-body" style={{ minWidth: '220px' }}>
                    <div className="item-name">{l.name}</div>
                    <div className="item-meta">
                      <span className="pill green"><span className="pdot"></span>Paid off</span>
                      <span className="pill">Original: {l.originalMonths || '—'} months</span>
                      <span className="pill blue">Taken: {getPaidDuration(l)}</span>
                      <span>Closed {fmtDate(l.closedDate)}</span>
                    </div>
                  </div>
                  <div style={{ textAlign: 'right' }}>
                    <div className="item-amt" style={{ color: 'var(--green)' }}>{inr(l.principal || 0)}</div>
                    <div style={{ fontSize: '11.5px', color: 'var(--muted)', marginTop: '3px' }}>Total Paid</div>
                  </div>
                  <div className="item-actions">
                    <button className="btn btn-sm" onClick={() => { setEdit(l); setFormOpen(true); }}>Edit</button>
                    <button className="btn btn-sm btn-danger" onClick={() => setConfirmDel(l)}>Delete</button>
                  </div>
                </div>
              ))}
            </div>
          )}
        </React.Fragment>
      )}

      <LoanModal open={formOpen} onClose={() => { setFormOpen(false); setEdit(null); }} loan={edit} onSave={save} />

      <Modal open={!!confirmDel} onClose={() => setConfirmDel(null)} title="Delete this loan?">
        <p style={{ fontSize: '13.5px', color: 'var(--muted)', marginBottom: '18px', lineHeight: 1.55 }}>This removes the loan and its reminders. Cannot be undone.</p>
        <div style={{ display: 'flex', gap: '10px' }}><button className="btn" style={{ flex: 1, justifyContent: 'center' }} onClick={() => setConfirmDel(null)}>Cancel</button><button className="btn btn-danger" style={{ flex: 1, justifyContent: 'center' }} onClick={() => { mut(d => { d.loans = d.loans.filter(x => x.id !== confirmDel.id); }); setConfirmDel(null); showToast('Loan removed'); }}>Delete</button></div>
      </Modal>
    </div>
  );
}

function LoanModal({ open, onClose, loan, onSave }) {
  const [name, setName] = useState('');
  const [emi, setEmi] = useState('');
  const [principal, setPrincipal] = useState('');
  const [rate, setRate] = useState('');
  const [originalMonths, setOriginalMonths] = useState('');
  const [monthsLeft, setMonthsLeft] = useState('');
  const [foreclosure, setForeclosure] = useState('');
  const [dueDay, setDueDay] = useState('');
  const [startDate, setStartDate] = useState(toISO(new Date()));
  const [closed, setClosed] = useState(false);

  useEffect(() => {
    if (open) {
      setName(loan ? loan.name : '');
      setEmi(loan ? String(loan.emi || '') : '');
      setPrincipal(loan ? String(loan.principal || '') : '');
      setRate(loan ? String(loan.rate || '') : '');
      setOriginalMonths(loan ? String(loan.originalMonths || loan.monthsLeft || '') : '');
      setMonthsLeft(loan ? String(loan.monthsLeft || '') : '');
      setForeclosure(loan ? String(loan.foreclosureAmount || '') : '');
      setDueDay(loan ? String(loan.dueDay || '') : '');
      setStartDate(loan ? (loan.startDate || toISO(new Date())) : toISO(new Date()));
      setClosed(loan ? !!loan.closed : false);
    }
  }, [open, loan]);
  if (!open) return null;

  const submit = () => {
    const e = r2(emi);
    const n = Number(monthsLeft) || 0;
    const calculatedRemaining = r2(e * n);
    onSave({
      name: name.trim() || 'Loan', emi: e, remaining: calculatedRemaining,
      principal: r2(principal) || (loan ? (Number(loan.principal) || loanOutstandingPrincipal({ emi: e, rate: r2(rate), monthsLeft: n })) : loanOutstandingPrincipal({ emi: e, rate: r2(rate), monthsLeft: n })), rate: r2(rate),
      originalMonths: Number(originalMonths) || n, monthsLeft: n,
      foreclosureAmount: r2(foreclosure),
      dueDay: Math.min(31, Math.max(1, Number(dueDay) || 5)),
      startDate, closed,
      closedDate: closed && !loan?.closed ? toISO(new Date()) : (loan?.closedDate || null)
    }, loan ? loan.id : null);
  };

  return (
    <Modal open={open} onClose={onClose} title={loan ? 'Edit Loan' : 'Add Loan'} onSubmit={submit}>
      <div className="field"><label className="label">Loan Name</label><input className="input" value={name} onChange={(e) => setName(e.target.value)} placeholder="e.g. Home Loan, Car Loan" /></div>
      <div className="row2">
        <div className="field"><label className="label">EMI Amount</label><MoneyInput value={emi} onChange={setEmi} /></div>
        <div className="field"><label className="label">Interest Rate (%)</label><input className="input" inputMode="decimal" value={rate} onChange={(e) => { const v = e.target.value.replace(/[^\d.]/g, ''); if (/^\d*(\.\d{0,2})?$/.test(v)) setRate(v); }} placeholder="9.5" /></div>
      </div>
      <div className="row2">
        <div className="field"><label className="label">Original Months</label><input className="input" inputMode="numeric" value={originalMonths} onChange={(e) => setOriginalMonths(e.target.value.replace(/\D/g, '').slice(0, 4))} placeholder="43" /></div>
        <div className="field"><label className="label">Months Left</label><input className="input" inputMode="numeric" value={monthsLeft} onChange={(e) => setMonthsLeft(e.target.value.replace(/\D/g, '').slice(0, 4))} placeholder="24" /></div>
      </div>
      <div className="row2">
        <div className="field"><label className="label">Start Date</label><input className="input" type="date" value={startDate} onChange={(e) => setStartDate(e.target.value)} /></div>
        <div className="field"><label className="label">EMI Due Day (1-31)</label><DayInput value={dueDay} onChange={setDueDay} /></div>
      </div>
      <div className="field"><label className="label">Original Loan Amount</label><MoneyInput value={principal} onChange={setPrincipal} /></div>
      <div className="field"><label className="label">Foreclosure Amount (if you close it today)</label><MoneyInput value={foreclosure} onChange={setForeclosure} /></div>
      <div className="switch" onClick={() => setClosed(c => !c)}><div className={'switch-track' + (closed ? ' on' : '')}><div className="switch-knob"></div></div><div className="switch-lbl">Mark as closed (fully paid)</div></div>
      <button className="btn btn-primary" style={{ width: '100%', justifyContent: 'center', padding: '11px' }} onClick={submit}>{loan ? 'Save Changes' : 'Add Loan'}</button>
    </Modal>
  );
}

  const sortedBills = useMemo(() => {
    const arr = data.bills.slice();
    arr.sort((a, b) => { const da = nextDueDate(a.dueDay || 1, a.paidCycles); const db = nextDueDate(b.dueDay || 1, b.paidCycles); if (da - db !== 0) return da - db; return naturalCompare(a.name, b.name); });
    return arr;
  }, [data.bills]);

  const sortedInflows = useMemo(() => {
    const arr = data.inflows.map(f => {
      const due = nextInflowDueDate(f);
      if (!due) return null;
      return { f, due };
    }).filter(Boolean);
    arr.sort((a, b) => { if (a.due - b.due !== 0) return a.due - b.due; return naturalCompare(a.f.name, b.f.name); });
    return arr;
  }, [data.inflows]);

  const saveBill = (payload, id) => {
    mut(d => {
      if (id) { const b = d.bills.find(x => x.id === id); if (b) Object.assign(b, payload); }
      else d.bills.push(Object.assign({ id: uid(), paidCycles: [] }, payload));
    });
    setFormOpen(false); setEdit(null);
    showToast(id ? 'Bill updated' : 'Bill added');
  };

  const saveInflow = (payload, id) => {
    mut(d => {
      if (id) { const f = d.inflows.find(x => x.id === id); if (f) Object.assign(f, payload); }
      else d.inflows.push(Object.assign({ id: uid(), receivedCycles: [] }, payload));
    });
    setInflowOpen(false); setEditInflow(null);
    showToast(id ? 'Updated' : 'Added');
  };

  const markDone = (bill) => {
    const cycle = monthKey(nextDueDate(bill.dueDay || 1, bill.paidCycles));
    mut(d => { const b = d.bills.find(x => x.id === bill.id); if (b) b.paidCycles = (b.paidCycles || []).concat([cycle]); });
    showToast('Marked done for this month');
  };

  const skipBill = (bill) => {
    const cycle = monthKey(nextDueDate(bill.dueDay || 1, bill.paidCycles));
    const id = bill.id;
    mut(d => { const b = d.bills.find(x => x.id === id); if (b) b.paidCycles = (b.paidCycles || []).concat([cycle]); });
    showToast(bill.name + ' skipped · moved to next month', () => {
      mut(d => { const b = d.bills.find(x => x.id === id); if (b) b.paidCycles = (b.paidCycles || []).filter(x => x !== cycle); });
      showToast('Skip undone');
    });
  };

  const openPay = (bill) => {
    const cycle = monthKey(nextDueDate(bill.dueDay || 1, bill.paidCycles));
    openTx({
      bankId: defaultBankId(data.banks),
      dir: 'out', amount: String(bill.amount),
      note: bill.name + ' Bill Payment', category: 'Bills',
      date: toISO(new Date()), affectsBalance: true,
      link: { type: 'bill', id: bill.id, cycle }
    });
  };

  return (
    <div>
      <PageHead title="Bills & Subscriptions" sub={'Total monthly ' + inr(totalBills)} sync={sync} openTx={openTx}>
        <button className="btn btn-sm" onClick={() => { setEditInflow(null); setInflowOpen(true); }}>+ Money In</button>
        <button className="btn btn-sm btn-primary" onClick={() => { setEdit(null); setFormOpen(true); }}>+ Add Bill</button>
      </PageHead>

      <div className="section-head"><div className="section-title"><span className="dot"></span>Recurring Bills</div></div>
      {data.bills.length === 0 ? (
        <div className="glass"><EmptyState icon={Ico.bill} title="No bills yet" sub="Add OTT, rent, wifi or any other recurring payments." action={<button className="btn btn-sm btn-primary" onClick={() => { setEdit(null); setFormOpen(true); }}>Add a bill</button>} /></div>
      ) : (
        <div className="list">
          {sortedBills.map(b => {
            const due = nextDueDate(b.dueDay || 1, b.paidCycles);
            const dd = daysUntil(due);
            return (
              <div className="item" key={b.id}>
                <div className="item-ico">{Ico.bill}</div>
                <div className="item-body"><div className="item-name">{b.name}</div><div className="item-meta"><span className={'pill ' + (dd <= 3 ? 'red' : dd <= 7 ? 'amber' : 'blue')}><span className="pdot"></span>due {relDays(dd)}</span><span>{fmtDate(due)}</span></div></div>
                <div className="item-amt">{inr(b.amount)}</div>
                <div className="item-actions">
                  <button className="btn btn-sm btn-primary" onClick={() => openPay(b)}>Pay</button>
                  <button className="btn btn-sm" onClick={() => markDone(b)}>Done</button>
                  <button className="btn btn-sm btn-warn" onClick={() => skipBill(b)}>Skip</button>
                  <button className="btn btn-sm" onClick={() => { setEdit(b); setFormOpen(true); }}>Edit</button>
                  <button className="btn btn-sm btn-danger" onClick={() => setConfirmDel(b)}>Delete</button>
                </div>
              </div>
            );
          })}
        </div>
      )}

      <div className="section-head"><div className="section-title"><span className="dot"></span>Money Coming In</div></div>
      {sortedInflows.length === 0 ? (
        <div className="glass"><EmptyState icon={Ico.down} title="No incoming payments yet" sub="Add your salary or any expected payments." action={<button className="btn btn-sm btn-primary" onClick={() => { setEditInflow(null); setInflowOpen(true); }}>Add income</button>} /></div>
      ) : (
        <div className="list">
          {sortedInflows.map(({ f, due }) => {
            const dd = daysUntil(due);
            const isOneTime = f.recurring === false;
            return (
              <div className="item" key={f.id}>
                <div className="item-ico" style={{ color: 'var(--green)' }}>{Ico.down}</div>
                <div className="item-body">
                  <div className="item-name">{f.name}</div>
                  <div className="item-meta">
                    <span className="pill green"><span className="pdot"></span>in {dd} days</span>
                    <span>{fmtDate(due)}</span>
                    {isOneTime ? <span className="pill">one-time</span> : <span className="pill blue"><span className="pdot"></span>every month</span>}
                  </div>
                </div>
                <div className="item-amt" style={{ color: 'var(--green)' }}>+{inr(f.amount)}</div>
                <div className="item-actions">
                  <button className="btn btn-sm" onClick={() => { setEditInflow(f); setInflowOpen(true); }}>Edit</button>
                  <button className="btn btn-sm btn-danger" onClick={() => { mut(d => { d.inflows = d.inflows.filter(x => x.id !== f.id); }); showToast('Removed'); }}>Delete</button>
                </div>
              </div>
            );
          })}
        </div>
      )}

      <BillModal open={formOpen} onClose={() => { setFormOpen(false); setEdit(null); }} bill={edit} onSave={saveBill} />
      <InflowFormModal open={inflowOpen} onClose={() => { setInflowOpen(false); setEditInflow(null); }} inflow={editInflow} onSave={saveInflow} />

      <Modal open={!!confirmDel} onClose={() => setConfirmDel(null)} title="Delete this bill?">
        <p style={{ fontSize: '13.5px', color: 'var(--muted)', marginBottom: '18px', lineHeight: 1.55 }}>Removes the bill and its reminder.</p>
        <div style={{ display: 'flex', gap: '10px' }}><button className="btn" style={{ flex: 1, justifyContent: 'center' }} onClick={() => setConfirmDel(null)}>Cancel</button><button className="btn btn-danger" style={{ flex: 1, justifyContent: 'center' }} onClick={() => { mut(d => { d.bills = d.bills.filter(x => x.id !== confirmDel.id); }); setConfirmDel(null); showToast('Bill removed'); }}>Delete</button></div>
      </Modal>
    </div>
  );
}

function BillModal({ open, onClose, bill, onSave }) {
  const [name, setName] = useState('');
  const [amount, setAmount] = useState('');
  const [dueDay, setDueDay] = useState('');
  useEffect(() => { if (open) { setName(bill ? bill.name : ''); setAmount(bill ? String(bill.amount || '') : ''); setDueDay(bill ? String(bill.dueDay || '') : ''); } }, [open, bill]);
  if (!open) return null;
  const submit = () => onSave({ name: name.trim() || 'Bill', amount: r2(amount), dueDay: Math.min(31, Math.max(1, Number(dueDay) || 1)) }, bill ? bill.id : null);

    <Modal open={open} onClose={onClose} title={bill ? 'Edit Bill' : 'Add Bill'} onSubmit={submit}>

        <div className="field"><label className="label">Amount</label><MoneyInput value={amount} onChange={setAmount} /></div>

      </div>

}

function InflowFormModal({ open, onClose, inflow, onSave }) {
  const [name, setName] = useState('');
  const [amount, setAmount] = useState('');
  const [day, setDay] = useState('');
  const [date, setDate] = useState(toISO(new Date()));
  const [recurring, setRecurring] = useState(true);

  useEffect(() => {
    if (open) {
      setName(inflow ? inflow.name : '');
      setAmount(inflow ? String(inflow.amount || '') : '');
      setDay(inflow ? String(inflow.day || '') : '');
      setDate(inflow && inflow.date ? inflow.date : toISO(new Date()));
      setRecurring(inflow ? (inflow.recurring !== false) : true);
    }
  }, [open, inflow]);
  if (!open) return null;

  const submit = () => {
    const base = { name: name.trim() || 'Income', amount: r2(amount), recurring };
    if (recurring) {
      base.day = Math.min(31, Math.max(1, Number(day) || 1));
      if (inflow && inflow.date) base.date = null;
    } else {
      base.date = date;
      if (inflow && inflow.day) base.day = null;
    }
    onSave(base, inflow ? inflow.id : null);
  };

  return (
    <Modal open={open} onClose={onClose} title={inflow ? 'Edit Incoming Payment' : 'Add Incoming Payment'} onSubmit={submit}>
      <div className="field"><label className="label">Name</label><input className="input" value={name} onChange={(e) => setName(e.target.value)} placeholder="e.g. Salary, Rent from tenant" /></div>
      <div className="field"><label className="label">Expected Amount</label><MoneyInput value={amount} onChange={setAmount} /></div>

      <div className="field">
        <label className="label">Frequency</label>
        <div className="seg seg-full">
          <button type="button" className={'seg-btn' + (recurring ? ' active' : '')} onClick={() => setRecurring(true)}>{Ico.repeat} Every month</button>
          <button type="button" className={'seg-btn' + (!recurring ? ' active' : '')} onClick={() => setRecurring(false)}>{Ico.onetime} Just once</button>
        </div>
        <div style={{ fontSize: '11.5px', color: 'var(--muted)', marginTop: '7px', lineHeight: 1.5 }}>
          {recurring ? 'You will be reminded on this day every month. Once received, it moves to next month automatically.' : 'This is a one-time payment on a specific date. After you confirm receiving it, it will disappear.'}
        </div>
      </div>

      {recurring ? (
        <div className="field"><label className="label">Day of Month (1-31)</label><DayInput value={day} onChange={setDay} /></div>
      ) : (
        <div className="field"><label className="label">Expected Date</label><input className="input" type="date" value={date} onChange={(e) => setDate(e.target.value)} /></div>
      )}

      <button className="btn btn-primary" style={{ width: '100%', justifyContent: 'center', padding: '11px' }} onClick={submit}>{inflow ? 'Save Changes' : 'Add'}</button>
    </Modal>
  );
}

function DematCalendar({ account, onSetValue, onClearValue }) {
  const today = startOfToday();
  const [viewYear, setViewYear] = useState(today.getFullYear());
  const [viewMonth, setViewMonth] = useState(today.getMonth());
  const [editDate, setEditDate] = useState(null);
  const [editVal, setEditVal] = useState('');

  const history = useMemo(() => { const map = {}; (account.history || []).forEach(h => { map[h.date] = Number(h.value) || 0; }); return map; }, [account.history]);
  const withdrawalsByDate = useMemo(() => { const map = {}; (account.withdrawals || []).forEach(w => { map[w.date] = r2((map[w.date] || 0) + (Number(w.amount) || 0)); }); return map; }, [account.withdrawals]);

  const firstDay = new Date(viewYear, viewMonth, 1);
  const startDow = firstDay.getDay();
  const dim = daysInMonth(viewYear, viewMonth);

  const cells = [];
  for (let i = 0; i < startDow; i++) cells.push({ empty: true, key: 'e' + i });
  for (let d = 1; d <= dim; d++) {
    const iso = viewYear + '-' + pad(viewMonth + 1) + '-' + pad(d);
    const val = history[iso];
    let prevVal = null;
    const sortedKeys = Object.keys(history).sort();
    for (let k = 0; k < sortedKeys.length; k++) { if (sortedKeys[k] < iso) prevVal = history[sortedKeys[k]]; else break; }
    const rawPnl = (val !== undefined && prevVal !== null) ? r2(val - prevVal) : null;
    const wd = withdrawalsByDate[iso] || 0;
    const pnl = rawPnl !== null ? r2(rawPnl + wd) : null;
    cells.push({ empty: false, key: iso, day: d, iso, val: val !== undefined ? val : null, pnl, wd, isToday: iso === toISO(today) });
  }
  while (cells.length % 7 !== 0) cells.push({ empty: true, key: 'pe' + cells.length });

  const monthLabel = MONTHS_FULL[viewMonth] + ' ' + viewYear;
  const monthEntries = (account.history || []).filter(h => h.date.startsWith(viewYear + '-' + pad(viewMonth + 1)));
  let monthStart = null, monthEnd = null;
  if (monthEntries.length) {
    const sorted = monthEntries.slice().sort((a, b) => a.date.localeCompare(b.date));
    monthStart = Number(sorted[0].value); monthEnd = Number(sorted[sorted.length - 1].value);
  }
  const monthWithdrawals = (account.withdrawals || []).filter(w => w.date.startsWith(viewYear + '-' + pad(viewMonth + 1))).reduce((s, w) => s + (Number(w.amount) || 0), 0);
  const monthPnl = (monthStart !== null && monthEnd !== null) ? r2(monthEnd - monthStart + monthWithdrawals) : null;

  const prevMonth = () => { if (viewMonth === 0) { setViewMonth(11); setViewYear(y => y - 1); } else setViewMonth(m => m - 1); };
  const nextMonth = () => { if (viewMonth === 11) { setViewMonth(0); setViewYear(y => y + 1); } else setViewMonth(m => m + 1); };

  const openEdit = (cell) => { if (cell.empty) return; setEditDate(cell.iso); setEditVal(cell.val !== null ? String(cell.val) : ''); };
  const saveEdit = () => { if (!editDate) return; if (editVal === '' || editVal === null) onClearValue(editDate); else onSetValue(editDate, r2(editVal)); setEditDate(null); };
  const clearEdit = () => { if (!editDate) return; onClearValue(editDate); setEditDate(null); };

  return (
    <div>
      <div className="cal-nav">
        <button className="icon-btn" onClick={prevMonth}>{Ico.chevLeft}</button>
        <div className="cal-nav-title">{monthLabel}</div>
        <button className="icon-btn" onClick={nextMonth}>{Ico.chevRight}</button>
      </div>
      <div className="cal-wrap">
        {DOW.map(d => <div className="cal-dow" key={d}>{d}</div>)}
        {cells.map(c => c.empty ? (<div key={c.key} className="cal-cell empty"></div>) : (
          <div key={c.key} className={'cal-cell' + (c.isToday ? ' today' : '') + (c.val !== null ? ' has-value' : '')} onClick={() => openEdit(c)} title={c.val !== null ? inr(c.val) + (c.wd > 0 ? ' (withdrew ' + inr(c.wd) + ')' : '') : 'Click to set value'}>
            <div className="cal-day-num">{c.day}</div>
            {c.val !== null && (<React.Fragment><div className="cal-val">{inr(c.val)}</div>{c.pnl !== null && Math.abs(c.pnl) > 0.005 && (<div className={'cal-pnl ' + (c.pnl >= 0 ? 'up' : 'down')}>{c.pnl >= 0 ? '+' : ''}{money(c.pnl)}</div>)}</React.Fragment>)}
          </div>
        ))}
      </div>
      <div className="cal-month-stats">
        <div className="cal-stat"><div className="cal-stat-label">Month start</div><div className="cal-stat-val" style={{ color: monthStart !== null ? 'var(--txt)' : 'var(--muted)' }}>{monthStart !== null ? inr(monthStart) : '—'}</div></div>
        <div className="cal-stat"><div className="cal-stat-label">Month end</div><div className="cal-stat-val" style={{ color: monthEnd !== null ? 'var(--txt)' : 'var(--muted)' }}>{monthEnd !== null ? inr(monthEnd) : '—'}</div></div>
        <div className="cal-stat"><div className="cal-stat-label">Month P&L</div><div className="cal-stat-val" style={{ color: monthPnl === null ? 'var(--muted)' : (monthPnl >= 0 ? 'var(--green)' : 'var(--red)') }}>{monthPnl !== null ? (monthPnl >= 0 ? '+' : '') + money(monthPnl) : '—'}</div></div>
      </div>
      <Modal open={!!editDate} onClose={() => setEditDate(null)} title={editDate ? 'Demat value on ' + fmtDate(editDate) : ''} onSubmit={saveEdit}>
        <div className="field"><label className="label">Capital / Value (₹)</label><MoneyInput value={editVal} onChange={setEditVal} autoFocus /></div>
        <div style={{ fontSize: '11.5px', color: 'var(--muted)', marginBottom: '14px', lineHeight: 1.5 }}>Enter the total demat value on this date. P&L for the day will be calculated from the previous entry.</div>
        <div style={{ display: 'flex', gap: '10px' }}>
          <button className="btn" style={{ flex: 1, justifyContent: 'center' }} onClick={() => setEditDate(null)}>Cancel</button>
          {editDate && history[editDate] !== undefined && (<button className="btn btn-danger" style={{ justifyContent: 'center' }} onClick={clearEdit}>Clear</button>)}
          <button className="btn btn-primary" style={{ flex: 1, justifyContent: 'center' }} onClick={saveEdit}>Save</button>
        </div>
      </Modal>
    </div>
  );
}

function Demat({ data, mut, showToast, sync, openTx }) {
  const [formOpen, setFormOpen] = useState(false);
  const [edit, setEdit] = useState(null);
  const [updateTarget, setUpdateTarget] = useState(null);
  const [updateVal, setUpdateVal] = useState('');
  const [selected, setSelected] = useState('all');
  const [calAccountId, setCalAccountId] = useState(data.demats[0] ? data.demats[0].id : '');
  const [confirmDel, setConfirmDel] = useState(null);

  const total = data.demats.reduce((s, d) => s + (Number(d.balance) || 0), 0);

  useEffect(() => { if (data.demats.length && !data.demats.find(d => d.id === calAccountId)) setCalAccountId(data.demats[0].id); }, [data.demats]);

  const chartPoints = useMemo(() => {
    const accounts = selected === 'all' ? data.demats : data.demats.filter(d => d.id === selected);
    const dates = {};
    accounts.forEach(a => (a.history || []).forEach(h => { dates[h.date] = true; }));
    const sorted = Object.keys(dates).sort();
    if (sorted.length === 0) { const now = accounts.filter(a => Number(a.balance) > 0); if (!now.length) return []; return [{ date: toISO(new Date()), value: r2(now.reduce((s, a) => s + (Number(a.balance) || 0), 0)) }]; }
    return sorted.map(dt => {
      let sum = 0;
      accounts.forEach(a => {
        const hs = (a.history || []).filter(h => h.date <= dt).sort((x, y) => x.date.localeCompare(y.date));
        let base = hs.length ? Number(hs[hs.length - 1].value) || 0 : Number(a.balance) || 0;
        const cumWith = (a.withdrawals || []).filter(w => w.date <= dt).reduce((s, w) => s + (Number(w.amount) || 0), 0);
        sum += base + cumWith;
      });
      return { date: dt, value: r2(sum) };
    });
  }, [data.demats, selected]);

  const calAccount = data.demats.find(d => d.id === calAccountId) || data.demats[0];

  const setCalValue = (date, value) => {
    if (!calAccount) return;
    mut(d => {
      const a = d.demats.find(x => x.id === calAccount.id);
      if (!a) return;
      a.history = (a.history || []).filter(h => h.date !== date);
      a.history.push({ date, value });
      a.history.sort((x, y) => x.date.localeCompare(y.date));
      if (date === toISO(new Date())) a.balance = value;
      const latest = a.history[a.history.length - 1];
      if (latest && latest.date === date) a.balance = value;
    });
    showToast('Saved for ' + fmtDate(date));
  };

  const clearCalValue = (date) => {
    if (!calAccount) return;
    mut(d => { const a = d.demats.find(x => x.id === calAccount.id); if (!a) return; a.history = (a.history || []).filter(h => h.date !== date); });
    showToast('Cleared entry');
  };

  const saveAccount = (name, balance, id) => {
    mut(d => {
      if (id) { const a = d.demats.find(x => x.id === id); if (a) { a.name = name; a.balance = r2(balance); } }
      else d.demats.push({ id: uid(), name, balance: r2(balance), history: [{ date: toISO(new Date()), value: r2(balance) }], withdrawals: [] });
    });
    setFormOpen(false); setEdit(null);
    showToast(id ? 'Demat updated' : 'Demat added');
  };

  const saveUpdate = () => {
    const v = r2(updateVal);
    mut(d => {
      const a = d.demats.find(x => x.id === updateTarget.id);
      if (!a) return;
      a.balance = v;
      a.history = (a.history || []).filter(h => h.date !== toISO(new Date()));
      a.history.push({ date: toISO(new Date()), value: v });
      a.history.sort((x, y) => x.date.localeCompare(y.date));
    });
    setUpdateTarget(null);
    showToast('Demat balance updated');
  };

  const openWithdraw = (item) => {
    openTx({
      dir: 'in', category: 'Upstox Withdrawal', amount: '',
      note: 'Withdrawn from ' + item.name, date: toISO(new Date()),
      affectsBalance: true, bankId: defaultBankId(data.banks),
      link: { type: 'demat', id: item.id }
    });
  };

  const editWithdrawal = (w) => {
    const tx = data.transactions.find(t => t.id === w.txId);
    if (tx) {
      openTx({
        bankId: tx.bankId, dir: tx.dir, amount: String(tx.amount),
        note: tx.note, category: tx.category, date: tx.date,
        affectsBalance: tx.affectsBalance !== false, link: tx.link
      });
    }
  };

  const deleteWithdrawal = (w) => {
    mut(d => {
      const a = d.demats.find(x => x.id === w.dematId);
      if (!a) return;
      const entry = (a.withdrawals || []).find(x => x.txId === w.txId);
      if (entry) {
        a.balance = r2(a.balance + (Number(entry.amount) || 0));
        a.withdrawals = (a.withdrawals || []).filter(x => x.txId !== w.txId);
      }
      const tx = d.transactions.find(t => t.id === w.txId);
      if (tx) {
        if (tx.affectsBalance && tx.bankId) {
          const b = d.banks.find(x => x.id === tx.bankId);
          if (b) b.balance = r2(b.balance - (tx.dir === 'in' ? tx.amount : -tx.amount));
        }
        d.transactions = d.transactions.filter(t => t.id !== w.txId);
      }
    });
    showToast('Withdrawal deleted');
  };

  const allWithdrawals = useMemo(() => {
    const list = [];
    data.demats.forEach(a => { (a.withdrawals || []).forEach(w => { list.push({ ...w, dematId: a.id, dematName: a.name }); }); });
    list.sort((a, b) => String(b.date).localeCompare(String(a.date)));
    return list;
  }, [data.demats]);

  return (
    <div>
      <PageHead title="Demat Accounts" sub={'Total value ' + inr(total)} sync={sync} openTx={openTx}>
        <button className="btn btn-sm btn-primary" onClick={() => { setEdit(null); setFormOpen(true); }}>+ Add Demat</button>
      </PageHead>

      <div className="glass" style={{ padding: '20px', marginBottom: '18px' }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: '12px', marginBottom: '14px' }}>
          <div className="section-title"><span className="dot"></span>Portfolio Progress</div>
          <select className="select" style={{ maxWidth: '230px' }} value={selected} onChange={(e) => setSelected(e.target.value)}>
            <option value="all">All accounts</option>
            {data.demats.map(d => <option key={d.id} value={d.id}>{d.name}</option>)}
          </select>
        </div>
        <LineChart points={chartPoints} />
      </div>

      {calAccount && (
        <React.Fragment>
          <div className="section-head">
            <div className="section-title"><span className="dot"></span>Daily P&L Calendar</div>
            <select className="select" style={{ maxWidth: '230px' }} value={calAccountId} onChange={(e) => setCalAccountId(e.target.value)}>
              {data.demats.map(d => <option key={d.id} value={d.id}>{d.name}</option>)}
            </select>
          </div>
          <div className="glass" style={{ padding: '20px', marginBottom: '18px' }}><DematCalendar account={calAccount} onSetValue={setCalValue} onClearValue={clearCalValue} /></div>
        </React.Fragment>
      )}

      <div className="grid g2">
        {data.demats.map(a => (
          <div className="glass" style={{ padding: '18px' }} key={a.id}>
            <div className="kpi-label">{a.name}</div>
            <div style={{ fontSize: '22px', fontWeight: 700, marginTop: '8px', letterSpacing: '-.6px' }} className="mono">{inr(a.balance)}</div>
            <div style={{ fontSize: '11.5px', color: 'var(--muted)', marginTop: '6px' }}>{(a.history || []).length} entries · last {(a.history && a.history.length) ? fmtDate(a.history[a.history.length - 1].date) : '—'}</div>
            <div className="item-actions" style={{ marginTop: '14px' }}>
              <button className="btn btn-sm btn-primary" onClick={() => { setUpdateTarget(a); setUpdateVal(String(a.balance)); }}>Update Today</button>
              <button className="btn btn-sm" onClick={() => openWithdraw(a)}>Withdraw</button>
              <button className="btn btn-sm" onClick={() => { setEdit(a); setFormOpen(true); }}>Edit</button>
              <button className="btn btn-sm btn-danger" onClick={() => setConfirmDel(a)}>Delete</button>
            </div>
          </div>
        ))}
      </div>

      <div className="section-head">
        <div className="section-title"><span className="dot"></span>Withdrawal Log</div>
        <span className="pill blue">{allWithdrawals.length} withdrawal{allWithdrawals.length !== 1 ? 's' : ''}</span>
      </div>
      <div className="glass" style={{ padding: '14px' }}>
        {allWithdrawals.length === 0 ? (
          <EmptyState icon={Ico.up} title="No withdrawals yet" sub="Use the Withdraw button on any demat account. Each withdrawal automatically creates a bank transaction and is synced here." />
        ) : (
          <div className="list">
            {allWithdrawals.map((w, i) => (
              <div className="item" key={w.txId || i}>
                <div className="item-ico" style={{ color: 'var(--green)' }}>{Ico.down}</div>
                <div className="item-body">
                  <div className="item-name">Withdrawn from {w.dematName}</div>
                  <div className="item-meta">
                    <span className="pill blue"><span className="pdot"></span>{fmtDate(w.date)}</span>
                    <span className="pill green">+{inr(w.amount)}</span>
                    {w.txId ? <span className="pill">linked to bank</span> : <span className="pill amber">unlinked</span>}
                  </div>
                </div>
                <div className="item-amt" style={{ color: 'var(--green)' }}>+{inr(w.amount)}</div>
                <div className="item-actions">
                  {w.txId ? (<button className="btn btn-sm" onClick={() => editWithdrawal(w)}>Edit</button>) : null}
                  <button className="btn btn-sm btn-danger" onClick={() => deleteWithdrawal(w)}>Delete</button>
                </div>
              </div>
            ))}
          </div>
        )}
      </div>

      <Modal open={!!updateTarget} onClose={() => setUpdateTarget(null)} title="Update Today's Balance" onSubmit={saveUpdate}>
        <div className="field"><label className="label">Current value of {updateTarget ? updateTarget.name : ''}</label><MoneyInput value={updateVal} onChange={setUpdateVal} /></div>
        <button className="btn btn-primary" style={{ width: '100%', justifyContent: 'center', padding: '11px' }} onClick={saveUpdate}>Save Today's Value</button>
      </Modal>

      <DematModal open={formOpen} onClose={() => { setFormOpen(false); setEdit(null); }} account={edit} onSave={saveAccount} />

      <Modal open={!!confirmDel} onClose={() => setConfirmDel(null)} title="Delete this demat account?">
        <p style={{ fontSize: '13.5px', color: 'var(--muted)', marginBottom: '18px', lineHeight: 1.55 }}>All history for this account will be removed.</p>
        <div style={{ display: 'flex', gap: '10px' }}><button className="btn" style={{ flex: 1, justifyContent: 'center' }} onClick={() => setConfirmDel(null)}>Cancel</button><button className="btn btn-danger" style={{ flex: 1, justifyContent: 'center' }} onClick={() => { mut(d => { d.demats = d.demats.filter(x => x.id !== confirmDel.id); }); setConfirmDel(null); showToast('Demat removed'); }}>Delete</button></div>
      </Modal>
    </div>
  );
}

function DematModal({ open, onClose, account, onSave }) {
  const [name, setName] = useState('');
  const [balance, setBalance] = useState('');
  useEffect(() => { if (open) { setName(account ? account.name : ''); setBalance(account ? String(account.balance || '') : ''); } }, [open, account]);
  if (!open) return null;
  const submit = () => onSave(name.trim() || 'Demat', balance, account ? account.id : null);
  return (
    <Modal open={open} onClose={onClose} title={account ? 'Edit Demat Account' : 'Add Demat Account'} onSubmit={submit}>
      <div className="field"><label className="label">Account Name</label><input className="input" value={name} onChange={(e) => setName(e.target.value)} placeholder="e.g. Zerodha, Groww" /></div>
      <div className="field"><label className="label">Current Value</label><MoneyInput value={balance} onChange={setBalance} /></div>
      <button className="btn btn-primary" style={{ width: '100%', justifyContent: 'center', padding: '11px' }} onClick={submit}>{account ? 'Save' : 'Add Account'}</button>
    </Modal>
  );
}

function AiBrain({ data, sync, openTx }) {
  const [extra, setExtra] = useState('5000');
  const [chatMessages, setChatMessages] = useState([]);
  const [chatInput, setChatInput] = useState('');
  const [chatContext, setChatContext] = useState({});
  const chatEndRef = useRef(null);

  const snapshot = useMemo(() => financialSnapshot(data), [data]);
  const bankTotal = snapshot.bankTotal;
  const dematTotal = snapshot.dematTotal;
  const cardDebt = snapshot.cardDebt;
  const activeLoans = snapshot.activeLoans;
  const loanDebt = snapshot.loanDebt;
  const scheduledLoanPayments = snapshot.scheduledLoanPayments;
  const assets = snapshot.assets;
  const liabilities = snapshot.liabilities;
  const netWorth = snapshot.netWorth;

  const mk = monthKey(new Date());
  const monthTx = data.transactions.filter(t => String(t.date).startsWith(mk));
  const mIn = r2(monthTx.filter(t => t.dir === 'in').reduce((s, t) => s + (Number(t.amount) || 0), 0));
  const mOut = r2(monthTx.filter(t => t.dir === 'out').reduce((s, t) => s + (Number(t.amount) || 0), 0));

  const sortedLoans = activeLoans.slice().sort((a, b) => (Number(b.rate) || 0) - (Number(a.rate) || 0));
  const smallest = activeLoans.slice().sort((a, b) => loanOutstandingPrincipal(a) - loanOutstandingPrincipal(b));
  const sortedCards = data.cards.slice().sort((a, b) => (Number(b.outstanding) || 0) - (Number(a.outstanding) || 0));

  const base = useMemo(() => simulateLoans(activeLoans, 0), [activeLoans]);
  const withExtra = useMemo(() => simulateLoans(activeLoans, r2(extra) || 0), [activeLoans, extra]);
  const monthsSaved = Math.max(0, base.months - withExtra.months);
  const interestSaved = r2(Math.max(0, base.totalInterest - withExtra.totalInterest));

  const insights = [];
  if (liabilities === 0) insights.push({ icon: Ico.check, title: 'You are debt free', text: 'No active loans and no credit card outstanding. Keep building your investments.' });
  if (cardDebt > 0) insights.push({ icon: Ico.card, title: 'Credit cards first', text: 'Credit card interest is usually 36% to 42% a year, way higher than most loans. Clear ' + (sortedCards[0] ? sortedCards[0].name : 'your card') + ' (' + inr(sortedCards[0] ? sortedCards[0].outstanding : 0) + ') before making extra payments on loans.' });
  if (sortedLoans.length > 0) {
    const top = sortedLoans[0];
    insights.push({ icon: Ico.loan, title: 'Attack this loan first', text: top.name + ' has the highest interest at ' + top.rate + '% a year. Put any extra money here first.' });
    const small = smallest[0];
    if (small !== top) {
      const smallRemaining = loanOutstandingPrincipal(small);
      insights.push({ icon: Ico.sparkle, title: 'Or try the quick win', text: 'If you need motivation, close ' + small.name + ' first. Only ' + inr(smallRemaining) + ' left.' });
    }
  }
  if (bankTotal > 0 && bankTotal < mOut) insights.push({ icon: Ico.bank, title: 'Thin cushion', text: 'Your bank balance is less than one month of spending. Try to keep at least 3 months of expenses (' + inr(r2(mOut * 3)) + ') as an emergency fund.' });
  else if (mOut > 0) insights.push({ icon: Ico.bank, title: 'Emergency fund check', text: 'A safe cushion is about 3 to 6 months of expenses. For you that is ' + inr(r2(mOut * 3)) + ' to ' + inr(r2(mOut * 6)) + '.' });
  if (mIn > 0) {
    const rate = r2(((mIn - mOut) / mIn) * 100);
    insights.push({ icon: Ico.sparkle, title: 'This month savings rate: ' + rate + '%', text: rate >= 20 ? 'Great going. You are keeping ' + inr(r2(mIn - mOut)) + ' this month.' : rate >= 0 ? 'You are saving ' + inr(r2(mIn - mOut)) + '. Try to push this above 20%.' : 'You spent more than you earned by ' + inr(Math.abs(r2(mIn - mOut))) + '.' });
  }
  const catTotals = {};
  monthTx.filter(t => t.dir === 'out').forEach(t => { const c = t.category || 'Other'; catTotals[c] = r2((catTotals[c] || 0) + (Number(t.amount) || 0)); });
  const topCats = Object.keys(catTotals).map(k => ({ k, v: catTotals[k] })).sort((a, b) => b.v - a.v).slice(0, 3);
  if (topCats.length) insights.push({ icon: Ico.bill, title: 'Where your money went this month', text: topCats.map(c => c.k + ' ' + inr(c.v)).join(' · ') });
  if (base.months > 0) insights.push({ icon: Ico.sparkle, title: 'Debt free in about ' + base.months + ' months', text: 'If you keep paying your normal EMIs, you will be debt free around ' + fmtDate(new Date(new Date().getFullYear(), new Date().getMonth() + base.months, 1)) + '.' });

  const foreclosable = activeLoans.filter(l => Number(l.foreclosureAmount) > 0);
  const bestForeclose = foreclosable.slice().sort((a, b) => (Number(b.rate) || 0) - (Number(a.rate) || 0))[0];

  useEffect(() => { if (chatEndRef.current) chatEndRef.current.scrollIntoView({ behavior: 'smooth' }); }, [chatMessages]);

  const sendChat = (text) => {
    const q = String(text || chatInput).trim();
    if (!q) return;
    const res = aiAnswer(q, data, chatContext);
    const answer = typeof res === 'string' ? res : res.text;
    const newCtx = (res && typeof res === 'object' && res.context) ? res.context : chatContext;
    setChatMessages(m => m.concat([{ role: 'user', text: q }, { role: 'bot', text: answer }]));
    setChatContext(newCtx);
    setChatInput('');
  };

  const clearChat = () => {
    setChatMessages([]);
    setChatContext({});
    setChatInput('');
  };

  return (
    <div>
      <PageHead title="AI Brain" sub="Smart money analysis based on your real data" sync={sync} openTx={openTx} />
      <div className="grid g3" style={{ marginBottom: '18px' }}>
        <div className="kpi glass"><div className="kpi-head"><span className="kpi-dot green"></span><span className="kpi-label">Assets</span></div><div className="kpi-val" style={{ color: 'var(--green)' }}>{inr(assets)}</div><div className="kpi-note">Banks {inr(bankTotal)} + Demat {inr(dematTotal)}</div></div>
        <div className="kpi glass"><div className="kpi-head"><span className="kpi-dot red"></span><span className="kpi-label">Debts</span></div><div className="kpi-val" style={{ color: 'var(--red)' }}>{inr(liabilities)}</div><div className="kpi-note">Loan principal {inr(loanDebt)} + Cards {inr(cardDebt)}</div></div>
        <div className="kpi glass"><div className="kpi-head"><span className="kpi-dot amber"></span><span className="kpi-label">Net Worth</span></div><div className="kpi-val">{inr(netWorth)}</div><div className="kpi-note">{inr(assets)} − {inr(liabilities)}</div></div>
      </div>

      <div className="section-head">
        <div className="section-title"><span className="dot"></span>Ask the AI</div>
        <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
          <span className="pill blue">Powered by your real data</span>
          {chatMessages.length > 0 ? (<button className="btn btn-sm btn-danger" onClick={clearChat}>{Ico.trash} Clear chat</button>) : null}
        </div>
      </div>
      <div className="glass" style={{ padding: '20px' }}>
        <div className="chat-wrap">
          {chatMessages.length === 0 ? (
            <div className="chat-msg">
              <div className="chat-avatar bot">AI</div>
              <div className="chat-bubble bot">
                Hi! I'm your money brain. I read your real numbers — balances, EMIs, card dues, this month's spending — and give you a specific plan.{'\n\n'}Ask me anything. Examples:{'\n'}• "I'll get 1.3L this month — where should I put it? Keep 5k in bank"{'\n'}• "Should I foreclose my Navi loan?"{'\n'}• "Which loan should I pay first?"
              </div>
            </div>
          ) : (
            chatMessages.map((m, i) => (
              <div key={i} className={'chat-msg ' + m.role}>
                <div className={'chat-avatar ' + m.role}>{m.role === 'user' ? 'You' : 'AI'}</div>
                <div className={'chat-bubble ' + m.role} dangerouslySetInnerHTML={{ __html: String(m.text).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\*\*(.+?)\*\*/g, '<b>$1</b>') }} />
              </div>
            ))
          )}
          <div ref={chatEndRef} />
        </div>
        <div className="chat-input-row">
          <input className="input" placeholder="Ask anything… e.g. I'll get 1.3L this month, where should I put it? Keep 2k in bank"
            value={chatInput}
            onChange={(e) => setChatInput(e.target.value)}
            onKeyDown={(e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChat(); } }} />
          <button className="btn btn-primary" onClick={() => sendChat()} style={{ padding: '10px 14px' }}>{Ico.send}<span style={{ marginLeft: 4 }}>Send</span></button>
        </div>
      </div>

      <div className="section-head"><div className="section-title"><span className="dot"></span>What the AI sees</div></div>
      <div className="list">
        {insights.map((ins, i) => (
          <div className="item" key={i}><div className="item-ico" style={{ color: 'var(--accent)' }}>{ins.icon}</div><div className="item-body"><div className="item-name">{ins.title}</div><div style={{ fontSize: '12.5px', color: 'var(--muted)', marginTop: '6px', lineHeight: 1.55 }}>{ins.text}</div></div></div>
        ))}
      </div>

      <div className="section-head"><div className="section-title"><span className="dot"></span>Extra Payment Planner</div></div>
      <div className="glass" style={{ padding: '20px' }}>
        <div className="field" style={{ maxWidth: '320px' }}><label className="label">If I put this much extra every month</label><MoneyInput value={extra} onChange={setExtra} /></div>
        <div className="grid g3" style={{ marginTop: '6px' }}>
          <div className="glass-soft" style={{ padding: '14px' }}><div className="kpi-label">Debt free in</div><div style={{ fontSize: '19px', fontWeight: 700, marginTop: '6px', letterSpacing: '-.4px' }} className="mono">{withExtra.months} months</div><div style={{ fontSize: '11.5px', color: 'var(--muted)', marginTop: '4px' }}>Normal EMI: {base.months} months</div></div>
          <div className="glass-soft" style={{ padding: '14px' }}><div className="kpi-label">Months saved</div><div style={{ fontSize: '19px', fontWeight: 700, marginTop: '6px', letterSpacing: '-.4px', color: 'var(--green)' }} className="mono">{monthsSaved}</div><div style={{ fontSize: '11.5px', color: 'var(--muted)', marginTop: '4px' }}>That is {r2(monthsSaved / 12)} years faster</div></div>
          <div className="glass-soft" style={{ padding: '14px' }}><div className="kpi-label">Interest saved</div><div style={{ fontSize: '19px', fontWeight: 700, marginTop: '6px', letterSpacing: '-.4px', color: 'var(--green)' }} className="mono">{inr(interestSaved)}</div><div style={{ fontSize: '11.5px', color: 'var(--muted)', marginTop: '4px' }}>Total interest now {inr(base.totalInterest)}</div></div>
        </div>
        {sortedLoans.length > 0 && r2(extra) > 0 ? (<div style={{ marginTop: '16px', fontSize: '12.5px', color: 'var(--muted)', lineHeight: 1.6 }}>Put the extra <b style={{ color: 'var(--txt)' }}>{inr(extra)}</b> into <b style={{ color: 'var(--txt)' }}>{sortedLoans[0].name}</b> first because it charges the highest interest at {sortedLoans[0].rate}% a year.</div>) : null}
      </div>

      {bestForeclose ? (
        <React.Fragment>
          <div className="section-head"><div className="section-title"><span className="dot"></span>Foreclosure Advice</div></div>
          <div className="glass" style={{ padding: '20px', fontSize: '13px', lineHeight: 1.7 }}>
            <b>{bestForeclose.name}</b> has an estimated principal outstanding of <b>{inr(loanOutstandingPrincipal(bestForeclose))}</b> and <b>{bestForeclose.monthsLeft || 0} months</b> left at <b>{bestForeclose.rate}%</b>. The lender's foreclosure quote is <b>{inr(bestForeclose.foreclosureAmount)}</b>. Future scheduled EMI payments total about <b>{inr(loanScheduledPayments(bestForeclose))}</b>, so paying the quote instead of those scheduled payments would reduce future cash outflow by roughly <b>{inr(r2(Math.max(0, loanScheduledPayments(bestForeclose) - Number(bestForeclose.foreclosureAmount))))}</b> before any fees, taxes or other contractual charges. {Number(bankTotal) >= Number(bestForeclose.foreclosureAmount) ? ' You have enough in the bank to do this right now.' : ' You need ' + inr(r2(Number(bestForeclose.foreclosureAmount) - bankTotal)) + ' more in the bank to do this today.'}
          </div>
        </React.Fragment>
      ) : null}

      <div className="section-head"><div className="section-title"><span className="dot"></span>Payoff Order</div></div>
      <div className="list">
        {sortedLoans.length === 0 && sortedCards.length === 0 ? (<div className="glass"><EmptyState icon={Ico.check} title="Nothing to pay off" sub="You are debt free. Nice." /></div>) : null}
        {sortedLoans.map((l, i) => (
          <div className="item" key={l.id}>
            <div className="item-ico" style={{ fontWeight: 700, fontSize: '14px' }}>{i + 1}</div>
            <div className="item-body"><div className="item-name">{l.name}</div><div className="item-meta"><span className="pill amber">{l.rate}% interest</span><span className="pill">{l.monthsLeft || 0} months left</span><span className="pill blue">EMI {inr(l.emi)}</span></div></div>
            <div className="item-amt">{inr(loanOutstandingPrincipal(l))}</div>
          </div>
        ))}
        {sortedCards.map((c) => (
          <div className="item" key={c.id}>
            <div className="item-ico">{Ico.card}</div>
            <div className="item-body"><div className="item-name">{c.name} (credit card)</div><div className="item-meta"><span className="pill red">very high interest</span><span className="pill">due day {c.dueDay || 10}</span></div></div>
            <div className="item-amt">{inr(c.outstanding)}</div>
          </div>
        ))}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

<script>
(function () {
  var LIBS = [
    { name: 'React', optional: false, urls: ['https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js','https://unpkg.com/react@18.3.1/umd/react.production.min.js','https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js'], check: function () { return window.React; } },
    { name: 'ReactDOM', optional: false, urls: ['https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js','https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js','https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js'], check: function () { return window.ReactDOM; } },
    { name: 'FirebaseApp', optional: true, urls: ['https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js','https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-app-compat.js','https://unpkg.com/firebase@10.12.2/firebase-app-compat.js'], check: function () { return window.firebase; } },
    { name: 'FirebaseStore', optional: true, urls: ['https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js','https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-firestore-compat.js','https://unpkg.com/firebase@10.12.2/firebase-firestore-compat.js'], check: function () { return window.firebase && window.firebase.firestore; } },
    { name: 'Babel', optional: false, urls: ['https://cdn.jsdelivr.net/npm/@babel/standalone@7.24.7/babel.min.js','https://unpkg.com/@babel/standalone@7.24.7/babel.min.js','https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js'], check: function () { return window.Babel; } }
  ];

  function loadOne(lib) {
    return new Promise(function (resolve, reject) {
      var i = 0;
      function tryNext() {
        if (i >= lib.urls.length) { if (lib.optional) resolve(false); else reject(new Error('Could not load ' + lib.name)); return; }
        var url = lib.urls[i++];
        var s = document.createElement('script');
        s.src = url; s.async = false;
        s.onload = function () { if (lib.check && !lib.check()) tryNext(); else resolve(true); };
        s.onerror = tryNext;
        document.head.appendChild(s);
      }
      tryNext();
    });
  }

  function loadOgl() {
    var urls = ['https://esm.sh/ogl@1.0.6','https://cdn.jsdelivr.net/npm/ogl@1.0.6/+esm','https://unpkg.com/ogl@1.0.6?module'];
    var i = 0;
    function tryNext() {
      if (i >= urls.length) return Promise.resolve(null);
      var url = urls[i++];
      return import(url).then(function (mod) { if (mod && mod.Renderer && mod.Program && mod.Triangle && mod.Mesh) { window.ogl = mod; return mod; } return tryNext(); }).catch(function () { return tryNext(); });
    }
    return tryNext();
  }

  function showError(err) {
    var d = document.createElement('div');
    d.style.cssText = 'position:fixed;inset:0;z-index:9999;background:#05060a;color:#f87171;padding:28px;font-family:ui-monospace,Menlo,monospace;font-size:13px;line-height:1.7;overflow:auto;white-space:pre-wrap';
    d.textContent = 'ShubhVault could not start.\n\n' + (err && err.stack ? err.stack : String(err)) + '\n\nTry a hard refresh (Ctrl+Shift+R).';
    document.body.appendChild(d);
  }

  window.addEventListener('error', function (e) {
    if (document.getElementById('root') && document.getElementById('root').children.length === 0) showError(e.error || e.message);
  });

  (async function () {
    try {
      for (var i = 0; i < LIBS.length; i++) await loadOne(LIBS[i]);
      try { await loadOgl(); } catch (e) {}
      var src = document.getElementById('app-src').textContent;
      var out = window.Babel.transform(src, { presets: ['react'] }).code;
      (0, eval)(out);
    } catch (err) { showError(err); }
  })();
})();
</script>
</body>
