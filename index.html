function App() {
  const [authed, setAuthed] = useState(() => sessionStorage.getItem('fv_auth') === '1');
  const [theme, setTheme] = useState(() => localStorage.getItem('fv_theme') || 'dark');
  const [page, setPage] = useState('home');
  const [data, setData, sync] = useStore();
  const [toast, setToast] = useState('');

  useEffect(() => {
    document.documentElement.setAttribute('data-theme', theme);
    localStorage.setItem('fv_theme', theme);
  }, [theme]);

  const showToast = useCallback((m) => { setToast(m); setTimeout(() => setToast(''), 2600); }, []);
  const mut = useCallback((fn) => { setData(prev => { if (!prev) return prev; const next = JSON.parse(JSON.stringify(prev)); fn(next); return next; }); }, [setData]);
  const toggleTheme = () => setTheme(t => (t === 'dark' ? 'light' : 'dark'));

  const currentNetWorth = useMemo(() => {
    if (!data) return 0;
    const bankTotal = data.banks.reduce((s, b) => s + (Number(b.balance) || 0), 0);
    const dematTotal = data.demats.reduce((s, d) => s + (Number(d.balance) || 0), 0);
    const cardDebt = data.cards.reduce((s, c) => s + (Number(c.outstanding) || 0), 0);
    const loanDebt = data.loans.reduce((s, l) => s + (Number(l.remaining) || 0), 0);
    return r2(bankTotal + dematTotal - cardDebt - loanDebt);
  }, [data]);

  const nwRecordRef = useRef({ date: null, value: null });

  useEffect(() => {
    if (!data) return;
    const today = toISO(new Date());
    const hist = data.netWorthHistory || [];
    const todayEntry = hist.find(h => h.date === today);
    if (todayEntry && Math.abs(todayEntry.value - currentNetWorth) < 0.005) {
      nwRecordRef.current = { date: today, value: currentNetWorth };
      return;
    }
    if (nwRecordRef.current.date === today && Math.abs(nwRecordRef.current.value - currentNetWorth) < 0.005) return;
    nwRecordRef.current = { date: today, value: currentNetWorth };
    mut(d => {
      d.netWorthHistory = (d.netWorthHistory || []).filter(h => h.date !== today);
      d.netWorthHistory.push({ date: today, value: currentNetWorth });
      d.netWorthHistory.sort((a, b) => a.date.localeCompare(b.date));
      if (d.netWorthHistory.length > 180) d.netWorthHistory = d.netWorthHistory.slice(-180);
    });
  }, [currentNetWorth, data, mut]);

  if (!authed) return <Login onOk={() => setAuthed(true)} theme={theme} toggleTheme={toggleTheme} />;
  if (!data) return <div className="boot"><div className="boot-inner"><div className="boot-logo">FV</div><div>Loading your vault…</div></div></div>;

  const props = { data, mut, showToast, go: setPage, theme, toggleTheme, sync };

  const NAV = [
    { id: 'home', label: 'Home', icon: Ico.home },
    { id: 'banks', label: 'Banks', icon: Ico.bank },
    { id: 'cards', label: 'Credit Cards', icon: Ico.card },
    { id: 'loans', label: 'Loans', icon: Ico.loan },
    { id: 'bills', label: 'Bills', icon: Ico.bill },
    { id: 'demat', label: 'Demat', icon: Ico.demat },
    { id: 'ai', label: 'AI Brain', icon: Ico.ai }
  ];

  return (
    <React.Fragment>
      <LightRaysBackground theme={theme} />
      <div className="app">
        <aside className="sidebar">
          <div className="brand">
            <div className="brand-logo">FV</div>
            <div><div className="brand-name">ShubhVault</div><div className="brand-sub">MONEY TRACKER</div></div>
          </div>
          {NAV.map(n => (
            <button key={n.id} className={'nav-item' + (page === n.id ? ' active' : '')} onClick={() => setPage(n.id)}>
              <span className="nav-ico">{n.icon}</span><span>{n.label}</span>
            </button>
          ))}
          <div className="side-foot">
            <div style={{ padding: '10px 12px 6px' }}><SyncBadge sync={sync} /></div>
            <button className="nav-item" onClick={toggleTheme}>
              <span className="nav-ico">{theme === 'dark' ? Ico.sun : Ico.moon}</span>
              <span>{theme === 'dark' ? 'Light Mode' : 'Dark Mode'}</span>
            </button>
            <button className="nav-item" onClick={() => { sessionStorage.removeItem('fv_auth'); setAuthed(false); }}>
              <span className="nav-ico">{Ico.logout}</span><span>Log Out</span>
            </button>
          </div>
        </aside>

        <main className="main">
          {page === 'home' && <Home {...props} />}
          {page === 'banks' && <Banks {...props} />}
          {page === 'cards' && <Cards {...props} />}
          {page === 'loans' && <Loans {...props} />}
          {page === 'bills' && <Bills {...props} />}
          {page === 'demat' && <Demat {...props} />}
          {page === 'ai' && <AiBrain {...props} />}
        </main>

        <nav className="mobile-nav">
          {NAV.map(n => (
            <button key={n.id} className={'mnav' + (page === n.id ? ' active' : '')} onClick={() => setPage(n.id)}>
              {n.icon}<span>{n.label}</span>
            </button>
          ))}
        </nav>

        <Toast msg={toast} />
      </div>
    </React.Fragment>
  );
}

function Home({ data, mut, showToast, go, sync }) {
  const bankTotal = data.banks.reduce((s, b) => s + (Number(b.balance) || 0), 0);
  const dematTotal = data.demats.reduce((s, d) => s + (Number(d.balance) || 0), 0);
  const cardDebt = data.cards.reduce((s, c) => s + (Number(c.outstanding) || 0), 0);
  const loanDebt = data.loans.reduce((s, l) => s + (Number(l.remaining) || 0), 0);
  const assets = r2(bankTotal + dematTotal);
  const liabilities = r2(cardDebt + loanDebt);
  const netWorth = r2(assets - liabilities);

  const [payTarget, setPayTarget] = useState(null);
  const [payMode, setPayMode] = useState('full');
  const [payAmount, setPayAmount] = useState('');
  const [payBank, setPayBank] = useState(data.banks[0] ? data.banks[0].id : '');
  const [inflowTarget, setInflowTarget] = useState(null);
  const [withdrawHint, setWithdrawHint] = useState(null);
  const [withdrawHintAmt, setWithdrawHintAmt] = useState('');
  const [withdrawHintBank, setWithdrawHintBank] = useState(data.banks[0] ? data.banks[0].id : '');
  const [expandedGroups, setExpandedGroups] = useState({});

  // All sorted by due date
  const loanItems = useMemo(() => data.loans.map(l => { const due = nextDueDate(l.dueDay || 5, l.paidCycles); return { kind: 'loan', ref: l, id: l.id, name: l.name, amount: r2(l.emi), due, days: daysUntil(due) }; }).sort((a, b) => a.due - b.due), [data.loans]);
  const cardItems = useMemo(() => data.cards.map(c => { const due = nextDueDate(c.dueDay || 10, c.paidCycles); return { kind: 'card', ref: c, id: c.id, name: c.name, amount: r2(c.outstanding), due, days: daysUntil(due) }; }).sort((a, b) => a.due - b.due), [data.cards]);
  const billItems = useMemo(() => data.bills.map(b => { const due = nextDueDate(b.dueDay || 1, b.paidCycles); return { kind: 'bill', ref: b, id: b.id, name: b.name, amount: r2(b.amount), due, days: daysUntil(due) }; }).sort((a, b) => a.due - b.due), [data.bills]);
  const inflowItems = useMemo(() => data.inflows.map(f => { const due = nextDueDate(f.day || 1, f.receivedCycles); return { kind: 'inflow', ref: f, id: f.id, name: f.name, amount: r2(f.amount), due, days: daysUntil(due) }; }).sort((a, b) => a.due - b.due), [data.inflows]);

  const feed = useMemo(() => [].concat(loanItems, cardItems, billItems, inflowItems).sort((a, b) => a.due - b.due), [loanItems, cardItems, billItems, inflowItems]);

  const groupedFeed = useMemo(() => {
    const map = {};
    feed.forEach(item => {
      const key = toISO(item.due);
      if (!map[key]) map[key] = { key, due: item.due, days: item.days, items: [] };
      map[key].items.push(item);
    });
    return Object.values(map).sort((a, b) => a.due - b.due);
  }, [feed]);

  const nwPoints = useMemo(() => {
    const hist = (data.netWorthHistory || []).slice().sort((a, b) => a.date.localeCompare(b.date));
    if (hist.length === 0) return [{ date: toISO(new Date()), value: netWorth }];
    const last = hist[hist.length - 1];
    const today = toISO(new Date());
    if (last.date !== today) hist.push({ date: today, value: netWorth });
    else hist[hist.length - 1] = { date: today, value: netWorth };
    return hist;
  }, [data.netWorthHistory, netWorth]);

  const planAhead = useMemo(() => {
    const today = startOfToday();
    const cutoff = new Date(today); cutoff.setDate(cutoff.getDate() + 5);
    const dues = [];
    data.loans.forEach(l => { const due = nextDueDate(l.dueDay || 5, l.paidCycles); if (due >= today && due <= cutoff && Number(l.emi) > 0) dues.push({ kind: 'loan', name: l.name, amount: r2(l.emi), due, days: daysUntil(due) }); });
    data.cards.forEach(c => { const due = nextDueDate(c.dueDay || 10, c.paidCycles); if (due >= today && due <= cutoff && Number(c.outstanding) > 0) dues.push({ kind: 'card', name: c.name, amount: r2(c.outstanding), due, days: daysUntil(due) }); });
    data.bills.forEach(b => { const due = nextDueDate(b.dueDay || 1, b.paidCycles); if (due >= today && due <= cutoff && Number(b.amount) > 0) dues.push({ kind: 'bill', name: b.name, amount: r2(b.amount), due, days: daysUntil(due) }); });
    if (dues.length === 0) return [];
    dues.sort((a, b) => a.due - b.due);
    let runningBank = bankTotal;
    const usedInflowKeys = {};
    const result = [];
    dues.forEach(d => {
      let inflowSum = 0;
      data.inflows.forEach(f => {
        const iDue = nextDueDate(f.day || 1, f.receivedCycles);
        if (iDue <= d.due) {
          const key = f.id + '|' + toISO(iDue);
          if (!usedInflowKeys[key]) { inflowSum += Number(f.amount) || 0; usedInflowKeys[key] = true; }
        }
      });
      const available = r2(runningBank + inflowSum);
      const needs = available < d.amount;
      if (needs) {
        const withdraw = r2(Math.max(0, d.amount - inflowSum));
        result.push({ ...d, needsWithdraw: true, withdraw, bankBefore: r2(runningBank), inflowsBefore: r2(inflowSum), available });
        runningBank = r2(runningBank + withdraw + inflowSum - d.amount);
      } else {
        result.push({ ...d, needsWithdraw: false, withdraw: 0, bankBefore: r2(runningBank), inflowsBefore: r2(inflowSum), available });
        runningBank = r2(available - d.amount);
      }
    });
    return result;
  }, [data, bankTotal]);

  const mk = monthKey(new Date());
  const monthTx = data.transactions.filter(t => String(t.date).startsWith(mk));
  const mIn = r2(monthTx.filter(t => t.dir === 'in').reduce((s, t) => s + (Number(t.amount) || 0), 0));
  const mOut = r2(monthTx.filter(t => t.dir === 'out').reduce((s, t) => s + (Number(t.amount) || 0), 0));

  const markDone = (item) => {
    const due = nextDueDate(item.ref.dueDay || item.ref.day || 1, item.ref.paidCycles || item.ref.receivedCycles);
    const cycle = monthKey(due);
    mut(d => {
      if (item.kind === 'loan') { const t = d.loans.find(x => x.id === item.id); t.paidCycles = (t.paidCycles || []).concat([cycle]); }
      else if (item.kind === 'card') { const t = d.cards.find(x => x.id === item.id); t.paidCycles = (t.paidCycles || []).concat([cycle]); }
      else if (item.kind === 'bill') { const t = d.bills.find(x => x.id === item.id); t.paidCycles = (t.paidCycles || []).concat([cycle]); }
      else if (item.kind === 'inflow') { const t = d.inflows.find(x => x.id === item.id); t.receivedCycles = (t.receivedCycles || []).concat([cycle]); }
    });
    showToast('Marked done for this month');
  };

  const markGroupDone = (group) => {
    group.items.filter(i => i.kind !== 'inflow').forEach(item => markDone(item));
  };

  const openPay = (item) => { setPayTarget(item); setPayMode('full'); setPayAmount(String(item.amount)); setPayBank(data.banks[0] ? data.banks[0].id : ''); };

  const doPay = () => {
    if (!payTarget) return;
    const amt = r2(payAmount);
    if (!amt || amt <= 0) { showToast('Enter a valid amount'); return; }
    const item = payTarget;
    const cycle = monthKey(nextDueDate(item.ref.dueDay || 1, item.ref.paidCycles));
    mut(d => {
      const bank = d.banks.find(b => b.id === payBank);
      if (bank) bank.balance = r2(bank.balance - amt);
      d.transactions.push({ id: uid(), bankId: payBank, amount: amt, dir: 'out', note: item.name + ' payment', category: item.kind === 'card' ? 'Credit Card' : item.kind === 'loan' ? 'Loan EMI' : 'Bills', date: toISO(new Date()), affectsBalance: true, ts: Date.now() });
      if (item.kind === 'card') { const c = d.cards.find(x => x.id === item.id); if (c) { c.outstanding = r2(Math.max(0, c.outstanding - amt)); c.paidCycles = (c.paidCycles || []).concat([cycle]); } }
      else if (item.kind === 'loan') { const l = d.loans.find(x => x.id === item.id); if (l) { l.remaining = r2(Math.max(0, l.remaining - amt)); l.monthsLeft = Math.max(0, (Number(l.monthsLeft) || 1) - 1); l.paidCycles = (l.paidCycles || []).concat([cycle]); } }
      else if (item.kind === 'bill') { const b = d.bills.find(x => x.id === item.id); if (b) b.paidCycles = (b.paidCycles || []).concat([cycle]); }
    });
    setPayTarget(null);
    showToast('Payment recorded');
  };

  const confirmInflow = (actualAmount, bankId, adjust) => {
    const f = inflowTarget;
    const amt = r2(actualAmount);
    const cycle = monthKey(nextDueDate(f.ref.day || 1, f.ref.receivedCycles));
    mut(d => {
      const bank = d.banks.find(b => b.id === bankId);
      if (bank) bank.balance = r2(bank.balance + amt);
      d.transactions.push({ id: uid(), bankId, amount: amt, dir: 'in', note: f.name + ' received', category: 'Salary', date: toISO(new Date()), affectsBalance: true, ts: Date.now() });
      const inf = d.inflows.find(x => x.id === f.id);
      if (inf) { inf.receivedCycles = (inf.receivedCycles || []).concat([cycle]); if (adjust) inf.amount = amt; }
    });
    setInflowTarget(null);
    showToast('Money added to your bank');
  };

  const executeWithdraw = () => {
    if (!withdrawHint) return;
    const amt = r2(withdrawHintAmt);
    if (!amt || amt <= 0) { showToast('Enter a valid amount'); return; }
    const a0 = withdrawHint;
    let pickDemat = data.demats.find(x => Number(x.balance) >= amt);
    if (!pickDemat) pickDemat = data.demats[0];
    if (!pickDemat) { showToast('Add a demat account first'); return; }
    mut(d => {
      const a = d.demats.find(x => x.id === pickDemat.id);
      const b = d.banks.find(x => x.id === withdrawHintBank);
      if (!a || !b) return;
      a.balance = r2(a.balance - amt);
      a.history = (a.history || []).filter(h => h.date !== toISO(new Date()));
      a.history.push({ date: toISO(new Date()), value: a.balance });
      a.history.sort((x, y) => x.date.localeCompare(y.date));
      b.balance = r2(b.balance + amt);
      d.transactions.push({ id: uid(), bankId: withdrawHintBank, amount: amt, dir: 'in', note: 'Withdrawn from ' + a.name + ' for ' + a0.name, category: 'Transfer', date: toISO(new Date()), affectsBalance: true, ts: Date.now() });
    });
    setWithdrawHint(null);
    showToast('Money moved from Demat to your bank');
  };

  const renderItem = (item) => {
    const isIn = item.kind === 'inflow';
    const I = CategoryIcon({ kind: item.kind });
    return (
      <div className="item" key={item.kind + item.id}>
        <div className="item-ico">{I}</div>
        <div className="item-body">
          <div className="item-name">{item.name}</div>
          <div className="item-meta">
            <span className={'pill ' + (isIn ? 'green' : item.days <= 3 ? 'red' : item.days <= 7 ? 'amber' : 'blue')}>
              <span className="pdot"></span>{isIn ? 'receiving ' + relDays(item.days) : 'due ' + relDays(item.days)}
            </span>
            <span>{fmtDate(item.due)}</span>
          </div>
        </div>
        <div style={{ textAlign: 'right' }}>
          <div className="item-amt" style={{ color: isIn ? 'var(--green)' : 'inherit' }}>{isIn ? '+' : ''}{inr(item.amount)}</div>
          <div className="item-actions" style={{ marginTop: '7px', justifyContent: 'flex-end' }}>
            {isIn ? (<button className="btn btn-sm btn-primary" onClick={() => setInflowTarget(item)}>Received?</button>) : (
              <React.Fragment>
                <button className="btn btn-sm btn-primary" onClick={() => openPay(item)}>Pay</button>
                <button className="btn btn-sm" onClick={() => markDone(item)}>Done</button>
              </React.Fragment>
            )}
          </div>
        </div>
      </div>
    );
  };

  const renderGroup = (group) => {
    if (group.items.length === 1) return renderItem(group.items[0]);
    const isExpanded = !!expandedGroups[group.key];
    const total = r2(group.items.reduce((s, i) => s + (Number(i.amount) || 0), 0));
    const allInflows = group.items.every(i => i.kind === 'inflow');
    const kinds = Array.from(new Set(group.items.map(i => i.kind)));
    const firstIco = allInflows ? Ico.down : (kinds.includes('loan') ? Ico.loan : kinds.includes('card') ? Ico.card : Ico.bill);
    const colorClass = allInflows ? 'green' : group.days <= 3 ? 'red' : group.days <= 7 ? 'amber' : 'blue';

    return (
      <div key={group.key} className={'item group-item' + (isExpanded ? ' expanded' : '')} onClick={() => setExpandedGroups(e => ({ ...e, [group.key]: !e[group.key] }))}>
        <div className="item-ico" style={{ color: allInflows ? 'var(--green)' : 'inherit' }}>{firstIco}</div>
        <div className="item-body">
          <div className="item-name" style={{ display: 'flex', alignItems: 'center', gap: '7px' }}>
            <span className="expand-chev" style={{ color: 'var(--muted)' }}>{Ico.chev}</span>
            <span>{group.items.length} items due {fmtDate(group.due)}</span>
          </div>
          <div className="item-meta">
            <span className={'pill ' + colorClass}><span className="pdot"></span>{allInflows ? 'receiving ' + relDays(group.days) : 'due ' + relDays(group.days)}</span>
            <span className="pill">Click to {isExpanded ? 'collapse' : 'expand'}</span>
          </div>
        </div>
        <div style={{ textAlign: 'right' }} onClick={e => e.stopPropagation()}>
          <div className="item-amt" style={{ color: allInflows ? 'var(--green)' : 'inherit' }}>{allInflows ? '+' : ''}{inr(total)}</div>
          <div className="item-actions" style={{ marginTop: '7px', justifyContent: 'flex-end' }}>
            {!allInflows && (<button className="btn btn-sm" onClick={(e) => { e.stopPropagation(); markGroupDone(group); }}>Mark all done</button>)}
          </div>
        </div>
        {isExpanded && (
          <div className="group-children" style={{ flexBasis: '100%' }} onClick={e => e.stopPropagation()}>
            {group.items.map(item => {
              const isIn = item.kind === 'inflow';
              const I = CategoryIcon({ kind: item.kind });
              return (
                <div className="group-child" key={item.kind + item.id}>
                  <div className="item-ico" style={{ width: 30, height: 30, color: isIn ? 'var(--green)' : 'inherit' }}>{I}</div>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div className="item-name">{item.name}</div>
                    <div className="item-meta" style={{ marginTop: 3 }}>
                      <span className="pill" style={{ fontSize: '10px' }}>
                        {item.kind === 'loan' ? 'Loan EMI' : item.kind === 'card' ? 'Credit Card' : item.kind === 'bill' ? 'Bill' : 'Inflow'}
                      </span>
                    </div>
                  </div>
                  <div className="item-amt" style={{ fontSize: '13px', color: isIn ? 'var(--green)' : 'inherit' }}>{isIn ? '+' : ''}{inr(item.amount)}</div>
                  <div className="item-actions">
                    {isIn ? (<button className="btn btn-sm btn-primary" onClick={() => setInflowTarget(item)}>Received?</button>) : (
                      <React.Fragment>
                        <button className="btn btn-sm btn-primary" onClick={() => openPay(item)}>Pay</button>
                        <button className="btn btn-sm" onClick={() => markDone(item)}>Done</button>
                      </React.Fragment>
                    )}
                  </div>
                </div>
              );
            })}
          </div>
        )}
      </div>
    );
  };

  const planNeedingWithdraw = planAhead.filter(p => p.needsWithdraw);

  return (
    <div>
      <PageHead title="Home" sub={'Today is ' + fmtDateLong(new Date())} sync={sync} />

      <div className="grid g4">
        <div className="kpi glass">
          <div className="kpi-head"><span className="kpi-dot accent"></span><span className="kpi-label">Total Bank Balance</span></div>
          <div className="kpi-val">{inr(bankTotal)}</div>
          <div className="kpi-note">{data.banks.length} bank account{data.banks.length > 1 ? 's' : ''}</div>
        </div>
        <div className="kpi glass">
          <div className="kpi-head"><span className="kpi-dot green"></span><span className="kpi-label">Demat Value</span></div>
          <div className="kpi-val">{inr(dematTotal)}</div>
          <div className="kpi-note">{data.demats.length} demat account{data.demats.length > 1 ? 's' : ''}</div>
        </div>
        <div className="kpi glass">
          <div className="kpi-head"><span className="kpi-dot red"></span><span className="kpi-label">Total Money Owed</span></div>
          <div className="kpi-val">{inr(liabilities)}</div>
          <div className="kpi-note">Loans {inr(loanDebt)} · Cards {inr(cardDebt)}</div>
        </div>
        <div className="kpi glass">
          <div className="kpi-head"><span className="kpi-dot amber"></span><span className="kpi-label">Net Worth</span></div>
          <div className="kpi-val" style={{ color: netWorth >= 0 ? 'var(--green)' : 'var(--red)' }}>{inr(netWorth)}</div>
          <div className="kpi-note">Assets {inr(assets)} − Debts {inr(liabilities)}</div>
        </div>
      </div>

      <div className="section-head">
        <div className="section-title"><span className="dot"></span>Net Worth Progress</div>
        <span className="pill blue">{nwPoints.length} snapshot{nwPoints.length !== 1 ? 's' : ''}</span>
      </div>
      <div className="glass" style={{ padding: '20px' }}>
        <NetWorthChart points={nwPoints} />
      </div>

      {planNeedingWithdraw.length > 0 ? (
        <React.Fragment>
          <div className="section-head">
            <div className="section-title"><span className="dot"></span>Plan Ahead — withdrawals needed from Demat</div>
            <span className="pill amber"><span className="pdot"></span>action in next 5 days</span>
          </div>
          <div className="glass plan-box" style={{ padding: '16px' }}>
            {planNeedingWithdraw.map((p, i) => (
              <div className="plan-item" key={i}>
                <div className="item-ico" style={{ color: 'var(--amber)' }}>{CategoryIcon({ kind: p.kind })}</div>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', flexWrap: 'wrap', gap: '10px' }}>
                    <div>
                      <div className="item-name">{p.name}</div>
                      <div className="item-meta">
                        <span className={'pill ' + (p.days <= 2 ? 'red' : p.days <= 4 ? 'amber' : 'blue')}><span className="pdot"></span>due {relDays(p.days)}</span>
                        <span>{fmtDate(p.due)}</span>
                        <span className="pill">due amount {inr(p.amount)}</span>
                      </div>
                    </div>
                    <div style={{ textAlign: 'right' }}>
                      <div className="plan-amt">{inr(p.withdraw)}</div>
                      <div style={{ fontSize: '10.5px', color: 'var(--muted)', marginTop: '3px', letterSpacing: '.3px', textTransform: 'uppercase', fontWeight: 600 }}>withdraw from demat</div>
                    </div>
                  </div>
                  <div className="plan-action">
                    Bank has <b style={{ color: 'var(--txt-2)' }}>{inr(p.bankBefore)}</b>
                    {p.inflowsBefore > 0 ? <React.Fragment> · inflows before due <b style={{ color: 'var(--green)' }}>{inr(p.inflowsBefore)}</b></React.Fragment> : null}
                    {' '}· after withdrawal + payment, your bank keeps <b style={{ color: 'var(--txt-2)' }}>{inr(p.bankBefore)}</b> as buffer
                  </div>
                  <div style={{ marginTop: '10px', display: 'flex', gap: '6px', flexWrap: 'wrap' }}>
                    <button className="btn btn-sm btn-primary" onClick={() => { setWithdrawHint(p); setWithdrawHintAmt(String(p.withdraw)); setWithdrawHintBank(data.banks[0] ? data.banks[0].id : ''); }}>Move {inr(p.withdraw)} now</button>
                  </div>
                </div>
              </div>
            ))}
          </div>
        </React.Fragment>
      ) : planAhead.length > 0 ? (
        <React.Fragment>
          <div className="section-head">
            <div className="section-title"><span className="dot"></span>Plan Ahead — next 5 days</div>
            <span className="pill green"><span className="pdot"></span>all covered</span>
          </div>
          <div className="glass" style={{ padding: '14px' }}>
            <div style={{ padding: '6px 4px', fontSize: '13px', color: 'var(--muted)', lineHeight: 1.6 }}>
              You have upcoming dues in the next 5 days but your bank balance covers them.
              {planAhead.length} item{planAhead.length !== 1 ? 's' : ''} due · total {inr(r2(planAhead.reduce((s, p) => s + p.amount, 0)))}. No demat withdrawal needed right now.
            </div>
          </div>
        </React.Fragment>
      ) : null}

      <div className="section-head">
        <div className="section-title"><span className="dot"></span>Notifications — everything coming up</div>
        <span className="pill blue">{feed.length} item{feed.length !== 1 ? 's' : ''} · {groupedFeed.length} group{groupedFeed.length !== 1 ? 's' : ''}</span>
      </div>
      <div className="glass" style={{ padding: '14px' }}>
        {feed.length === 0 ? (
          <EmptyState icon={Ico.inbox} title="Nothing coming up" sub="Add loans, credit cards or bills and they will show up here sorted by due date." />
        ) : (
          <div className="list">{groupedFeed.map(renderGroup)}</div>
        )}
      </div>

      <div className="section-head">
        <div className="section-title"><span className="dot"></span>Loans — total <b>{inr(loanDebt)}</b></div>
        <button className="btn btn-sm" onClick={() => go('loans')}>Manage</button>
      </div>
      <div className="glass" style={{ padding: '14px' }}>
        {loanItems.length === 0 ? (
          <EmptyState icon={Ico.loan} title="No loans added yet" sub="Track EMIs, remaining months and payoff progress." action={<button className="btn btn-sm btn-primary" onClick={() => go('loans')}>Add your first loan</button>} />
        ) : (<div className="list">{loanItems.map(renderItem)}</div>)}
      </div>

      <div className="section-head">
        <div className="section-title"><span className="dot"></span>Credit Cards — total <b>{inr(cardDebt)}</b></div>
        <button className="btn btn-sm" onClick={() => go('cards')}>Manage</button>
      </div>
      <div className="glass" style={{ padding: '14px' }}>
        {cardItems.length === 0 ? (
          <EmptyState icon={Ico.card} title="No credit cards added yet" sub="Add your cards to keep an eye on bills and due dates." action={<button className="btn btn-sm btn-primary" onClick={() => go('cards')}>Add your first card</button>} />
        ) : (<div className="list">{cardItems.map(renderItem)}</div>)}
      </div>

      {billItems.length > 0 && (
        <React.Fragment>
          <div className="section-head"><div className="section-title"><span className="dot"></span>Other Bills &amp; Subscriptions</div></div>
          <div className="glass" style={{ padding: '14px' }}><div className="list">{billItems.map(renderItem)}</div></div>
        </React.Fragment>
      )}

      <div className="section-head">
        <div className="section-title"><span className="dot"></span>Money Coming In</div>
        <button className="btn btn-sm" onClick={() => go('bills')}>Manage</button>
      </div>
      <div className="glass" style={{ padding: '14px' }}>
        {inflowItems.length === 0 ? (
          <EmptyState icon={Ico.down} title="No incoming payments yet" sub="Add your salary or any expected payments so you get a reminder on the day." action={<button className="btn btn-sm btn-primary" onClick={() => go('bills')}>Add income</button>} />
        ) : (<div className="list">{inflowItems.map(renderItem)}</div>)}
      </div>

      <div className="section-head">
        <div className="section-title"><span className="dot"></span>This Month</div>
        <span className="pill">{MONTHS_FULL[new Date().getMonth()] + ' ' + new Date().getFullYear()}</span>
      </div>
      <div className="grid g2">
        <div className="kpi glass spotlight green">
          <div className="kpi-head"><span className="kpi-dot green"></span><span className="kpi-label">Money In</span></div>
          <div className="kpi-val" style={{ color: 'var(--green)' }}>{inr(mIn)}</div>
        </div>
        <div className="kpi glass spotlight red">
          <div className="kpi-head"><span className="kpi-dot red"></span><span className="kpi-label">Money Out</span></div>
          <div className="kpi-val" style={{ color: 'var(--red)' }}>{inr(mOut)}</div>
        </div>
      </div>
      <div className="glass" style={{ padding: '14px 18px', marginTop: '14px', display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: '10px' }}>
        <div className="kpi-label">Net this month</div>
        <div style={{ fontSize: '17px', fontWeight: 700, letterSpacing: '-.4px', color: r2(mIn - mOut) >= 0 ? 'var(--green)' : 'var(--red)' }} className="mono">{inr(r2(mIn - mOut))}</div>
      </div>

      <Modal open={!!payTarget} onClose={() => setPayTarget(null)} title={payTarget ? 'Pay ' + payTarget.name : ''}>
        {payTarget && (
          <div>
            <div className="glass-soft" style={{ padding: '13px 15px', marginBottom: '16px' }}>
              <div className="kpi-label">Total Outstanding</div>
              <div style={{ fontSize: '20px', fontWeight: 700, marginTop: '5px', letterSpacing: '-.4px' }} className="mono">{inr(payTarget.amount)}</div>
              <div style={{ fontSize: '12px', color: 'var(--muted)', marginTop: '5px' }}>Due {fmtDate(payTarget.due)}</div>
            </div>
            <div className="field">
              <label className="label">How much are you paying?</label>
              <div style={{ display: 'flex', gap: '8px', flexWrap: 'wrap', marginBottom: '10px' }}>
                <button className={'btn btn-sm' + (payMode === 'full' ? ' btn-primary' : '')} onClick={() => { setPayMode('full'); setPayAmount(String(payTarget.amount)); }}>Full Amount</button>
                <button className={'btn btn-sm' + (payMode === 'partial' ? ' btn-primary' : '')} onClick={() => { setPayMode('partial'); setPayAmount(''); }}>Partial Payment</button>
              </div>
              <MoneyInput value={payAmount} onChange={setPayAmount} />
            </div>
            <div className="field">
              <label className="label">Pay from</label>
              <select className="select" value={payBank} onChange={(e) => setPayBank(e.target.value)}>
                {data.banks.map(b => <option key={b.id} value={b.id}>{b.name} — {inr(b.balance)}</option>)}
              </select>
            </div>
            <button className="btn btn-primary" style={{ width: '100%', justifyContent: 'center', padding: '11px' }} onClick={doPay}>Confirm Payment</button>
          </div>
        )}
      </Modal>

      <InflowModal target={inflowTarget} data={data} onClose={() => setInflowTarget(null)} onConfirm={confirmInflow} />

      <Modal open={!!withdrawHint} onClose={() => setWithdrawHint(null)} title={withdrawHint ? 'Withdraw for ' + withdrawHint.name : ''}>
        {withdrawHint && (
          <div>
            <div className="glass-soft" style={{ padding: '13px 15px', marginBottom: '16px' }}>
              <div className="kpi-label">Suggested amount from Demat</div>
              <div style={{ fontSize: '20px', fontWeight: 700, marginTop: '5px', letterSpacing: '-.4px', color: 'var(--amber)' }} className="mono">{inr(withdrawHint.withdraw)}</div>
              <div style={{ fontSize: '12px', color: 'var(--muted)', marginTop: '6px', lineHeight: 1.5 }}>
                Due {fmtDate(withdrawHint.due)} · Due amount {inr(withdrawHint.amount)} · Bank currently {inr(withdrawHint.bankBefore)}
              </div>
            </div>
            <div className="field"><label className="label">Amount to withdraw</label><MoneyInput value={withdrawHintAmt} onChange={setWithdrawHintAmt} /></div>
            <div className="field">
              <label className="label">Add to which bank?</label>
              <select className="select" value={withdrawHintBank} onChange={(e) => setWithdrawHintBank(e.target.value)}>
                {data.banks.map(b => <option key={b.id} value={b.id}>{b.name} — {inr(b.balance)}</option>)}
              </select>
            </div>
            <button className="btn btn-primary" style={{ width: '100%', justifyContent: 'center', padding: '11px' }} onClick={executeWithdraw}>Move {inr(withdrawHintAmt || 0)} to bank</button>
          </div>
        )}
      </Modal>
    </div>
  );
}

function InflowModal({ target, data, onClose, onConfirm }) {
  const [amt, setAmt] = useState('');
  const [bank, setBank] = useState(data.banks[0] ? data.banks[0].id : '');
  const [adjust, setAdjust] = useState(false);
  useEffect(() => { if (target) { setAmt(String(target.amount)); setAdjust(false); setBank(data.banks[0] ? data.banks[0].id : ''); } }, [target]);
  if (!target) return null;
  return (
    <Modal open={!!target} onClose={onClose} title={'Did you receive ' + target.name + '?'}>
      <div className="glass-soft" style={{ padding: '13px 15px', marginBottom: '16px' }}>
        <div className="kpi-label">Expected Amount</div>
        <div style={{ fontSize: '20px', fontWeight: 700, marginTop: '5px', letterSpacing: '-.4px' }} className="mono">{inr(target.amount)}</div>
        <div style={{ fontSize: '12px', color: 'var(--muted)', marginTop: '5px' }}>Expected {fmtDate(target.due)}</div>
      </div>
      <div className="field"><label className="label">How much did you actually get?</label><MoneyInput value={amt} onChange={setAmt} /></div>
      <div className="switch" onClick={() => setAdjust(a => !a)}>
        <div className={'switch-track' + (adjust ? ' on' : '')}><div className="switch-knob"></div></div>
        <div className="switch-lbl">Update the expected amount to this new value for future months</div>
      </div>
      <div className="field" style={{ marginTop: '8px' }}>
        <label className="label">Add to which bank?</label>
        <select className="select" value={bank} onChange={(e) => setBank(e.target.value)}>
          {data.banks.map(b => <option key={b.id} value={b.id}>{b.name} — {inr(b.balance)}</option>)}
        </select>
      </div>
      <button className="btn btn-primary" style={{ width: '100%', justifyContent: 'center', padding: '11px' }} onClick={() => onConfirm(amt, bank, adjust)}>Yes, I received it</button>
    </Modal>
  );
}

function Banks({ data, mut, showToast, sync }) {
  const [txOpen, setTxOpen] = useState(false);
  const [editTx, setEditTx] = useState(null);
  const [bankOpen, setBankOpen] = useState(false);
  const [editBank, setEditBank] = useState(null);
  const [transferOpen, setTransferOpen] = useState(false);
  const [confirmDel, setConfirmDel] = useState(null);

  const total = data.banks.reduce((s, b) => s + (Number(b.balance) || 0), 0);

  const grouped = useMemo(() => {
    const list = data.transactions.slice().sort((a, b) => {
      const c = String(b.date).localeCompare(String(a.date));
      if (c !== 0) return c;
      return (b.ts || 0) - (a.ts || 0);
    });
    const months = [];
    const map = {};
    list.forEach(t => {
      const d = parseISO(t.date);
      const mk = MONTHS_FULL[d.getMonth()] + ' ' + d.getFullYear();
      const dk = toISO(d);
      if (!map[mk]) { map[mk] = { key: mk, days: [], dayMap: {} }; months.push(map[mk]); }
      if (!map[mk].dayMap[dk]) { map[mk].dayMap[dk] = { key: dk, items: [] }; map[mk].days.push(map[mk].dayMap[dk]); }
      map[mk].dayMap[dk].items.push(t);
    });
    return months;
  }, [data.transactions]);

  const catBreakdown = useMemo(() => {
    const totals = {};
    let overall = 0;
    data.transactions.forEach(t => {
      if (t.dir !== 'out') return;
      const c = t.category || 'Other';
      const amt = Number(t.amount) || 0;
      totals[c] = r2((totals[c] || 0) + amt);
      overall += amt;
    });
    const arr = Object.keys(totals).map(k => ({ name: k, amount: totals[k], pct: overall > 0 ? r2((totals[k] / overall) * 100) : 0 }));
    arr.sort((a, b) => b.amount - a.amount);
    return { items: arr, overall: r2(overall) };
  }, [data.transactions]);

  const saveBank = (name, balance, id) => {
    mut(d => {
      if (id) { const b = d.banks.find(x => x.id === id); if (b) { b.name = name; b.balance = r2(balance); } }
      else d.banks.push({ id: uid(), name, balance: r2(balance) });
    });
    setBankOpen(false); setEditBank(null);
    showToast(id ? 'Bank updated' : 'Bank added');
  };

  const deleteBank = (id) => {
    mut(d => { d.banks = d.banks.filter(b => b.id !== id); d.transactions = d.transactions.filter(t => t.bankId !== id); });
    setConfirmDel(null); showToast('Bank removed');
  };

  const saveTx = (payload, id) => {
    mut(d => {
      if (id) {
        const old = d.transactions.find(t => t.id === id);
        if (old && old.affectsBalance && old.bankId) {
          const ob = d.banks.find(b => b.id === old.bankId);
          if (ob) ob.balance = r2(ob.balance - (old.dir === 'in' ? old.amount : -old.amount));
        }
        if (old) Object.assign(old, payload);
        const t = d.transactions.find(x => x.id === id);
        if (t && t.affectsBalance && t.bankId) {
          const nb = d.banks.find(b => b.id === t.bankId);
          if (nb) nb.balance = r2(nb.balance + (t.dir === 'in' ? t.amount : -t.amount));
        }
      } else {
        const t = Object.assign({ id: uid(), ts: Date.now() }, payload);
        d.transactions.push(t);
        if (t.affectsBalance && t.bankId) {
          const nb = d.banks.find(b => b.id === t.bankId);
          if (nb) nb.balance = r2(nb.balance + (t.dir === 'in' ? t.amount : -t.amount));
        }
      }
    });
    setTxOpen(false); setEditTx(null);
    showToast(id ? 'Transaction updated' : 'Transaction added');
  };

  const deleteTx = (id) => {
    mut(d => {
      const t = d.transactions.find(x => x.id === id);
      if (t && t.affectsBalance && t.bankId) {
        const b = d.banks.find(x => x.id === t.bankId);
        if (b) b.balance = r2(b.balance - (t.dir === 'in' ? t.amount : -t.amount));
      }
      d.transactions = d.transactions.filter(x => x.id !== id);
    });
    showToast('Transaction deleted');
  };

  const doTransfer = (from, to, amount) => {
    const amt = r2(amount);
    if (!from || !to || from === to || !amt || amt <= 0) { showToast('Check the transfer details'); return; }
    mut(d => {
      const fb = d.banks.find(b => b.id === from);
      const tb = d.banks.find(b => b.id === to);
      if (!fb || !tb) return;
      fb.balance = r2(fb.balance - amt);
      tb.balance = r2(tb.balance + amt);
      d.transactions.push({ id: uid(), bankId: from, amount: amt, dir: 'out', note: 'Transfer to ' + tb.name, category: 'Transfer', date: toISO(new Date()), affectsBalance: true, ts: Date.now() });
      d.transactions.push({ id: uid(), bankId: to, amount: amt, dir: 'in', note: 'Transfer from ' + fb.name, category: 'Transfer', date: toISO(new Date()), affectsBalance: true, ts: Date.now() + 1 });
    });
    setTransferOpen(false);
    showToast('Transfer done');
  };

  return (
    <div>
      <PageHead title="Bank Accounts" sub={data.banks.length + ' account' + (data.banks.length > 1 ? 's' : '') + ' connected'} sync={sync}>
        <button className="btn btn-sm" onClick={() => setTransferOpen(true)}>Transfer</button>
        <button className="btn btn-sm" onClick={() => { setEditBank(null); setBankOpen(true); }}>Add Bank</button>
        <button className="btn btn-sm btn-primary" onClick={() => { setEditTx(null); setTxOpen(true); }}>+ Transaction</button>
      </PageHead>

      <div className="kpi glass spotlight" style={{ marginBottom: '18px' }}>

function TxModal({ open, onClose, banks, tx, onSave }) {
  const [bankId, setBankId] = useState('');
  const [dir, setDir] = useState('out');
  const [amount, setAmount] = useState('');
  const [note, setNote] = useState('');
  const [category, setCategory] = useState('General');
  const [date, setDate] = useState(toISO(new Date()));
  const [affects, setAffects] = useState(true);

  useEffect(() => {
    if (open) {
      if (tx) {
        setBankId(tx.bankId || (banks[0] ? banks[0].id : ''));
        setDir(tx.dir); setAmount(String(tx.amount)); setNote(tx.note || '');
        setCategory(tx.category || 'General'); setDate(tx.date); setAffects(tx.affectsBalance !== false);
      } else {
        setBankId(banks[0] ? banks[0].id : ''); setDir('out'); setAmount(''); setNote('');
        setCategory('General'); setDate(toISO(new Date())); setAffects(true);
      }
    }
  }, [open, tx]);

  if (!open) return null;
  const submit = () => {
    const amt = r2(amount);
    if (!amt || amt <= 0) return;
    onSave({ bankId, dir, amount: amt, note, category, date, affectsBalance: affects }, tx ? tx.id : null);
  };

  return (
    <Modal open={open} onClose={onClose} title={tx ? 'Edit Transaction' : 'Add Transaction'}>
      <div className="field">
        <label className="label">Money going</label>
        <div style={{ display: 'flex', gap: '8px' }}>
          <button className={'btn btn-sm' + (dir === 'in' ? ' btn-primary' : '')} style={{ flex: 1, justifyContent: 'center' }} onClick={() => setDir('in')}>In ↓</button>
          <button className={'btn btn-sm' + (dir === 'out' ? ' btn-primary' : '')} style={{ flex: 1, justifyContent: 'center' }} onClick={() => setDir('out')}>Out ↑</button>
        </div>
      </div>
      <div className="row2">
        <div className="field"><label className="label">Amount</label><MoneyInput value={amount} onChange={setAmount} autoFocus /></div>
        <div className="field"><label className="label">Date</label><input className="input" type="date" value={date} onChange={(e) => setDate(e.target.value)} /></div>
      </div>
      <div className="field">
        <label className="label">Bank</label>
        <select className="select" value={bankId} onChange={(e) => setBankId(e.target.value)}>
          {banks.map(b => <option key={b.id} value={b.id}>{b.name}</option>)}
        </select>
      </div>
      <div className="field"><label className="label">Note</label><input className="input" value={note} onChange={(e) => setNote(e.target.value)} placeholder="What was this for?" /></div>
      <div className="field">
        <label className="label">Category</label>
        <select className="select" value={category} onChange={(e) => setCategory(e.target.value)}>
          {['General','Salary','Food','Rent','Shopping','Travel','Bills','Credit Card','Loan EMI','Transfer','Investment','Medical','Other'].map(c => <option key={c} value={c}>{c}</option>)}
        </select>
      </div>
      <div className="switch" onClick={() => setAffects(a => !a)}>
        <div className={'switch-track' + (affects ? ' on' : '')}><div className="switch-knob"></div></div>
        <div className="switch-lbl">Adjust bank balance with this transaction</div>
      </div>
      <button className="btn btn-primary" style={{ width: '100%', justifyContent: 'center', marginTop: '10px', padding: '11px' }} onClick={submit}>{tx ? 'Save Changes' : 'Add Transaction'}</button>
    </Modal>
  );
}

function TransferModal({ open, onClose, banks, onTransfer }) {
  const [from, setFrom] = useState('');

function Cards({ data, mut, showToast, sync }) {
  const [formOpen, setFormOpen] = useState(false);
  const [edit, setEdit] = useState(null);
  const [payTarget, setPayTarget] = useState(null);
  const [payAmount, setPayAmount] = useState('');
  const [payBank, setPayBank] = useState(data.banks[0] ? data.banks[0].id : '');
  const [adjustTarget, setAdjustTarget] = useState(null);
  const [adjustVal, setAdjustVal] = useState('');
  const [confirmDel, setConfirmDel] = useState(null);
  const totalOut = data.cards.reduce((s, c) => s + (Number(c.outstanding) || 0), 0);

  // Sorted by due date
  const sortedCards = useMemo(() => sortByDueDate(data.cards, 'dueDay', 10), [data.cards]);

  const save = (payload, id) => {
    mut(d => {
      if (id) { const c = d.cards.find(x => x.id === id); if (c) Object.assign(c, payload); }
      else d.cards.push(Object.assign({ id: uid(), paidCycles: [] }, payload));
    });
    setFormOpen(false); setEdit(null);
    showToast(id ? 'Card updated' : 'Card added');
  };

  const markDone = (card) => {
    const cycle = monthKey(nextDueDate(card.dueDay || 10, card.paidCycles));
    mut(d => { const c = d.cards.find(x => x.id === card.id); if (c) c.paidCycles = (c.paidCycles || []).concat([cycle]); });
    showToast('Marked done for this month');
  };

  const doPay = () => {
    const amt = r2(payAmount);
    if (!amt || amt <= 0) { showToast('Enter a valid amount'); return; }
    const c0 = payTarget;
    const cycle = monthKey(nextDueDate(c0.dueDay || 10, c0.paidCycles));
    mut(d => {
      const bank = d.banks.find(b => b.id === payBank);
      if (bank) bank.balance = r2(bank.balance - amt);
      d.transactions.push({ id: uid(), bankId: payBank, amount: amt, dir: 'out', note: c0.name + ' bill payment', category: 'Credit Card', date: toISO(new Date()), affectsBalance: true, ts: Date.now() });
      const c = d.cards.find(x => x.id === c0.id);
      if (c) { c.outstanding = r2(Math.max(0, c.outstanding - amt)); c.paidCycles = (c.paidCycles || []).concat([cycle]); }
    });
    setPayTarget(null); showToast('Bill paid');
  };

  const saveAdjust = () => {
    const v = r2(adjustVal);
    mut(d => { const c = d.cards.find(x => x.id === adjustTarget.id); if (c) c.outstanding = v; });
    setAdjustTarget(null); showToast('Outstanding updated');
  };

  return (
    <div>
      <PageHead title="Credit Cards" sub={'Total outstanding ' + inr(totalOut)} sync={sync}>
        <button className="btn btn-sm btn-primary" onClick={() => { setEdit(null); setFormOpen(true); }}>+ Add Card</button>
      </PageHead>

      {data.cards.length === 0 ? (
        <div className="glass">
          <EmptyState icon={Ico.card} title="No credit cards yet" sub="Add a card to track bills, due dates and outstanding." action={<button className="btn btn-sm btn-primary" onClick={() => { setEdit(null); setFormOpen(true); }}>Add your first card</button>} />
        </div>
      ) : (
        <div className="grid g2">
          {sortedCards.map(c => (
            <FlipCard key={c.id} card={c}
              onEdit={() => { setEdit(c); setFormOpen(true); }}
              onDelete={() => setConfirmDel(c)}
              onMarkDone={() => markDone(c)}
              onPay={() => { setPayTarget(c); setPayAmount(String(c.outstanding)); setPayBank(data.banks[0] ? data.banks[0].id : ''); }} />
          ))}
        </div>
      )}

      {data.cards.length > 0 && (
        <React.Fragment>
          <div className="section-head"><div className="section-title"><span className="dot"></span>Adjust Outstanding</div></div>
          <div className="glass" style={{ padding: '14px' }}>
            <div className="list">
              {sortedCards.map(c => (
                <div className="item" key={c.id}>
                  <div className="item-ico">{Ico.card}</div>
                  <div className="item-body">
                    <div className="item-name">{c.name}</div>
                    <div className="item-meta">
                      <span>Current outstanding {inr(c.outstanding)}</span>
                      <span className="pill">due {fmtDate(nextDueDate(c.dueDay || 10, c.paidCycles))}</span>
                    </div>
                  </div>
                  <button className="btn btn-sm" onClick={() => { setAdjustTarget(c); setAdjustVal(String(c.outstanding)); }}>Adjust</button>
                </div>
              ))}
            </div>
          </div>
        </React.Fragment>
      )}

      <CardModal open={formOpen} onClose={() => { setFormOpen(false); setEdit(null); }} card={edit} onSave={save} />

      <Modal open={!!payTarget} onClose={() => setPayTarget(null)} title={payTarget ? 'Pay ' + payTarget.name : ''}>
        {payTarget && (
          <div>
            <div className="glass-soft" style={{ padding: '13px 15px', marginBottom: '16px' }}>
              <div className="kpi-label">Total Outstanding</div>
              <div style={{ fontSize: '20px', fontWeight: 700, marginTop: '5px', letterSpacing: '-.4px' }} className="mono">{inr(payTarget.outstanding)}</div>
            </div>
            <div className="field">
              <label className="label">Amount to pay</label>
              <div style={{ display: 'flex', gap: '8px', flexWrap: 'wrap', marginBottom: '10px' }}>
                <button className="btn btn-sm" onClick={() => setPayAmount(String(payTarget.outstanding))}>Pay Full</button>
                <button className="btn btn-sm" onClick={() => setPayAmount('')}>Pay Partial</button>
              </div>
              <MoneyInput value={payAmount} onChange={setPayAmount} />
            </div>
            <div className="field">
              <label className="label">Pay from</label>
              <select className="select" value={payBank} onChange={(e) => setPayBank(e.target.value)}>
                {data.banks.map(b => <option key={b.id} value={b.id}>{b.name} — {inr(b.balance)}</option>)}
              </select>
            </div>
            <button className="btn btn-primary" style={{ width: '100%', justifyContent: 'center', padding: '11px' }} onClick={doPay}>Confirm Payment</button>
          </div>
        )}
      </Modal>

      <Modal open={!!adjustTarget} onClose={() => setAdjustTarget(null)} title="Adjust Outstanding">
        <div className="field"><label className="label">Correct outstanding amount</label><MoneyInput value={adjustVal} onChange={setAdjustVal} /></div>
        <button className="btn btn-primary" style={{ width: '100%', justifyContent: 'center', padding: '11px' }} onClick={saveAdjust}>Save</button>
      </Modal>

      <Modal open={!!confirmDel} onClose={() => setConfirmDel(null)} title="Delete this card?">
        <p style={{ fontSize: '13.5px', color: 'var(--muted)', marginBottom: '18px', lineHeight: 1.55 }}>This will remove the card and its due date. Cannot be undone.</p>
        <div style={{ display: 'flex', gap: '10px' }}>
          <button className="btn" style={{ flex: 1, justifyContent: 'center' }} onClick={() => setConfirmDel(null)}>Cancel</button>
          <button className="btn btn-danger" style={{ flex: 1, justifyContent: 'center' }} onClick={() => {
            mut(d => { d.cards = d.cards.filter(x => x.id !== confirmDel.id); });
            setConfirmDel(null); showToast('Card removed');
          }}>Delete</button>
        </div>
      </Modal>
    </div>
  );
}

function Loans({ data, mut, showToast, sync }) {
  const [formOpen, setFormOpen] = useState(false);
  const [edit, setEdit] = useState(null);
  const [payTarget, setPayTarget] = useState(null);
  const [payMode, setPayMode] = useState('emi');
  const [payAmount, setPayAmount] = useState('');
  const [payBank, setPayBank] = useState(data.banks[0] ? data.banks[0].id : '');
  const [confirmDel, setConfirmDel] = useState(null);

  const total = data.loans.reduce((s, l) => s + (Number(l.remaining) || 0), 0);
  const totalEmi = data.loans.reduce((s, l) => s + (Number(l.emi) || 0), 0);

  // Sorted by due date
  const sortedLoans = useMemo(() => sortByDueDate(data.loans, 'dueDay', 5), [data.loans]);

  const save = (payload, id) => {
    mut(d => {
      if (id) { const l = d.loans.find(x => x.id === id); if (l) Object.assign(l, payload); }
      else d.loans.push(Object.assign({ id: uid(), paidCycles: [] }, payload));
    });
    setFormOpen(false); setEdit(null);
    showToast(id ? 'Loan updated' : 'Loan added');
  };

  const markDone = (loan) => {
    const cycle = monthKey(nextDueDate(loan.dueDay || 5, loan.paidCycles));
    mut(d => { const l = d.loans.find(x => x.id === loan.id); if (l) l.paidCycles = (l.paidCycles || []).concat([cycle]); });
    showToast('Marked done for this month');
  };

  const doPay = () => {
    const amt = r2(payAmount);
    if (!amt || amt <= 0) { showToast('Enter a valid amount'); return; }
    const l0 = payTarget;
    const cycle = monthKey(nextDueDate(l0.dueDay || 5, l0.paidCycles));
    const isForeclose = payMode === 'foreclose';
    mut(d => {
      const bank = d.banks.find(b => b.id === payBank);
      if (bank) bank.balance = r2(bank.balance - amt);
      d.transactions.push({ id: uid(), bankId: payBank, amount: amt, dir: 'out', note: isForeclose ? l0.name + ' loan foreclosure' : l0.name + ' payment', category: 'Loan EMI', date: toISO(new Date()), affectsBalance: true, ts: Date.now() });
      const l = d.loans.find(x => x.id === l0.id);
      if (!l) return;
      if (isForeclose) { l.remaining = 0; l.monthsLeft = 0; l.foreclosureAmount = 0; }
      else { l.remaining = r2(Math.max(0, l.remaining - amt)); if (payMode === 'emi') l.monthsLeft = Math.max(0, (Number(l.monthsLeft) || 1) - 1); }
      l.paidCycles = (l.paidCycles || []).concat([cycle]);
    });
    setPayTarget(null);
    showToast(isForeclose ? 'Loan closed' : 'Payment recorded');
  };

  return (
    <div>
      <PageHead title="Loans" sub={'Total remaining ' + inr(total) + ' · Monthly EMI ' + inr(totalEmi)} sync={sync}>

function LoanModal({ open, onClose, loan, onSave }) {
  const [name, setName] = useState('');
  const [emi, setEmi] = useState('');
  const [principal, setPrincipal] = useState('');
  const [rate, setRate] = useState('');
  const [monthsLeft, setMonthsLeft] = useState('');
  const [foreclosure, setForeclosure] = useState('');
  const [dueDay, setDueDay] = useState('');

  useEffect(() => {
    if (open) {
      setName(loan ? loan.name : '');
      setEmi(loan ? String(loan.emi || '') : '');
      setPrincipal(loan ? String(loan.principal || '') : '');
      setRate(loan ? String(loan.rate || '') : '');
      setMonthsLeft(loan ? String(loan.monthsLeft || '') : '');
      setForeclosure(loan ? String(loan.foreclosureAmount || '') : '');
      setDueDay(loan ? String(loan.dueDay || '') : '');
    }
  }, [open, loan]);
  if (!open) return null;

  const calcRemaining = (emiVal, rateVal, monthsVal) => {
    const e = Number(emiVal) || 0;
    const n = Number(monthsVal) || 0;
    const r = (Number(rateVal) || 0) / 100 / 12;
    if (e <= 0 || n <= 0) return 0;
    if (r === 0) return r2(e * n);
    return r2(e * (1 - Math.pow(1 + r, -n)) / r);
  };

  const submit = () => {
    let remaining;
    if (loan && Number(loan.remaining) > 0) {
      const unchanged =
        Number(loan.emi) === Number(emi) &&
        Number(loan.rate) === Number(rate) &&
        Number(loan.monthsLeft) === Number(monthsLeft);
      remaining = unchanged ? loan.remaining : calcRemaining(emi, rate, monthsLeft);
    } else remaining = calcRemaining(emi, rate, monthsLeft);
    onSave({
      name: name.trim() || 'Loan',
      emi: r2(emi), remaining: r2(remaining),
      principal: r2(principal) || r2(remaining),
      rate: r2(rate), monthsLeft: Number(monthsLeft) || 0,
      foreclosureAmount: r2(foreclosure),
      dueDay: Math.min(31, Math.max(1, Number(dueDay) || 5))
    }, loan ? loan.id : null);
  };

  return (
    <Modal open={open} onClose={onClose} title={loan ? 'Edit Loan' : 'Add Loan'}>
      <div className="field"><label className="label">Loan Name</label><input className="input" value={name} onChange={(e) => setName(e.target.value)} placeholder="e.g. Home Loan, Car Loan" /></div>
      <div className="row2">
        <div className="field"><label className="label">EMI Amount</label><MoneyInput value={emi} onChange={setEmi} /></div>
        <div className="field">
          <label className="label">Interest Rate (%)</label>
          <input className="input" inputMode="decimal" value={rate}
            onChange={(e) => { const v = e.target.value.replace(/[^\d.]/g, ''); if (/^\d*(\.\d{0,2})?$/.test(v)) setRate(v); }}
            placeholder="9.5" />
        </div>
      </div>
      <div className="row2">
        <div className="field"><label className="label">Months Left</label>
          <input className="input" inputMode="numeric" value={monthsLeft} onChange={(e) => setMonthsLeft(e.target.value.replace(/\D/g, '').slice(0, 4))} placeholder="24" />
        </div>
        <div className="field"><label className="label">EMI Due Day (1-31)</label><DayInput value={dueDay} onChange={setDueDay} /></div>
      </div>
      <div className="field"><label className="label">Original Loan Amount</label><MoneyInput value={principal} onChange={setPrincipal} /></div>
      <div className="field"><label className="label">Foreclosure Amount (if you close it today)</label><MoneyInput value={foreclosure} onChange={setForeclosure} /></div>
      <button className="btn btn-primary" style={{ width: '100%', justifyContent: 'center', padding: '11px' }} onClick={submit}>{loan ? 'Save Changes' : 'Add Loan'}</button>
    </Modal>
  );
}

function Bills({ data, mut, showToast, sync }) {
  const [formOpen, setFormOpen] = useState(false);
  const [edit, setEdit] = useState(null);
  const [confirmDel, setConfirmDel] = useState(null);
  const [payTarget, setPayTarget] = useState(null);
  const [payAmount, setPayAmount] = useState('');
  const [payBank, setPayBank] = useState(data.banks[0] ? data.banks[0].id : '');
  const [inflowOpen, setInflowOpen] = useState(false);
  const [editInflow, setEditInflow] = useState(null);

  const totalBills = data.bills.reduce((s, b) => s + (Number(b.amount) || 0), 0);

  // Sorted by due date
  const sortedBills = useMemo(() => sortByDueDate(data.bills, 'dueDay', 1), [data.bills]);
  const sortedInflows = useMemo(() => {
    return data.inflows.slice().sort((a, b) => {
      const da = nextDueDate(a.day || 1, a.receivedCycles);
      const db = nextDueDate(b.day || 1, b.receivedCycles);
      return da - db;
    });
  }, [data.inflows]);

  const saveBill = (payload, id) => {
    mut(d => {
      if (id) { const b = d.bills.find(x => x.id === id); if (b) Object.assign(b, payload); }
      else d.bills.push(Object.assign({ id: uid(), paidCycles: [] }, payload));
    });
    setFormOpen(false); setEdit(null);
    showToast(id ? 'Bill updated' : 'Bill added');
  };

  const saveInflow = (payload, id) => {
    mut(d => {
      if (id) { const f = d.inflows.find(x => x.id === id); if (f) Object.assign(f, payload); }
      else d.inflows.push(Object.assign({ id: uid(), receivedCycles: [] }, payload));
    });
    setInflowOpen(false); setEditInflow(null);
    showToast(id ? 'Updated' : 'Added');
  };

  const markDone = (bill) => {
    const cycle = monthKey(nextDueDate(bill.dueDay || 1, bill.paidCycles));
    mut(d => { const b = d.bills.find(x => x.id === bill.id); if (b) b.paidCycles = (b.paidCycles || []).concat([cycle]); });
    showToast('Marked done for this month');
  };

  const doPay = () => {
    const amt = r2(payAmount);
    if (!amt || amt <= 0) { showToast('Enter a valid amount'); return; }
    const b0 = payTarget;
    const cycle = monthKey(nextDueDate(b0.dueDay || 1, b0.paidCycles));
    mut(d => {
      const bank = d.banks.find(b => b.id === payBank);
      if (bank) bank.balance = r2(bank.balance - amt);
      d.transactions.push({ id: uid(), bankId: payBank, amount: amt, dir: 'out', note: b0.name + ' paid', category: 'Bills', date: toISO(new Date()), affectsBalance: true, ts: Date.now() });
      const b = d.bills.find(x => x.id === b0.id);
      if (b) b.paidCycles = (b.paidCycles || []).concat([cycle]);
    });
    setPayTarget(null); showToast('Payment recorded');
  };

  return (
    <div>
      <PageHead title="Bills & Subscriptions" sub={'Total monthly ' + inr(totalBills)} sync={sync}>
        <button className="btn btn-sm" onClick={() => { setEditInflow(null); setInflowOpen(true); }}>+ Money In</button>
        <button className="btn btn-sm btn-primary" onClick={() => { setEdit(null); setFormOpen(true); }}>+ Add Bill</button>
      </PageHead>

      <div className="section-head"><div className="section-title"><span className="dot"></span>Recurring Bills</div></div>
      {data.bills.length === 0 ? (
        <div className="glass"><EmptyState icon={Ico.bill} title="No bills yet" sub="Add OTT, rent, wifi or any other recurring payments." action={<button className="btn btn-sm btn-primary" onClick={() => { setEdit(null); setFormOpen(true); }}>Add a bill</button>} /></div>
      ) : (
        <div className="list">
          {sortedBills.map(b => {
            const due = nextDueDate(b.dueDay || 1, b.paidCycles);
            const dd = daysUntil(due);
            return (
              <div className="item" key={b.id}>
                <div className="item-ico">{Ico.bill}</div>
                <div className="item-body">
                  <div className="item-name">{b.name}</div>
                  <div className="item-meta">
                    <span className={'pill ' + (dd <= 3 ? 'red' : dd <= 7 ? 'amber' : 'blue')}><span className="pdot"></span>due {relDays(dd)}</span>
                    <span>{fmtDate(due)}</span>
                  </div>
                </div>
                <div className="item-amt">{inr(b.amount)}</div>
                <div className="item-actions">
                  <button className="btn btn-sm btn-primary" onClick={() => { setPayTarget(b); setPayAmount(String(b.amount)); setPayBank(data.banks[0] ? data.banks[0].id : ''); }}>Pay</button>
                  <button className="btn btn-sm" onClick={() => markDone(b)}>Done</button>
                  <button className="btn btn-sm" onClick={() => { setEdit(b); setFormOpen(true); }}>Edit</button>
                  <button className="btn btn-sm btn-danger" onClick={() => setConfirmDel(b)}>Delete</button>
                </div>
              </div>
            );
          })}
        </div>
      )}

      <div className="section-head"><div className="section-title"><span className="dot"></span>Money Coming In</div></div>
      {data.inflows.length === 0 ? (
        <div className="glass"><EmptyState icon={Ico.down} title="No incoming payments yet" sub="Add your salary or any expected payments." action={<button className="btn btn-sm btn-primary" onClick={() => { setEditInflow(null); setInflowOpen(true); }}>Add income</button>} /></div>
      ) : (
        <div className="list">
          {sortedInflows.map(f => {
            const due = nextDueDate(f.day || 1, f.receivedCycles);
            const dd = daysUntil(due);
            return (
              <div className="item" key={f.id}>
                <div className="item-ico" style={{ color: 'var(--green)' }}>{Ico.down}</div>
                <div className="item-body">
                  <div className="item-name">{f.name}</div>
                  <div className="item-meta"><span className="pill green"><span className="pdot"></span>in {dd} days</span><span>{fmtDate(due)}</span></div>
                </div>
                <div className="item-amt" style={{ color: 'var(--green)' }}>+{inr(f.amount)}</div>
                <div className="item-actions">
                  <button className="btn btn-sm" onClick={() => { setEditInflow(f); setInflowOpen(true); }}>Edit</button>
                  <button className="btn btn-sm btn-danger" onClick={() => { mut(d => { d.inflows = d.inflows.filter(x => x.id !== f.id); }); showToast('Removed'); }}>Delete</button>
                </div>

      <BillModal open={formOpen} onClose={() => { setFormOpen(false); setEdit(null); }} bill={edit} onSave={saveBill} />

      <Modal open={!!payTarget} onClose={() => setPayTarget(null)} title={payTarget ? 'Pay ' + payTarget.name : ''}>
        {payTarget && (
          <div>
            <div className="field"><label className="label">Amount</label><MoneyInput value={payAmount} onChange={setPayAmount} /></div>
            <div className="field">
              <label className="label">Pay from</label>
              <select className="select" value={payBank} onChange={(e) => setPayBank(e.target.value)}>

          </div>
        )}
      </Modal>

      <Modal open={!!confirmDel} onClose={() => setConfirmDel(null)} title="Delete this bill?">

        </div>
      </Modal>
    </div>
  );

function DematCalendar({ account, onSetValue, onClearValue }) {
  const today = startOfToday();
  const [viewYear, setViewYear] = useState(today.getFullYear());
  const [viewMonth, setViewMonth] = useState(today.getMonth());
  const [editDate, setEditDate] = useState(null);
  const [editVal, setEditVal] = useState('');

  const history = useMemo(() => {
    const map = {};
    (account.history || []).forEach(h => { map[h.date] = Number(h.value) || 0; });
    return map;
  }, [account.history]);

  const firstDay = new Date(viewYear, viewMonth, 1);
  const startDow = firstDay.getDay();
  const dim = daysInMonth(viewYear, viewMonth);

  const cells = [];
  for (let i = 0; i < startDow; i++) cells.push({ empty: true, key: 'e' + i });
  for (let d = 1; d <= dim; d++) {
    const iso = viewYear + '-' + pad(viewMonth + 1) + '-' + pad(d);
    const val = history[iso];
    let prevVal = null;
    const sortedKeys = Object.keys(history).sort();
    for (let k = 0; k < sortedKeys.length; k++) {
      if (sortedKeys[k] < iso) prevVal = history[sortedKeys[k]];
      else break;
    }
    const pnl = (val !== undefined && prevVal !== null) ? r2(val - prevVal) : null;
    cells.push({ empty: false, key: iso, day: d, iso, val: val !== undefined ? val : null, pnl, isToday: iso === toISO(today) });
  }
  while (cells.length % 7 !== 0) cells.push({ empty: true, key: 'pe' + cells.length });

  const monthLabel = MONTHS_FULL[viewMonth] + ' ' + viewYear;

  const monthEntries = (account.history || []).filter(h => h.date.startsWith(viewYear + '-' + pad(viewMonth + 1)));
  let monthStart = null, monthEnd = null;
  if (monthEntries.length) {
    const sorted = monthEntries.slice().sort((a, b) => a.date.localeCompare(b.date));
    monthStart = Number(sorted[0].value);
    monthEnd = Number(sorted[sorted.length - 1].value);
  }
  const monthPnl = (monthStart !== null && monthEnd !== null) ? r2(monthEnd - monthStart) : null;

  const prevMonth = () => { if (viewMonth === 0) { setViewMonth(11); setViewYear(y => y - 1); } else setViewMonth(m => m - 1); };
  const nextMonth = () => { if (viewMonth === 11) { setViewMonth(0); setViewYear(y => y + 1); } else setViewMonth(m => m + 1); };

  const openEdit = (cell) => { if (cell.empty) return; setEditDate(cell.iso); setEditVal(cell.val !== null ? String(cell.val) : ''); };
  const saveEdit = () => {
    if (!editDate) return;
    if (editVal === '' || editVal === null) onClearValue(editDate);
    else onSetValue(editDate, r2(editVal));
    setEditDate(null);
  };
  const clearEdit = () => { if (!editDate) return; onClearValue(editDate); setEditDate(null); };

  return (
    <div>
      <div className="cal-nav">
        <button className="icon-btn" onClick={prevMonth} aria-label="Previous month">{Ico.chevLeft}</button>
        <div className="cal-nav-title">{monthLabel}</div>

        </div>
        <div className="cal-stat">
          <div className="cal-stat-label">Month P&L</div>

}

function Demat({ data, mut, showToast, sync }) {
  const [formOpen, setFormOpen] = useState(false);
  const [edit, setEdit] = useState(null);
  const [updateTarget, setUpdateTarget] = useState(null);
  const [updateVal, setUpdateVal] = useState('');
  const [withdrawTarget, setWithdrawTarget] = useState(null);
  const [withdrawAmt, setWithdrawAmt] = useState('');
  const [withdrawBank, setWithdrawBank] = useState(data.banks[0] ? data.banks[0].id : '');
  const [selected, setSelected] = useState('all');
  const [calAccountId, setCalAccountId] = useState(data.demats[0] ? data.demats[0].id : '');
  const [confirmDel, setConfirmDel] = useState(null);

  const total = data.demats.reduce((s, d) => s + (Number(d.balance) || 0), 0);

  useEffect(() => {
    if (data.demats.length && !data.demats.find(d => d.id === calAccountId)) setCalAccountId(data.demats[0].id);
  }, [data.demats]);

  const chartPoints = useMemo(() => {
    const accounts = selected === 'all' ? data.demats : data.demats.filter(d => d.id === selected);
    const dates = {};
    accounts.forEach(a => (a.history || []).forEach(h => { dates[h.date] = true; }));
    const sorted = Object.keys(dates).sort();
    if (sorted.length === 0) {
      const now = accounts.filter(a => Number(a.balance) > 0);
      if (!now.length) return [];
      return [{ date: toISO(new Date()), value: r2(now.reduce((s, a) => s + (Number(a.balance) || 0), 0)) }];
    }
    return sorted.map(dt => {
      let sum = 0;
      accounts.forEach(a => {
        const hs = (a.history || []).filter(h => h.date <= dt).sort((x, y) => x.date.localeCompare(y.date));
        if (hs.length) sum += Number(hs[hs.length - 1].value) || 0;
        else sum += Number(a.balance) || 0;
      });
      return { date: dt, value: r2(sum) };
    });
  }, [data.demats, selected]);

  const calAccount = data.demats.find(d => d.id === calAccountId) || data.demats[0];

  const setCalValue = (date, value) => {
    if (!calAccount) return;
    mut(d => {
      const a = d.demats.find(x => x.id === calAccount.id);
      if (!a) return;
      a.history = (a.history || []).filter(h => h.date !== date);
      a.history.push({ date, value });
      a.history.sort((x, y) => x.date.localeCompare(y.date));
      if (date === toISO(new Date())) a.balance = value;
      const latest = a.history[a.history.length - 1];
      if (latest && latest.date === date) a.balance = value;
    });
    showToast('Saved for ' + fmtDate(date));
  };

  const clearCalValue = (date) => {
    if (!calAccount) return;
    mut(d => {
      const a = d.demats.find(x => x.id === calAccount.id);
      if (!a) return;
      a.history = (a.history || []).filter(h => h.date !== date);
    });
    showToast('Cleared entry');
  };

  const saveAccount = (name, balance, id) => {
    mut(d => {
      if (id) { const a = d.demats.find(x => x.id === id); if (a) { a.name = name; a.balance = r2(balance); } }
      else d.demats.push({ id: uid(), name, balance: r2(balance), history: [{ date: toISO(new Date()), value: r2(balance) }] });
    });
    setFormOpen(false); setEdit(null);
    showToast(id ? 'Demat updated' : 'Demat added');
  };

  const saveUpdate = () => {
    const v = r2(updateVal);
    mut(d => {
      const a = d.demats.find(x => x.id === updateTarget.id);
      if (!a) return;
      a.balance = v;
      a.history = (a.history || []).filter(h => h.date !== toISO(new Date()));
      a.history.push({ date: toISO(new Date()), value: v });
      a.history.sort((x, y) => x.date.localeCompare(y.date));
    });
    setUpdateTarget(null);
    showToast('Demat balance updated');
  };

  const doWithdraw = () => {
    const amt = r2(withdrawAmt);
    if (!amt || amt <= 0) { showToast('Enter a valid amount'); return; }
    const a0 = withdrawTarget;
    mut(d => {
      const a = d.demats.find(x => x.id === a0.id);
      const b = d.banks.find(x => x.id === withdrawBank);
      if (!a || !b) return;
      a.balance = r2(a.balance - amt);
      a.history = (a.history || []).filter(h => h.date !== toISO(new Date()));
      a.history.push({ date: toISO(new Date()), value: a.balance });
      a.history.sort((x, y) => x.date.localeCompare(y.date));
      b.balance = r2(b.balance + amt);
      d.transactions.push({ id: uid(), bankId: withdrawBank, amount: amt, dir: 'in', note: 'Withdrawn from ' + a.name, category: 'Transfer', date: toISO(new Date()), affectsBalance: true, ts: Date.now() });
    });
    setWithdrawTarget(null);
    showToast('Money moved to your bank');
  };

  return (
    <div>
      <PageHead title="Demat Accounts" sub={'Total value ' + inr(total)} sync={sync}>
        <button className="btn btn-sm btn-primary" onClick={() => { setEdit(null); setFormOpen(true); }}>+ Add Demat</button>
      </PageHead>

      <div className="glass" style={{ padding: '20px', marginBottom: '18px' }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: '12px', marginBottom: '14px' }}>
          <div className="section-title"><span className="dot"></span>Portfolio Progress</div>
          <select className="select" style={{ maxWidth: '230px' }} value={selected} onChange={(e) => setSelected(e.target.value)}>
            <option value="all">All accounts</option>
            {data.demats.map(d => <option key={d.id} value={d.id}>{d.name}</option>)}
          </select>
        </div>
        <LineChart points={chartPoints} />
      </div>

      {calAccount && (
        <React.Fragment>
          <div className="section-head">
            <div className="section-title"><span className="dot"></span>Daily P&L Calendar</div>
            <select className="select" style={{ maxWidth: '230px' }} value={calAccountId} onChange={(e) => setCalAccountId(e.target.value)}>
              {data.demats.map(d => <option key={d.id} value={d.id}>{d.name}</option>)}
            </select>
          </div>
          <div className="glass" style={{ padding: '20px', marginBottom: '18px' }}>
            <DematCalendar account={calAccount} onSetValue={setCalValue} onClearValue={clearCalValue} />
          </div>
        </React.Fragment>
      )}

      <div className="grid g2">
        {data.demats.map(a => (
          <div className="glass" style={{ padding: '18px' }} key={a.id}>
            <div className="kpi-label">{a.name}</div>
            <div style={{ fontSize: '22px', fontWeight: 700, marginTop: '8px', letterSpacing: '-.6px' }} className="mono">{inr(a.balance)}</div>
            <div style={{ fontSize: '11.5px', color: 'var(--muted)', marginTop: '6px' }}>
              {(a.history || []).length} entries · last {(a.history && a.history.length) ? fmtDate(a.history[a.history.length - 1].date) : '—'}
            </div>
            <div className="item-actions" style={{ marginTop: '14px' }}>
              <button className="btn btn-sm btn-primary" onClick={() => { setUpdateTarget(a); setUpdateVal(String(a.balance)); }}>Update Today</button>
              <button className="btn btn-sm" onClick={() => { setWithdrawTarget(a); setWithdrawAmt(''); setWithdrawBank(data.banks[0] ? data.banks[0].id : ''); }}>Withdraw</button>
              <button className="btn btn-sm" onClick={() => { setEdit(a); setFormOpen(true); }}>Edit</button>
              <button className="btn btn-sm btn-danger" onClick={() => setConfirmDel(a)}>Delete</button>
            </div>
          </div>
        ))}
      </div>

      <Modal open={!!updateTarget} onClose={() => setUpdateTarget(null)} title="Update Today's Balance">
        <div className="field"><label className="label">Current value of {updateTarget ? updateTarget.name : ''}</label><MoneyInput value={updateVal} onChange={setUpdateVal} /></div>
        <button className="btn btn-primary" style={{ width: '100%', justifyContent: 'center', padding: '11px' }} onClick={saveUpdate}>Save Today's Value</button>
      </Modal>

      <Modal open={!!withdrawTarget} onClose={() => setWithdrawTarget(null)} title="Withdraw to Bank">
        <div className="field"><label className="label">Amount to withdraw</label><MoneyInput value={withdrawAmt} onChange={setWithdrawAmt} /></div>
        <div className="field">
          <label className="label">Send to bank</label>
          <select className="select" value={withdrawBank} onChange={(e) => setWithdrawBank(e.target.value)}>
            {data.banks.map(b => <option key={b.id} value={b.id}>{b.name} — {inr(b.balance)}</option>)}
          </select>
        </div>
        <button className="btn btn-primary" style={{ width: '100%', justifyContent: 'center', padding: '11px' }} onClick={doWithdraw}>Move Money</button>
      </Modal>

      <DematModal open={formOpen} onClose={() => { setFormOpen(false); setEdit(null); }} account={edit} onSave={saveAccount} />

      <Modal open={!!confirmDel} onClose={() => setConfirmDel(null)} title="Delete this demat account?">
        <p style={{ fontSize: '13.5px', color: 'var(--muted)', marginBottom: '18px', lineHeight: 1.55 }}>All history for this account will be removed.</p>
        <div style={{ display: 'flex', gap: '10px' }}>
          <button className="btn" style={{ flex: 1, justifyContent: 'center' }} onClick={() => setConfirmDel(null)}>Cancel</button>
          <button className="btn btn-danger" style={{ flex: 1, justifyContent: 'center' }} onClick={() => {
            mut(d => { d.demats = d.demats.filter(x => x.id !== confirmDel.id); });
            setConfirmDel(null); showToast('Demat removed');
          }}>Delete</button>
        </div>
      </Modal>
    </div>
  );
}

function DematModal({ open, onClose, account, onSave }) {
  const [name, setName] = useState('');
  const [balance, setBalance] = useState('');
  useEffect(() => { if (open) { setName(account ? account.name : ''); setBalance(account ? String(account.balance || '') : ''); } }, [open, account]);
  if (!open) return null;
  return (
    <Modal open={open} onClose={onClose} title={account ? 'Edit Demat Account' : 'Add Demat Account'}>
      <div className="field"><label className="label">Account Name</label><input className="input" value={name} onChange={(e) => setName(e.target.value)} placeholder="e.g. Zerodha, Groww" /></div>
      <div className="field"><label className="label">Current Value</label><MoneyInput value={balance} onChange={setBalance} /></div>
      <button className="btn btn-primary" style={{ width: '100%', justifyContent: 'center', padding: '11px' }}
        onClick={() => onSave(name.trim() || 'Demat', balance, account ? account.id : null)}>{account ? 'Save' : 'Add Account'}</button>
    </Modal>
