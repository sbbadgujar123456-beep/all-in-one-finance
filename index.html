<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>ShubhVault — Money Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#05060a;--bg-2:#0a0c13;--txt:#eef1f8;--txt-2:#b8c0d4;
  --muted:#6e7689;--muted-2:#4a5163;
  --glass:rgba(255,255,255,.028);--glass-2:rgba(255,255,255,.05);--glass-3:rgba(255,255,255,.08);
  --brd:rgba(255,255,255,.06);--brd-2:rgba(255,255,255,.1);
  --accent:#7c92ff;--accent-2:#a78bfa;--accent-soft:rgba(124,146,255,.12);
  --green:#34d399;--green-soft:rgba(52,211,153,.12);
  --red:#f87171;--red-soft:rgba(248,113,113,.12);
  --amber:#fbbf24;--amber-soft:rgba(251,191,36,.12);
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow-md:0 12px 32px -12px rgba(0,0,0,.6);
  --shadow-lg:0 32px 80px -32px rgba(0,0,0,.8);
  --rays-opacity:.32;
}
html[data-theme="light"]{
  --bg:#f6f7fb;--bg-2:#ffffff;--txt:#0c1120;--txt-2:#3d4658;
  --muted:#697086;--muted-2:#99a0b3;
  --glass:rgba(255,255,255,.7);--glass-2:rgba(255,255,255,.9);--glass-3:rgba(255,255,255,1);
  --brd:rgba(15,23,42,.07);--brd-2:rgba(15,23,42,.11);
  --accent:#4f6dff;--accent-2:#8b5cf6;--accent-soft:rgba(79,109,255,.1);
  --green:#059669;--green-soft:rgba(5,150,105,.1);
  --red:#dc2626;--red-soft:rgba(220,38,38,.08);
  --amber:#d97706;--amber-soft:rgba(217,119,6,.1);
  --shadow-sm:0 1px 2px rgba(15,23,42,.06);
  --shadow-md:0 12px 32px -12px rgba(15,23,42,.12);
  --shadow-lg:0 32px 80px -32px rgba(15,23,42,.2);
  --rays-opacity:.18;
}
html,body{height:100%}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--txt);overflow-x:hidden;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;font-feature-settings:"cv11","ss01";transition:background .5s ease,color .5s ease;line-height:1.5}
button,input,select,textarea{font-family:inherit;color:inherit}
input,select{-webkit-appearance:none;appearance:none}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:rgba(140,155,200,.2);border-radius:20px}
::-webkit-scrollbar-thumb:hover{background:rgba(140,155,200,.35)}
::-webkit-scrollbar-track{background:transparent}
.bg-base{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse 1200px 800px at 50% -10%, rgba(124,146,255,.05), transparent 60%),radial-gradient(ellipse 900px 700px at 85% 110%, rgba(167,139,250,.035), transparent 60%),var(--bg);transition:background .5s ease}
html[data-theme="light"] .bg-base{background:radial-gradient(ellipse 1200px 800px at 50% -10%, rgba(79,109,255,.06), transparent 60%),radial-gradient(ellipse 900px 700px at 85% 110%, rgba(139,92,246,.04), transparent 60%),var(--bg)}
.bg-base::after{content:'';position:absolute;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");opacity:.02;mix-blend-mode:overlay;pointer-events:none}
html[data-theme="light"] .bg-base::after{opacity:.03;mix-blend-mode:multiply}
.rays-bg{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:var(--rays-opacity);transition:opacity .6s ease;-webkit-mask-image:linear-gradient(180deg, #000 0%, #000 45%, rgba(0,0,0,.55) 75%, transparent 100%);mask-image:linear-gradient(180deg, #000 0%, #000 45%, rgba(0,0,0,.55) 75%, transparent 100%)}
.rays-container{width:100%;height:100%;position:relative;overflow:hidden}
.rays-container canvas{display:block;width:100%!important;height:100%!important}
.glass{background:var(--glass);border:1px solid var(--brd);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border-radius:16px;box-shadow:var(--shadow-md);position:relative}
.glass::before{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.04),transparent 40%);mask:linear-gradient(#000,#000) content-box,linear-gradient(#000,#000);-webkit-mask:linear-gradient(#000,#000) content-box,linear-gradient(#000,#000);-webkit-mask-composite:xor;mask-composite:exclude;padding:1px}
html[data-theme="light"] .glass::before{background:linear-gradient(180deg,rgba(255,255,255,.9),transparent 40%)}
.glass-soft{background:var(--glass-2);border:1px solid var(--brd);border-radius:12px}
.app{position:relative;z-index:2;display:flex;min-height:100vh}
.sidebar{width:232px;flex-shrink:0;padding:20px 14px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;border-right:1px solid var(--brd);background:rgba(10,12,19,.55);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
html[data-theme="light"] .sidebar{background:rgba(255,255,255,.6)}
.brand{display:flex;align-items:center;gap:11px;padding:4px 10px 22px}
.brand-logo{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:14px;letter-spacing:-.5px;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;box-shadow:0 8px 20px -6px var(--accent-soft),inset 0 1px 0 rgba(255,255,255,.2)}
.brand-name{font-weight:700;font-size:15px;letter-spacing:-.3px;line-height:1}
.brand-sub{font-size:9.5px;color:var(--muted);letter-spacing:1.4px;margin-top:3px;font-weight:600}
.nav-item{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:10px;cursor:pointer;font-size:13.5px;font-weight:500;color:var(--muted);border:1px solid transparent;transition:all .18s ease;background:transparent;width:100%;text-align:left}
.nav-item:hover{background:var(--glass-2);color:var(--txt-2)}
.nav-item.active{background:var(--accent-soft);color:var(--txt);border-color:rgba(124,146,255,.18);font-weight:600}
.nav-item.active .nav-ico{color:var(--accent)}
.nav-ico{width:18px;height:18px;flex-shrink:0;display:grid;place-items:center;color:var(--muted);transition:color .18s ease}
.nav-ico svg{width:100%;height:100%;display:block}
.nav-item:hover .nav-ico{color:var(--txt-2)}
.side-foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--brd);display:flex;flex-direction:column;gap:2px}
.main{flex:1;min-width:0;padding:26px 30px 120px;max-width:1240px;margin:0 auto;width:100%}
.topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:26px;flex-wrap:wrap}
.page-title{font-size:24px;font-weight:700;letter-spacing:-.7px;line-height:1.1}
.page-sub{font-size:13px;color:var(--muted);margin-top:5px}
.top-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--brd-2);background:var(--glass-2);border-radius:9px;padding:9px 14px;font-size:13px;font-weight:600;cursor:pointer;transition:all .18s cubic-bezier(.4,.2,.2,1);white-space:nowrap;display:inline-flex;align-items:center;gap:6px;color:var(--txt);letter-spacing:-.1px}
.btn:hover{background:var(--glass-3);border-color:rgba(255,255,255,.18);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn-primary{background:linear-gradient(180deg,var(--accent),#6880ff);border-color:rgba(255,255,255,.1);color:#fff;box-shadow:0 6px 16px -6px rgba(124,146,255,.6),inset 0 1px 0 rgba(255,255,255,.18)}
.btn-primary:hover{box-shadow:0 8px 22px -6px rgba(124,146,255,.75),inset 0 1px 0 rgba(255,255,255,.22);border-color:rgba(255,255,255,.15)}
.btn-sm{padding:6px 11px;font-size:12px;border-radius:8px}
.btn-ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn-ghost:hover{background:var(--glass-2);color:var(--txt)}
.btn-danger{color:var(--red);border-color:rgba(248,113,113,.22)}
.btn-danger:hover{background:var(--red-soft);border-color:rgba(248,113,113,.35)}
.btn-warn{color:var(--amber);border-color:rgba(251,191,36,.25)}
.btn-warn:hover{background:var(--amber-soft);border-color:rgba(251,191,36,.4)}
.icon-btn{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;cursor:pointer;background:var(--glass-2);border:1px solid var(--brd);transition:all .18s ease;font-size:13px;color:var(--muted)}
.icon-btn:hover{background:var(--glass-3);color:var(--txt);border-color:var(--brd-2)}
.icon-btn svg{width:14px;height:14px}
.seg{display:inline-flex;background:var(--glass-2);border:1px solid var(--brd);border-radius:10px;padding:3px;gap:3px}
.seg .seg-btn{padding:6px 12px;border-radius:7px;font-size:12px;font-weight:600;color:var(--muted);background:transparent;border:none;cursor:pointer;transition:all .18s ease;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.seg .seg-btn:hover{color:var(--txt-2)}
.seg .seg-btn.active{background:linear-gradient(180deg,var(--accent),#6880ff);color:#fff;box-shadow:0 4px 12px -4px rgba(124,146,255,.5)}
.seg-full{display:grid;grid-template-columns:1fr 1fr;width:100%}
.seg-full .seg-btn{padding:9px 12px;text-align:center;justify-content:center}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:1080px){.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:900px){.g3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){.g2,.g3,.g4{grid-template-columns:1fr}}
.kpi{padding:16px 18px;border-radius:14px;position:relative;overflow:hidden}
.kpi-head{display:flex;align-items:center;gap:8px;margin-bottom:2px}
.kpi-dot{width:6px;height:6px;border-radius:50%;background:var(--muted-2)}
.kpi-dot.accent{background:var(--accent);box-shadow:0 0 8px var(--accent-soft)}
.kpi-dot.green{background:var(--green);box-shadow:0 0 8px var(--green-soft)}
.kpi-dot.red{background:var(--red);box-shadow:0 0 8px var(--red-soft)}
.kpi-dot.amber{background:var(--amber);box-shadow:0 0 8px var(--amber-soft)}
.kpi-label{font-size:10.5px;color:var(--muted);font-weight:600;letter-spacing:.7px;text-transform:uppercase}
.kpi-val{font-size:22px;font-weight:700;letter-spacing:-.7px;margin-top:8px;font-variant-numeric:tabular-nums;font-feature-settings:"tnum";word-break:break-word}
.kpi-note{font-size:11.5px;color:var(--muted);margin-top:6px}
.section-head{display:flex;align-items:center;justify-content:space-between;margin:28px 0 12px;gap:12px;flex-wrap:wrap}
.section-head:first-child{margin-top:0}
.section-title{font-size:14px;font-weight:600;letter-spacing:-.2px;display:flex;align-items:center;gap:9px;color:var(--txt-2)}
.section-title .dot{width:5px;height:5px;border-radius:50%;background:var(--accent)}
.section-title b{color:var(--txt);font-weight:700;font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:12px;background:var(--glass);border:1px solid var(--brd);transition:all .2s cubic-bezier(.4,.2,.2,1);position:relative}
.item:hover{border-color:var(--brd-2);background:var(--glass-2)}
.item-ico{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:16px;flex-shrink:0;background:var(--glass-2);border:1px solid var(--brd);color:var(--txt-2)}
.item-ico svg{width:18px;height:18px}
.item-body{flex:1;min-width:0}
.item-name{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--txt);letter-spacing:-.1px}
.item-meta{font-size:11.5px;color:var(--muted);margin-top:5px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.item-amt{font-size:14px;font-weight:700;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;font-feature-settings:"tnum";letter-spacing:-.2px}
.item-actions{display:flex;gap:6px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;padding:3px 9px;border-radius:20px;background:var(--glass-2);border:1px solid var(--brd);color:var(--muted);letter-spacing:.1px;white-space:nowrap}
.pill.red{color:var(--red);border-color:rgba(248,113,113,.22);background:var(--red-soft)}
.pill.amber{color:var(--amber);border-color:rgba(251,191,36,.22);background:var(--amber-soft)}
.pill.green{color:var(--green);border-color:rgba(52,211,153,.22);background:var(--green-soft)}
.pill.blue{color:var(--accent);border-color:rgba(124,146,255,.22);background:var(--accent-soft)}
.pill .pdot{width:5px;height:5px;border-radius:50%;background:currentColor}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.label{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.5px;text-transform:uppercase}
.input,.select{width:100%;padding:10px 12px;border-radius:10px;background:var(--glass-2);border:1px solid var(--brd-2);font-size:13.5px;outline:none;transition:all .18s ease;font-variant-numeric:tabular-nums;color:var(--txt)}
.input::placeholder{color:var(--muted-2)}
.input:focus,.select:focus{border-color:var(--accent);background:var(--glass-3);box-shadow:0 0 0 3px var(--accent-soft)}
.select{cursor:pointer;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:34px}
.select option{background:#0d1018;color:#eef1f8}
html[data-theme="light"] .select option{background:#fff;color:#0c1120}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){.row2{grid-template-columns:1fr}}
.switch{display:flex;align-items:center;gap:11px;cursor:pointer;user-select:none;padding:8px 0}
.switch-track{width:40px;height:23px;border-radius:20px;background:var(--glass-2);border:1px solid var(--brd-2);position:relative;transition:all .22s;flex-shrink:0}
.switch-track.on{background:var(--accent);border-color:transparent}
.switch-knob{position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;background:#fff;transition:all .22s cubic-bezier(.4,.2,.2,1);box-shadow:0 2px 4px rgba(0,0,0,.3)}
.switch-track.on .switch-knob{left:20px}
.switch-lbl{font-size:12.5px;font-weight:500;color:var(--txt-2);line-height:1.35}
.modal-bg{position:fixed;inset:0;background:rgba(2,4,10,.7);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{width:100%;max-width:460px;max-height:88vh;overflow-y:auto;padding:22px;animation:pop .28s cubic-bezier(.34,1.2,.5,1);box-shadow:var(--shadow-lg)}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(8px)}to{opacity:1;transform:scale(1) translateY(0)}}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.modal-head h3{font-size:16px;font-weight:700;letter-spacing:-.3px}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);z-index:200;padding:11px 16px 11px 18px;border-radius:11px;font-size:13px;font-weight:600;background:rgba(13,16,24,.94);border:1px solid var(--brd-2);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:var(--shadow-lg);animation:toastIn .28s cubic-bezier(.34,1.2,.5,1);color:#eef1f8;display:flex;align-items:center;gap:9px;max-width:min(92vw,520px)}
html[data-theme="light"] .toast{background:rgba(255,255,255,.98);color:#0c1120}
.toast::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);flex-shrink:0}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,14px)}to{opacity:1;transform:translate(-50%,0)}}
.toast-msg{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast-action{margin-left:6px;padding:5px 12px;border-radius:8px;background:rgba(124,146,255,.22);border:1px solid rgba(124,146,255,.4);color:var(--accent);font-size:12px;font-weight:700;cursor:pointer;transition:all .15s ease;flex-shrink:0}
.toast-action:hover{background:rgba(124,146,255,.35);transform:translateY(-1px)}
html[data-theme="light"] .toast-action{color:#4f6dff}
.login-wrap{position:relative;z-index:2;min-height:100vh;display:grid;place-items:center;padding:22px}
.login-card{width:100%;max-width:380px;padding:34px 30px;border-radius:20px;animation:pop .5s cubic-bezier(.34,1.2,.5,1);box-shadow:var(--shadow-lg)}
.login-logo{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-size:18px;font-weight:800;letter-spacing:-.5px;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;margin:0 auto 18px;box-shadow:0 14px 34px -10px var(--accent-soft),inset 0 1px 0 rgba(255,255,255,.2)}
.login-title{font-size:21px;font-weight:700;text-align:center;letter-spacing:-.5px}
.login-sub{font-size:12.5px;color:var(--muted);text-align:center;margin-top:6px;margin-bottom:26px}
.err{color:var(--red);font-size:12px;text-align:center;margin-top:12px;font-weight:600}
.shake{animation:shake .42s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.boot{position:fixed;inset:0;z-index:500;display:grid;place-items:center;background:#05060a;color:#6e7689;font-size:13px;font-weight:500;letter-spacing:.3px}
.boot-inner{display:flex;flex-direction:column;align-items:center;gap:16px}
.boot-logo{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-weight:800;font-size:16px;background:linear-gradient(135deg,#7c92ff,#a78bfa);color:#fff;animation:bootPulse 1.6s ease-in-out infinite}
@keyframes bootPulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.94);opacity:.7}}
.log-year{margin-bottom:36px}
.log-year-head{font-size:11px;font-weight:700;color:var(--accent);letter-spacing:1.6px;text-transform:uppercase;margin-bottom:16px;display:flex;align-items:center;gap:12px}
.log-year-head::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--brd) 0%,transparent 100%)}
.log-year-num{font-size:22px;font-weight:800;color:var(--txt);letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.log-month{margin-bottom:22px;padding-left:4px}
.log-month-head{font-size:13px;font-weight:700;color:var(--txt-2);letter-spacing:-.2px;margin-bottom:10px;display:flex;align-items:center;gap:10px}
.log-month-head::after{content:'';flex:1;height:1px;background:var(--brd)}
.log-month-count{font-size:10.5px;color:var(--muted);font-weight:600;letter-spacing:.5px}
.log-day{margin-bottom:12px;padding-left:10px;border-left:2px solid var(--brd)}
.log-day-head{font-size:11.5px;font-weight:600;color:var(--accent);margin-bottom:7px;padding-left:2px;display:flex;align-items:center;gap:10px}
.tx{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:11px;background:var(--glass);border:1px solid var(--brd);margin-bottom:6px;transition:all .18s ease}
.tx:hover{border-color:var(--brd-2);background:var(--glass-2)}
.tx .item-ico{width:32px;height:32px;font-size:13px;border-radius:9px}
.tx .item-ico svg{width:14px;height:14px}
.search-wrap{position:relative;flex:1;max-width:340px;min-width:180px}
.search-wrap .input{padding-left:36px}
.search-ico{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--muted);pointer-events:none}
.search-clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:22px;height:22px;border-radius:50%;background:var(--glass-2);border:1px solid var(--brd);display:grid;place-items:center;cursor:pointer;color:var(--muted);font-size:11px;line-height:1}

const PIE_COLORS = ['#7c92ff', '#34d399', '#fbbf24', '#f87171', '#a78bfa', '#22d3ee', '#fb923c', '#ec4899', '#10b981', '#f472b6', '#64748b', '#94a3b8', '#facc15', '#60a5fa', '#84cc16'];

function LightRaysBackground({ theme }) {
  const containerRef = useRef(null);
  const cleanupRef = useRef(null);
  const mouseRef = useRef({ x: 0.5, y: 0.5 });
  const smoothRef = useRef({ x: 0.5, y: 0.5 });

  useEffect(() => {
    const ogl = window.ogl;
    if (!ogl || !containerRef.current) return;
    const { Renderer, Program, Triangle, Mesh } = ogl;
    if (!Renderer || !Program || !Triangle || !Mesh) return;
    const lightMode = theme === 'light';
    const hexToRgb = hex => {
      const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
      return m ? [parseInt(m[1],16)/255, parseInt(m[2],16)/255, parseInt(m[3],16)/255] : [1,1,1];
    };
    const getAnchorAndDir = (origin, w, h) => {
      const outside = 0.2;
      switch (origin) {
        case 'top-left': return { anchor: [0, -outside*h], dir: [0, 1] };
        case 'top-right': return { anchor: [w, -outside*h], dir: [0, 1] };
        case 'left': return { anchor: [-outside*w, 0.5*h], dir: [1, 0] };
        case 'right': return { anchor: [(1+outside)*w, 0.5*h], dir: [-1, 0] };
        case 'bottom-left': return { anchor: [0, (1+outside)*h], dir: [0, -1] };
        case 'bottom-center': return { anchor: [0.5*w, (1+outside)*h], dir: [0, -1] };
        case 'bottom-right': return { anchor: [w, (1+outside)*h], dir: [0, -1] };
        default: return { anchor: [0.5*w, -outside*h], dir: [0, 1] };
      }
    };
    const vert = `attribute vec2 position; varying vec2 vUv; void main() { vUv = position * 0.5 + 0.5; gl_Position = vec4(position, 0.0, 1.0); }`;
    const frag = `precision highp float;
uniform float iTime; uniform vec2 iResolution; uniform vec2 rayPos; uniform vec2 rayDir; uniform vec3 raysColor;
uniform float raysSpeed; uniform float lightSpread; uniform float rayLength; uniform float pulsating; uniform float fadeDistance;
uniform float saturation; uniform vec2 mousePos; uniform float mouseInfluence; uniform float noiseAmount; uniform float distortion; uniform float lightMode;
varying vec2 vUv;
float rayStrength(vec2 raySource, vec2 rayRefDirection, vec2 coord, float seedA, float seedB, float speed) {
  vec2 sourceToCoord = coord - raySource;
  vec2 dirNorm = normalize(sourceToCoord);
  float cosAngle = dot(dirNorm, rayRefDirection);
  float distortedAngle = cosAngle + distortion * sin(iTime * 2.0 + length(sourceToCoord) * 0.01) * 0.2;
  float spreadFactor = pow(max(distortedAngle, 0.0), 1.0 / max(lightSpread, 0.001));
  float distance = length(sourceToCoord);
  float maxDistance = iResolution.x * rayLength;
  float lengthFalloff = clamp((maxDistance - distance) / maxDistance, 0.0, 1.0);
  float fadeFalloff = clamp((iResolution.x * fadeDistance - distance) / (iResolution.x * fadeDistance), 0.5, 1.0);
  float pulse = pulsating > 0.5 ? (0.8 + 0.2 * sin(iTime * speed * 3.0)) : 1.0;
  float baseStrength = clamp((0.45 + 0.15 * sin(distortedAngle * seedA + iTime * speed)) + (0.3 + 0.2 * cos(-distortedAngle * seedB + iTime * speed)), 0.0, 1.0);
  return baseStrength * lengthFalloff * fadeFalloff * spreadFactor * pulse;
}
void mainImage(out vec4 fragColor, in vec2 fragCoord) {
  vec2 coord = vec2(fragCoord.x, iResolution.y - fragCoord.y);
  vec2 finalRayDir = rayDir;
  if (mouseInfluence > 0.0) {
    vec2 mouseScreenPos = mousePos * iResolution.xy;
    vec2 mouseDirection = normalize(mouseScreenPos - rayPos);
    finalRayDir = normalize(mix(rayDir, mouseDirection, mouseInfluence));
  }
  vec4 rays1 = vec4(1.0) * rayStrength(rayPos, finalRayDir, coord, 36.2214, 21.11349, 1.5 * raysSpeed);
  vec4 rays2 = vec4(1.0) * rayStrength(rayPos, finalRayDir, coord, 22.3991, 18.0234, 1.1 * raysSpeed);
  fragColor = rays1 * 0.5 + rays2 * 0.4;
  float brightness = 1.0 - (coord.y / iResolution.y);
  fragColor.x *= 0.1 + brightness * 0.8; fragColor.y *= 0.3 + brightness * 0.6; fragColor.z *= 0.5 + brightness * 0.5;
  fragColor.rgb *= raysColor;
  if (lightMode > 0.5) { vec3 mapped = vec3(1.0) - exp(-max(fragColor.rgb, vec3(0.0)) * 1.35); float energy = clamp(max(mapped.r, max(mapped.g, mapped.b)), 0.0, 1.0); vec3 hue = mapped / max(energy, 0.0001); vec3 ink = mix(hue * 0.25, hue * 0.72, energy); fragColor = vec4(mix(vec3(1.0), ink, energy), 1.0); }
}
void main() { vec4 color; mainImage(color, gl_FragCoord.xy); gl_FragColor = color; }`;
    const uniforms = {
      iTime: { value: 0 }, iResolution: { value: [1, 1] }, rayPos: { value: [0, 0] }, rayDir: { value: [0, 1] },
      raysColor: { value: hexToRgb('#7c92ff') }, raysSpeed: { value: 0.8 }, lightSpread: { value: 0.6 },
      rayLength: { value: 2.6 }, pulsating: { value: 0 }, fadeDistance: { value: 1.0 },
      saturation: { value: 1.0 }, mousePos: { value: [0.5, 0.5] }, mouseInfluence: { value: 0.08 },
      noiseAmount: { value: 0.0 }, distortion: { value: 0.0 }, lightMode: { value: lightMode ? 1 : 0 }
    };
    let renderer;
    try { renderer = new Renderer({ dpr: Math.min(window.devicePixelRatio, 2), alpha: true }); } catch (e) { return; }
    const gl = renderer.gl;
    gl.canvas.style.width = '100%'; gl.canvas.style.height = '100%';
    while (containerRef.current.firstChild) containerRef.current.removeChild(containerRef.current.firstChild);
    containerRef.current.appendChild(gl.canvas);
    const geometry = new Triangle(gl);
    const program = new Program(gl, { vertex: vert, fragment: frag, uniforms });
    const mesh = new Mesh(gl, { geometry, program });
    const updatePlacement = () => {
      if (!containerRef.current || !renderer) return;
      renderer.dpr = Math.min(window.devicePixelRatio, 2);
      const { clientWidth: wCSS, clientHeight: hCSS } = containerRef.current;
      if (wCSS === 0 || hCSS === 0) return;
      renderer.setSize(wCSS, hCSS);
      const dpr = renderer.dpr;
      const w = wCSS * dpr, h = hCSS * dpr;
      uniforms.iResolution.value = [w, h];
      const { anchor, dir } = getAnchorAndDir('top-center', w, h);
      uniforms.rayPos.value = anchor; uniforms.rayDir.value = dir;
    };
    let raf = null;
    const loop = t => {
      uniforms.iTime.value = t * 0.001;
      const smoothing = 0.92;
      smoothRef.current.x = smoothRef.current.x * smoothing + mouseRef.current.x * (1 - smoothing);
      smoothRef.current.y = smoothRef.current.y * smoothing + mouseRef.current.y * (1 - smoothing);
      uniforms.mousePos.value = [smoothRef.current.x, smoothRef.current.y];
      try { renderer.render({ scene: mesh }); raf = requestAnimationFrame(loop); } catch (e) {}
    };
    const onMouse = e => {
      if (!containerRef.current) return;
      const rect = containerRef.current.getBoundingClientRect();
      mouseRef.current = { x: (e.clientX - rect.left) / rect.width, y: (e.clientY - rect.top) / rect.height };
    };
    window.addEventListener('resize', updatePlacement);
    window.addEventListener('mousemove', onMouse);
    updatePlacement();
    raf = requestAnimationFrame(loop);
    cleanupRef.current = () => {
      if (raf) cancelAnimationFrame(raf);
      window.removeEventListener('resize', updatePlacement);
      window.removeEventListener('mousemove', onMouse);
      try {
        const canvas = renderer.gl.canvas;
        const loseContextExt = renderer.gl.getExtension('WEBGL_lose_context');
        if (loseContextExt) loseContextExt.loseContext();
        if (canvas && canvas.parentNode) canvas.parentNode.removeChild(canvas);
      } catch (e) {}
    };
    return () => { if (cleanupRef.current) { cleanupRef.current(); cleanupRef.current = null; } };
  }, [theme]);

  return <div className="rays-bg" aria-hidden="true"><div ref={containerRef} className="rays-container" /></div>;
}

function SyncBadge({ sync }) {
  if (!sync) return null;
  let cls = '', label = '', icon = null, title = '';
  if (sync.state === 'synced') { cls = 'synced'; label = 'Cloud synced'; icon = Ico.cloud; title = sync.lastSync ? 'Last synced ' + timeAgo(sync.lastSync) : 'All changes saved'; }
  else if (sync.state === 'syncing') { cls = 'syncing'; label = 'Syncing…'; icon = <span className="spin">{Ico.refresh}</span>; title = 'Saving changes'; }
  else if (sync.state === 'connecting') { cls = 'syncing'; label = 'Connecting…'; icon = <span className="spin">{Ico.refresh}</span>; title = 'Connecting'; }
  else if (sync.state === 'offline') { cls = 'offline'; label = 'Offline'; icon = Ico.cloudOff; title = 'No internet. Will sync later.'; }
  else if (sync.state === 'error') { cls = 'error'; label = 'Sync error'; icon = Ico.warn; title = sync.error || 'Something went wrong'; }
  else { cls = ''; label = 'Local only'; icon = Ico.cloudOff; title = 'Cloud not configured'; }
  return <span className={'sync-badge ' + cls} title={title}><span className="sync-ico">{icon}</span><span className="sync-dot"></span><span>{label}</span></span>;
}

function Modal({ open, onClose, title, children }) {
  if (!open) return null;
  return (
    <div className="modal-bg" onClick={onClose}>
      <div className="modal glass" onClick={(e) => e.stopPropagation()}>
        <div className="modal-head"><h3>{title}</h3><button className="icon-btn" onClick={onClose}>{Ico.close}</button></div>
        <div>{children}</div>
      </div>
    </div>
  );
}

function MoneyInput({ value, onChange, placeholder, autoFocus }) {
  return (
    <input className="input" inputMode="decimal" autoFocus={autoFocus} value={value} placeholder={placeholder || '0.00'}
      onChange={(e) => {
        let v = e.target.value.replace(/[^\d.]/g, '');
        const parts = v.split('.');
        if (parts.length > 2) v = parts[0] + '.' + parts.slice(1).join('');
        if (/^\d*(\.\d{0,2})?$/.test(v)) onChange(v);
      }} />
  );
}

function DayInput({ value, onChange, placeholder }) {
  return (
    <input className="input" inputMode="numeric" value={value} placeholder={placeholder || 'DD'}
      onChange={(e) => { let v = e.target.value.replace(/\D/g, '').slice(0, 2); if (v !== '' && Number(v) > 31) v = '31'; onChange(v); }} />
  );
}

function formatCardNumber(v, name) {
  const d = String(v || '').replace(/\D/g, '').slice(0, 16);
  if (/millenia/i.test(name || '')) {
    let out = d.slice(0, 4);
    if (d.length > 4) out += ' ' + d.slice(4, 10);
    const rest = d.slice(10);
    for (let i = 0; i < rest.length; i += 4) out += ' ' + rest.slice(i, i + 4);
    return out.trim();
  }
  let out = '';
  for (let i = 0; i < d.length; i += 4) out += (i ? ' ' : '') + d.slice(i, i + 4);
  return out;
}
function formatExpiry(v) { const d = String(v || '').replace(/\D/g, '').slice(0, 4); if (d.length <= 2) return d; return d.slice(0, 2) + '/' + d.slice(2); }
function maskNumber(num) { const d = String(num || '').replace(/\D/g, ''); if (!d) return '•••• •••• •••• ••••'; return '•••• •••• •••• ' + d.slice(-4); }

function Toast({ msg, action, onAction }) {
  if (!msg) return null;
  return (
    <div className="toast">
      <span className="toast-msg">{msg}</span>
      {action ? (<button className="toast-action" onClick={(e) => { e.stopPropagation(); onAction(); }}>{action}</button>) : null}
    </div>
  );
}

function DonutChart({ items, total }) {
  const SIZE = 220;
  const CX = SIZE / 2;
  const CY = SIZE / 2;
  const STROKE = 44;
  const R = (SIZE - STROKE - 6) / 2;

  if (!items || !items.length || total <= 0) {
    return (
      <div className="pie-empty">
        <div className="pie-empty-icon">{Ico.trend}</div>
        <div style={{ fontWeight: 600, color: 'var(--txt-2)' }}>Nothing to show yet</div>
        <div style={{ fontSize: 11.5 }}>Add a transaction to see the breakdown.</div>
      </div>
    );
  }

  const circ = 2 * Math.PI * R;
  let cumulative = 0;
  const segments = items.map((it, i) => {
    const pct = it.amount / total;
    const color = PIE_COLORS[i % PIE_COLORS.length];
    const seg = { ...it, pct, color, dash: pct * circ, offset: -cumulative * circ };
    cumulative += pct;
    return seg;
  });

  return (
    <svg viewBox={`0 0 ${SIZE} ${SIZE}`} style={{ width: '100%', maxWidth: SIZE, display: 'block', margin: '0 auto', filter: 'drop-shadow(0 14px 26px rgba(0,0,0,.45))' }}>
      <defs>
        <linearGradient id="donutHighlight" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor="#ffffff" stopOpacity="0.20" />
          <stop offset="38%" stopColor="#ffffff" stopOpacity="0" />
          <stop offset="62%" stopColor="#000000" stopOpacity="0" />
          <stop offset="100%" stopColor="#000000" stopOpacity="0.28" />
        </linearGradient>
      </defs>
      <circle cx={CX} cy={CY + 4} r={R} fill="none" stroke="rgba(0,0,0,.55)" strokeWidth={STROKE} />
      <circle cx={CX} cy={CY} r={R} fill="none" stroke="var(--glass-2)" strokeWidth={STROKE} />
      {segments.map((s, i) => (
        <circle key={i} cx={CX} cy={CY} r={R} fill="none"
          stroke={s.color}
          strokeWidth={STROKE}
          strokeDasharray={`${s.dash} ${circ}`}
          strokeDashoffset={s.offset}
          transform={`rotate(-90 ${CX} ${CY})`}
        />
      ))}
      <circle cx={CX} cy={CY} r={R} fill="none" stroke="url(#donutHighlight)" strokeWidth={STROKE} pointerEvents="none" />
      <circle cx={CX} cy={CY} r={R + STROKE/2} fill="none" stroke="rgba(255,255,255,.06)" strokeWidth="1" />
      <circle cx={CX} cy={CY} r={R - STROKE/2} fill="none" stroke="rgba(255,255,255,.06)" strokeWidth="1" />
      <circle cx={CX} cy={CY} r={R - STROKE/2 - 1} fill="var(--bg)" />
      <text x={CX} y={CY - 5} textAnchor="middle" fill="var(--muted)" fontSize="9" fontWeight="700" letterSpacing="1.6">TOTAL</text>
      <text x={CX} y={CY + 16} textAnchor="middle" fill="var(--txt)" fontSize="15" fontWeight="700" fontFamily="'JetBrains Mono', monospace">{inr(total)}</text>
    </svg>
  );
}

function NetWorthChart({ points, onReset }) {
  if (!points || points.length === 0) {
    return <div className="empty"><div className="empty-icon">{Ico.trend}</div><div className="empty-title">Net worth history is starting</div><div className="empty-sub">Come back tomorrow and your progress will start showing here.</div></div>;
  }
  if (points.length === 1) {
    const p = points[0];
    const isPos = p.value >= 0;
    return (
      <div>
        <div style={{ display: 'flex', gap: '12px', alignItems: 'baseline', flexWrap: 'wrap', marginBottom: '12px' }}>
          <div style={{ fontSize: '26px', fontWeight: 800, letterSpacing: '-.9px', color: isPos ? 'var(--green)' : 'var(--red)' }} className="mono">{inr(p.value)}</div>
          <div className={'pill ' + (isPos ? 'green' : 'red')}><span className="pdot"></span>today</div>
        </div>
        <div className="glass-soft" style={{ padding: '16px', fontSize: '12.5px', color: 'var(--muted)', lineHeight: 1.55 }}>
          This is your net worth as of {fmtDate(p.date)}. Keep updating your balances and a beautiful trend line will appear in the coming days.
        </div>
      </div>
    );
  }
  const W = 800, H = 200, P = 22;
  const vals = points.map(p => p.value);
  let min = Math.min.apply(null, vals);
  let max = Math.max.apply(null, vals);
  if (min === max) { min = min - Math.max(1, Math.abs(min) * 0.1); max = max + Math.max(1, Math.abs(max) * 0.1); }
  const padY = (max - min) * 0.12;
  min -= padY; max += padY;
  const n = points.length;
  const x = (i) => P + (i * (W - 2 * P)) / Math.max(1, n - 1);
  const y = (v) => H - P - ((v - min) / (max - min)) * (H - 2 * P);
  const last = points[n - 1];
  const first = points[0];
  const isPositive = last.value >= 0;
  const lineColor = isPositive ? 'var(--green)' : 'var(--red)';
  const gradId = isPositive ? 'nwgradGreen' : 'nwgradRed';
  let d = '';
  points.forEach((p, i) => { d += (i ? ' L' : 'M') + x(i).toFixed(1) + ',' + y(p.value).toFixed(1); });
  const area = d + ' L' + x(n - 1).toFixed(1) + ',' + (H - P) + ' L' + x(0).toFixed(1) + ',' + (H - P) + ' Z';
  const change = r2(last.value - first.value);
  const base = Math.abs(first.value);
  const changePct = base > 0.5 ? r2((change / base) * 100) : null;
  const zeroY = (0 >= min && 0 <= max) ? y(0) : null;
  return (
    <div>
      <div style={{ display: 'flex', gap: '14px', alignItems: 'baseline', flexWrap: 'wrap', marginBottom: '10px' }}>
        <div style={{ fontSize: '28px', fontWeight: 800, letterSpacing: '-.9px', color: lineColor }} className="mono">{inr(last.value)}</div>
        <div className={'pill ' + (change >= 0 ? 'green' : 'red')}><span className="pdot"></span>{change >= 0 ? '▲' : '▼'} {inr(Math.abs(change))}{changePct !== null ? ' (' + (changePct >= 0 ? '+' : '') + changePct + '%)' : ''}</div>
        <div className="pill blue">Since {fmtDate(first.date)}</div>
        {onReset ? (<button className="btn btn-sm" onClick={onReset} style={{ marginLeft: 'auto' }}>{Ico.reset} Reset</button>) : null}
      </div>
      <div className="nw-chart-wrap">
        <svg viewBox={'0 0 ' + W + ' ' + H} preserveAspectRatio="none">
          <defs>
            <linearGradient id="nwgradGreen" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="var(--green)" stopOpacity="0.35" /><stop offset="100%" stopColor="var(--green)" stopOpacity="0" /></linearGradient>
            <linearGradient id="nwgradRed" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="var(--red)" stopOpacity="0.32" /><stop offset="100%" stopColor="var(--red)" stopOpacity="0" /></linearGradient>
          </defs>
          {[0, 1, 2, 3].map(i => (<line key={i} x1={P} x2={W - P} y1={P + (i * (H - 2 * P)) / 3} y2={P + (i * (H - 2 * P)) / 3} stroke="var(--brd)" strokeWidth="1" vectorEffect="non-scaling-stroke" />))}
          {zeroY !== null && (<line x1={P} x2={W - P} y1={zeroY} y2={zeroY} stroke="var(--muted-2)" strokeWidth="1" strokeDasharray="4 4" vectorEffect="non-scaling-stroke" opacity="0.55" />)}
          <path d={area} fill={'url(#' + gradId + ')'} />
          <path d={d} fill="none" stroke={lineColor} strokeWidth="2.5" vectorEffect="non-scaling-stroke" strokeLinejoin="round" strokeLinecap="round" />
          {points.map((p, i) => (<circle key={i} cx={x(i)} cy={y(p.value)} r="2.5" fill={lineColor} stroke="var(--bg)" strokeWidth="1.5" vectorEffect="non-scaling-stroke" />))}
        </svg>
      </div>
      <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: '11px', color: 'var(--muted)', marginTop: '8px' }}><span>{fmtDate(first.date)}</span><span>{fmtDate(last.date)}</span></div>
    </div>
  );
}

function LineChart({ points }) {
  if (!points || points.length === 0) {
    return <div className="empty"><div className="empty-icon">{Ico.demat}</div><div className="empty-title">No chart data yet</div><div className="empty-sub">Update your demat balance to start tracking progress over time.</div></div>;
  }
  const W = 800, H = 240, P = 26;
  const vals = points.map(p => p.value);
  let min = Math.min.apply(null, vals);
  let max = Math.max.apply(null, vals);
  if (min === max) { min = min - Math.max(1, min * 0.05); max = max + Math.max(1, max * 0.05); }
  const padY = (max - min) * 0.14;
  min -= padY; max += padY;
  const n = points.length;
  const x = (i) => P + (i * (W - 2 * P)) / Math.max(1, n - 1);
  const y = (v) => H - P - ((v - min) / (max - min)) * (H - 2 * P);
  let d = '';
  points.forEach((p, i) => { d += (i ? ' L' : 'M') + x(i).toFixed(1) + ',' + y(p.value).toFixed(1); });
  const area = d + ' L' + x(n - 1).toFixed(1) + ',' + (H - P) + ' L' + x(0).toFixed(1) + ',' + (H - P) + ' Z';
  const last = points[n - 1];
  const first = points[0];
  const change = r2(last.value - first.value);
  const changePct = first.value ? r2((change / first.value) * 100) : 0;
  return (
    <div>
      <div style={{ display: 'flex', gap: '12px', alignItems: 'baseline', flexWrap: 'wrap', marginBottom: '8px' }}>
        <div style={{ fontSize: '22px', fontWeight: 700, letterSpacing: '-0.7px' }} className="mono">{inr(last.value)}</div>
        <div className={'pill ' + (change >= 0 ? 'green' : 'red')}><span className="pdot"></span>{change >= 0 ? '+' : ''}{inr(Math.abs(change))} ({changePct}%)</div>
        <div className="pill blue">{fmtDate(last.date)}</div>
      </div>
      <div className="chart-wrap">
        <svg viewBox={'0 0 ' + W + ' ' + H} preserveAspectRatio="none">
          <defs><linearGradient id="gradchart" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="var(--accent)" stopOpacity="0.3" /><stop offset="100%" stopColor="var(--accent)" stopOpacity="0" /></linearGradient></defs>
          {[0, 1, 2, 3].map(i => (<line key={i} x1={P} x2={W - P} y1={P + (i * (H - 2 * P)) / 3} y2={P + (i * (H - 2 * P)) / 3} stroke="var(--brd)" strokeWidth="1" vectorEffect="non-scaling-stroke" />))}
          <path d={area} fill="url(#gradchart)" />
          <path d={d} fill="none" stroke="var(--accent)" strokeWidth="2" vectorEffect="non-scaling-stroke" strokeLinejoin="round" strokeLinecap="round" />
          {points.map((p, i) => (<circle key={i} cx={x(i)} cy={y(p.value)} r="3" fill="var(--accent)" stroke="var(--bg)" strokeWidth="2" vectorEffect="non-scaling-stroke" />))}
        </svg>
      </div>
      <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: '11px', color: 'var(--muted)', marginTop: '8px' }}><span>{fmtDate(points[0].date)}</span><span>{fmtDate(points[points.length - 1].date)}</span></div>
    </div>
  );
}

            <div className="cc-row"><div><div className="cc-lbl">CVV</div><div className="cc-val">{card.cvv || '•••'}</div></div><div><div className="cc-lbl">Expiry</div><div className="cc-val">{card.expiry || '--/--'}</div></div><div style={{ textAlign: 'right' }}><div className="cc-lbl">Due Day</div><div className="cc-val">{pad(card.dueDay || 10)}</div></div></div>

        <div className="item-actions" style={{ marginTop: '12px' }}>
