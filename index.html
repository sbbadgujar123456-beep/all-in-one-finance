<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>ShubhVault — Money Tracker</title>
<!-- ShubhVault v3: contextual AI, safe cloud persistence, verified net-worth calculations, backup/restore -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#05060a;--bg-2:#0a0c13;--txt:#eef1f8;--txt-2:#b8c0d4;
  --muted:#6e7689;--muted-2:#4a5163;
  --glass:rgba(255,255,255,.028);--glass-2:rgba(255,255,255,.05);--glass-3:rgba(255,255,255,.08);
  --brd:rgba(255,255,255,.06);--brd-2:rgba(255,255,255,.1);
  --accent:#7c92ff;--accent-2:#a78bfa;--accent-soft:rgba(124,146,255,.12);
  --green:#34d399;--green-soft:rgba(52,211,153,.12);
  --red:#f87171;--red-soft:rgba(248,113,113,.12);
  --amber:#fbbf24;--amber-soft:rgba(251,191,36,.12);
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow-md:0 12px 32px -12px rgba(0,0,0,.6);
  --shadow-lg:0 32px 80px -32px rgba(0,0,0,.8);
  --rays-opacity:.32;
}
html[data-theme="light"]{
  --bg:#f6f7fb;--bg-2:#ffffff;--txt:#0c1120;--txt-2:#3d4658;
  --muted:#697086;--muted-2:#99a0b3;
  --glass:rgba(255,255,255,.7);--glass-2:rgba(255,255,255,.9);--glass-3:rgba(255,255,255,1);
  --brd:rgba(15,23,42,.07);--brd-2:rgba(15,23,42,.11);
  --accent:#4f6dff;--accent-2:#8b5cf6;--accent-soft:rgba(79,109,255,.1);
  --green:#059669;--green-soft:rgba(5,150,105,.1);
  --red:#dc2626;--red-soft:rgba(220,38,38,.08);
  --amber:#d97706;--amber-soft:rgba(217,119,6,.1);
  --shadow-sm:0 1px 2px rgba(15,23,42,.06);
  --shadow-md:0 12px 32px -12px rgba(15,23,42,.12);
  --shadow-lg:0 32px 80px -32px rgba(15,23,42,.2);
  --rays-opacity:.18;
}
html,body{height:100%}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--txt);overflow-x:hidden;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;font-feature-settings:"cv11","ss01";transition:background .5s ease,color .5s ease;line-height:1.5}
button,input,select,textarea{font-family:inherit;color:inherit}
input,select{-webkit-appearance:none;appearance:none}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:rgba(140,155,200,.2);border-radius:20px}
::-webkit-scrollbar-thumb:hover{background:rgba(140,155,200,.35)}
::-webkit-scrollbar-track{background:transparent}
.bg-base{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse 1200px 800px at 50% -10%, rgba(124,146,255,.05), transparent 60%),radial-gradient(ellipse 900px 700px at 85% 110%, rgba(167,139,250,.035), transparent 60%),var(--bg);transition:background .5s ease}
html[data-theme="light"] .bg-base{background:radial-gradient(ellipse 1200px 800px at 50% -10%, rgba(79,109,255,.06), transparent 60%),radial-gradient(ellipse 900px 700px at 85% 110%, rgba(139,92,246,.04), transparent 60%),var(--bg)}
.bg-base::after{content:'';position:absolute;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");opacity:.02;mix-blend-mode:overlay;pointer-events:none}
html[data-theme="light"] .bg-base::after{opacity:.03;mix-blend-mode:multiply}
.rays-bg{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:var(--rays-opacity);transition:opacity .6s ease;-webkit-mask-image:linear-gradient(180deg, #000 0%, #000 45%, rgba(0,0,0,.55) 75%, transparent 100%);mask-image:linear-gradient(180deg, #000 0%, #000 45%, rgba(0,0,0,.55) 75%, transparent 100%)}
.rays-container{width:100%;height:100%;position:relative;overflow:hidden}
.rays-container canvas{display:block;width:100%!important;height:100%!important}
.glass{background:var(--glass);border:1px solid var(--brd);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border-radius:16px;box-shadow:var(--shadow-md);position:relative}
.glass::before{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.04),transparent 40%);mask:linear-gradient(#000,#000) content-box,linear-gradient(#000,#000);-webkit-mask:linear-gradient(#000,#000) content-box,linear-gradient(#000,#000);-webkit-mask-composite:xor;mask-composite:exclude;padding:1px}
html[data-theme="light"] .glass::before{background:linear-gradient(180deg,rgba(255,255,255,.9),transparent 40%)}
.glass-soft{background:var(--glass-2);border:1px solid var(--brd);border-radius:12px}
.app{position:relative;z-index:2;display:flex;min-height:100vh}
.sidebar{width:232px;flex-shrink:0;padding:20px 14px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;border-right:1px solid var(--brd);background:rgba(10,12,19,.55);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
html[data-theme="light"] .sidebar{background:rgba(255,255,255,.6)}
.brand{display:flex;align-items:center;gap:11px;padding:4px 10px 22px}
.brand-logo{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:14px;letter-spacing:-.5px;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;box-shadow:0 8px 20px -6px var(--accent-soft),inset 0 1px 0 rgba(255,255,255,.2)}
.brand-name{font-weight:700;font-size:15px;letter-spacing:-.3px;line-height:1}
.brand-sub{font-size:9.5px;color:var(--muted);letter-spacing:1.4px;margin-top:3px;font-weight:600}
.nav-item{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:10px;cursor:pointer;font-size:13.5px;font-weight:500;color:var(--muted);border:1px solid transparent;transition:all .18s ease;background:transparent;width:100%;text-align:left}
.nav-item:hover{background:var(--glass-2);color:var(--txt-2)}
.nav-item.active{background:var(--accent-soft);color:var(--txt);border-color:rgba(124,146,255,.18);font-weight:600}
.nav-item.active .nav-ico{color:var(--accent)}
.nav-ico{width:18px;height:18px;flex-shrink:0;display:grid;place-items:center;color:var(--muted);transition:color .18s ease}
.nav-ico svg{width:100%;height:100%;display:block}
.nav-item:hover .nav-ico{color:var(--txt-2)}
.side-foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--brd);display:flex;flex-direction:column;gap:2px}
.main{flex:1;min-width:0;padding:26px 30px 120px;max-width:1240px;margin:0 auto;width:100%}
.topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:26px;flex-wrap:wrap}
.page-title{font-size:24px;font-weight:700;letter-spacing:-.7px;line-height:1.1}
.page-sub{font-size:13px;color:var(--muted);margin-top:5px}
.top-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--brd-2);background:var(--glass-2);border-radius:9px;padding:9px 14px;font-size:13px;font-weight:600;cursor:pointer;transition:all .18s cubic-bezier(.4,.2,.2,1);white-space:nowrap;display:inline-flex;align-items:center;gap:6px;color:var(--txt);letter-spacing:-.1px}
.btn:hover{background:var(--glass-3);border-color:rgba(255,255,255,.18);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn-primary{background:linear-gradient(180deg,var(--accent),#6880ff);border-color:rgba(255,255,255,.1);color:#fff;box-shadow:0 6px 16px -6px rgba(124,146,255,.6),inset 0 1px 0 rgba(255,255,255,.18)}
.btn-primary:hover{box-shadow:0 8px 22px -6px rgba(124,146,255,.75),inset 0 1px 0 rgba(255,255,255,.22);border-color:rgba(255,255,255,.15)}
.btn-sm{padding:6px 11px;font-size:12px;border-radius:8px}
.btn-ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn-ghost:hover{background:var(--glass-2);color:var(--txt)}
.btn-danger{color:var(--red);border-color:rgba(248,113,113,.22)}
.btn-danger:hover{background:var(--red-soft);border-color:rgba(248,113,113,.35)}
.btn-warn{color:var(--amber);border-color:rgba(251,191,36,.25)}
.btn-warn:hover{background:var(--amber-soft);border-color:rgba(251,191,36,.4)}
.icon-btn{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;cursor:pointer;background:var(--glass-2);border:1px solid var(--brd);transition:all .18s ease;font-size:13px;color:var(--muted)}
.icon-btn:hover{background:var(--glass-3);color:var(--txt);border-color:var(--brd-2)}
.icon-btn svg{width:14px;height:14px}
.seg{display:inline-flex;background:var(--glass-2);border:1px solid var(--brd);border-radius:10px;padding:3px;gap:3px}
.seg .seg-btn{padding:6px 12px;border-radius:7px;font-size:12px;font-weight:600;color:var(--muted);background:transparent;border:none;cursor:pointer;transition:all .18s ease;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.seg .seg-btn:hover{color:var(--txt-2)}
.seg .seg-btn.active{background:linear-gradient(180deg,var(--accent),#6880ff);color:#fff;box-shadow:0 4px 12px -4px rgba(124,146,255,.5)}
.seg-full{display:grid;grid-template-columns:1fr 1fr;width:100%}
.seg-full .seg-btn{padding:9px 12px;text-align:center;justify-content:center}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:1080px){.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:900px){.g3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){.g2,.g3,.g4{grid-template-columns:1fr}}
.kpi{padding:16px 18px;border-radius:14px;position:relative;overflow:hidden}
.kpi-head{display:flex;align-items:center;gap:8px;margin-bottom:2px}
.kpi-dot{width:6px;height:6px;border-radius:50%;background:var(--muted-2)}
.kpi-dot.accent{background:var(--accent);box-shadow:0 0 8px var(--accent-soft)}
.kpi-dot.green{background:var(--green);box-shadow:0 0 8px var(--green-soft)}
.kpi-dot.red{background:var(--red);box-shadow:0 0 8px var(--red-soft)}
.kpi-dot.amber{background:var(--amber);box-shadow:0 0 8px var(--amber-soft)}
.kpi-label{font-size:10.5px;color:var(--muted);font-weight:600;letter-spacing:.7px;text-transform:uppercase}
.kpi-val{font-size:22px;font-weight:700;letter-spacing:-.7px;margin-top:8px;font-variant-numeric:tabular-nums;font-feature-settings:"tnum";word-break:break-word}
.kpi-note{font-size:11.5px;color:var(--muted);margin-top:6px}
.section-head{display:flex;align-items:center;justify-content:space-between;margin:28px 0 12px;gap:12px;flex-wrap:wrap}
.section-head:first-child{margin-top:0}
.section-title{font-size:14px;font-weight:600;letter-spacing:-.2px;display:flex;align-items:center;gap:9px;color:var(--txt-2)}
.section-title .dot{width:5px;height:5px;border-radius:50%;background:var(--accent)}
.section-title b{color:var(--txt);font-weight:700;font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:12px;background:var(--glass);border:1px solid var(--brd);transition:all .2s cubic-bezier(.4,.2,.2,1);position:relative}
.item:hover{border-color:var(--brd-2);background:var(--glass-2)}
.item-ico{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:16px;flex-shrink:0;background:var(--glass-2);border:1px solid var(--brd);color:var(--txt-2)}
.item-ico svg{width:18px;height:18px}
.item-body{flex:1;min-width:0}
.item-name{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--txt);letter-spacing:-.1px}
.item-meta{font-size:11.5px;color:var(--muted);margin-top:5px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.item-amt{font-size:14px;font-weight:700;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;font-feature-settings:"tnum";letter-spacing:-.2px}
.item-actions{display:flex;gap:6px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;padding:3px 9px;border-radius:20px;background:var(--glass-2);border:1px solid var(--brd);color:var(--muted);letter-spacing:.1px;white-space:nowrap}
.pill.red{color:var(--red);border-color:rgba(248,113,113,.22);background:var(--red-soft)}
.pill.amber{color:var(--amber);border-color:rgba(251,191,36,.22);background:var(--amber-soft)}
.pill.green{color:var(--green);border-color:rgba(52,211,153,.22);background:var(--green-soft)}
.pill.blue{color:var(--accent);border-color:rgba(124,146,255,.22);background:var(--accent-soft)}
.pill .pdot{width:5px;height:5px;border-radius:50%;background:currentColor}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.label{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.5px;text-transform:uppercase}
.input,.select{width:100%;padding:10px 12px;border-radius:10px;background:var(--glass-2);border:1px solid var(--brd-2);font-size:13.5px;outline:none;transition:all .18s ease;font-variant-numeric:tabular-nums;color:var(--txt)}
.input::placeholder{color:var(--muted-2)}
.input:focus,.select:focus{border-color:var(--accent);background:var(--glass-3);box-shadow:0 0 0 3px var(--accent-soft)}
.select{cursor:pointer;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:34px}
.select option{background:#0d1018;color:#eef1f8}
html[data-theme="light"] .select option{background:#fff;color:#0c1120}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){.row2{grid-template-columns:1fr}}
.switch{display:flex;align-items:center;gap:11px;cursor:pointer;user-select:none;padding:8px 0}
.switch-track{width:40px;height:23px;border-radius:20px;background:var(--glass-2);border:1px solid var(--brd-2);position:relative;transition:all .22s;flex-shrink:0}
.switch-track.on{background:var(--accent);border-color:transparent}
.switch-knob{position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;background:#fff;transition:all .22s cubic-bezier(.4,.2,.2,1);box-shadow:0 2px 4px rgba(0,0,0,.3)}
.switch-track.on .switch-knob{left:20px}
.switch-lbl{font-size:12.5px;font-weight:500;color:var(--txt-2);line-height:1.35}
.modal-bg{position:fixed;inset:0;background:rgba(2,4,10,.7);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{width:100%;max-width:460px;max-height:88vh;overflow-y:auto;padding:22px;animation:pop .28s cubic-bezier(.34,1.2,.5,1);box-shadow:var(--shadow-lg)}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(8px)}to{opacity:1;transform:scale(1) translateY(0)}}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.modal-head h3{font-size:16px;font-weight:700;letter-spacing:-.3px}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);z-index:200;padding:11px 16px 11px 18px;border-radius:11px;font-size:13px;font-weight:600;background:rgba(13,16,24,.94);border:1px solid var(--brd-2);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:var(--shadow-lg);animation:toastIn .28s cubic-bezier(.34,1.2,.5,1);color:#eef1f8;display:flex;align-items:center;gap:9px;max-width:min(92vw,520px)}
html[data-theme="light"] .toast{background:rgba(255,255,255,.98);color:#0c1120}
.toast::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);flex-shrink:0}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,14px)}to{opacity:1;transform:translate(-50%,0)}}
.toast-msg{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast-action{margin-left:6px;padding:5px 12px;border-radius:8px;background:rgba(124,146,255,.22);border:1px solid rgba(124,146,255,.4);color:var(--accent);font-size:12px;font-weight:700;cursor:pointer;transition:all .15s ease;flex-shrink:0}
.toast-action:hover{background:rgba(124,146,255,.35);transform:translateY(-1px)}
html[data-theme="light"] .toast-action{color:#4f6dff}
.login-wrap{position:relative;z-index:2;min-height:100vh;display:grid;place-items:center;padding:22px}
.login-card{width:100%;max-width:380px;padding:34px 30px;border-radius:20px;animation:pop .5s cubic-bezier(.34,1.2,.5,1);box-shadow:var(--shadow-lg)}
.login-logo{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-size:18px;font-weight:800;letter-spacing:-.5px;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;margin:0 auto 18px;box-shadow:0 14px 34px -10px var(--accent-soft),inset 0 1px 0 rgba(255,255,255,.2)}
.login-title{font-size:21px;font-weight:700;text-align:center;letter-spacing:-.5px}
.login-sub{font-size:12.5px;color:var(--muted);text-align:center;margin-top:6px;margin-bottom:26px}
.err{color:var(--red);font-size:12px;text-align:center;margin-top:12px;font-weight:600}
.shake{animation:shake .42s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.boot{position:fixed;inset:0;z-index:500;display:grid;place-items:center;background:#05060a;color:#6e7689;font-size:13px;font-weight:500;letter-spacing:.3px}
.boot-inner{display:flex;flex-direction:column;align-items:center;gap:16px}
.boot-logo{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-weight:800;font-size:16px;background:linear-gradient(135deg,#7c92ff,#a78bfa);color:#fff;animation:bootPulse 1.6s ease-in-out infinite}
@keyframes bootPulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.94);opacity:.7}}
.log-year{margin-bottom:36px}
.log-year-head{font-size:11px;font-weight:700;color:var(--accent);letter-spacing:1.6px;text-transform:uppercase;margin-bottom:16px;display:flex;align-items:center;gap:12px}
.log-year-head::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--brd) 0%,transparent 100%)}
.log-year-num{font-size:22px;font-weight:800;color:var(--txt);letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.log-month{margin-bottom:22px;padding-left:4px}
.log-month-head{font-size:13px;font-weight:700;color:var(--txt-2);letter-spacing:-.2px;margin-bottom:10px;display:flex;align-items:center;gap:10px}
.log-month-head::after{content:'';flex:1;height:1px;background:var(--brd)}
.log-month-count{font-size:10.5px;color:var(--muted);font-weight:600;letter-spacing:.5px}
.log-day{margin-bottom:12px;padding-left:10px;border-left:2px solid var(--brd)}
.log-day-head{font-size:11.5px;font-weight:600;color:var(--accent);margin-bottom:7px;padding-left:2px;display:flex;align-items:center;gap:10px}
.tx{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:11px;background:var(--glass);border:1px solid var(--brd);margin-bottom:6px;transition:all .18s ease}
.tx:hover{border-color:var(--brd-2);background:var(--glass-2)}
.tx .item-ico{width:32px;height:32px;font-size:13px;border-radius:9px}
.tx .item-ico svg{width:14px;height:14px}
.search-wrap{position:relative;flex:1;max-width:340px;min-width:180px}
.search-wrap .input{padding-left:36px}
.search-ico{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--muted);pointer-events:none}
.search-clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:22px;height:22px;border-radius:50%;background:var(--glass-2);border:1px solid var(--brd);display:grid;place-items:center;cursor:pointer;color:var(--muted);font-size:11px;line-height:1}
.search-clear:hover{color:var(--txt);background:var(--glass-3)}

   SHUBHVAULT FINAL SHIP UI PATCH
   Responsive layout, light-mode refinement, touch targets and
   component-safe hover states.  No data/logic changes.
   ================================================================ */

/* Buttons: never allow generic hover to erase primary actions. */
.btn-primary,
.btn-primary:hover,
.btn-primary:focus-visible,
.btn-primary:active{
  color:#fff;
  background:linear-gradient(180deg,#8ea4ff 0%,#647dff 100%);
  border-color:rgba(255,255,255,.16);
}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 14px 30px -14px rgba(88,111,255,.62),inset 0 1px 0 rgba(255,255,255,.22)}
.btn-primary:active{transform:translateY(0);box-shadow:0 7px 16px -12px rgba(88,111,255,.55),inset 0 1px 0 rgba(255,255,255,.16)}
.btn:disabled{opacity:.55;cursor:not-allowed;transform:none!important}
.btn:focus-visible,.icon-btn:focus-visible,.nav-item:focus-visible,.mnav:focus-visible,.input:focus-visible,.select:focus-visible{outline:3px solid var(--accent-soft);outline-offset:2px}

/* Light mode: clean Apple-like surfaces instead of translucent grey-on-grey. */
html[data-theme="light"] body{background:#f5f5f7;color:#111114}
html[data-theme="light"] .bg-base{background:
  radial-gradient(900px 500px at 50% -8%,rgba(88,111,255,.075),transparent 64%),
  radial-gradient(700px 500px at 95% 100%,rgba(141,109,244,.045),transparent 62%),#f5f5f7}
html[data-theme="light"] .glass{background:rgba(255,255,255,.92);border-color:rgba(17,17,20,.075);box-shadow:0 14px 40px -28px rgba(20,25,45,.24)}
html[data-theme="light"] .glass::before{background:linear-gradient(180deg,rgba(255,255,255,.95),transparent 45%)}
html[data-theme="light"] .glass-soft{background:#fff;border-color:rgba(17,17,20,.075)}
html[data-theme="light"] .sidebar{background:rgba(255,255,255,.82);border-right-color:rgba(17,17,20,.07)}
html[data-theme="light"] .nav-item:hover{background:#f3f4f8;color:#20222a}
html[data-theme="light"] .nav-item.active{background:rgba(88,111,255,.09);border-color:rgba(88,111,255,.15)}
html[data-theme="light"] .btn{background:#fff;border-color:rgba(17,17,20,.11);box-shadow:0 1px 2px rgba(17,17,20,.03)}
html[data-theme="light"] .btn:hover:not(.btn-primary){background:#f7f7f9;border-color:rgba(17,17,20,.15)}
html[data-theme="light"] .btn-ghost{background:transparent;box-shadow:none}
html[data-theme="light"] .input,html[data-theme="light"] .select{background:#fff;border-color:rgba(17,17,20,.12);box-shadow:0 1px 2px rgba(17,17,20,.02)}
html[data-theme="light"] .input:focus,html[data-theme="light"] .select:focus{background:#fff}
html[data-theme="light"] .item,html[data-theme="light"] .tx{background:rgba(255,255,255,.78);border-color:rgba(17,17,20,.075);box-shadow:0 8px 24px -24px rgba(20,25,45,.3)}
html[data-theme="light"] .item:hover,html[data-theme="light"] .tx:hover{background:#fff;border-color:rgba(17,17,20,.12)}
html[data-theme="light"] .item-ico{background:#f6f7fa;border-color:rgba(17,17,20,.065)}
html[data-theme="light"] .seg{background:#eceef3;border-color:rgba(17,17,20,.06)}
html[data-theme="light"] .seg .seg-btn.active{background:#586fff}
html[data-theme="light"] .pill{background:#f7f7f9;border-color:rgba(17,17,20,.07);color:#6d7280}
html[data-theme="light"] .payment-mode{background:#fff;border-color:rgba(17,17,20,.1)}
html[data-theme="light"] .payment-mode.active{background:rgba(88,111,255,.08);border-color:rgba(88,111,255,.28)}
html[data-theme="light"] .mobile-nav{background:rgba(255,255,255,.94);border-top-color:rgba(17,17,20,.08);box-shadow:0 -10px 30px -25px rgba(20,25,45,.35)}
html[data-theme="light"] .mnav.active{background:rgba(88,111,255,.09)}
html[data-theme="light"] .cal-cell{background:#fff;border-color:rgba(17,17,20,.075)}
html[data-theme="light"] .cal-cell.has-value{background:rgba(88,111,255,.07);border-color:rgba(88,111,255,.2)}
html[data-theme="light"] .cal-cell:hover{background:#fff}
html[data-theme="light"] .strategy-primary-grid>div{background:rgba(255,255,255,.58)}
html[data-theme="light"] .strategy-hero{background:radial-gradient(circle at 100% 0,rgba(88,111,255,.09),transparent 40%),#fff}
html[data-theme="light"] .decision-summary{background:linear-gradient(100deg,rgba(88,111,255,.07),rgba(255,255,255,.95))}

/* Page header */
.topbar{align-items:center;min-width:0}
.topbar>div:first-child{min-width:0}
.page-title,.page-sub{overflow-wrap:anywhere}
.top-actions{min-width:0}

/* Transaction rows: use a real grid on narrow screens so amount never overlaps text. */
.tx{min-width:0}
.tx .item-body{min-width:0}
.tx .item-name,.tx .item-meta{min-width:0}
.tx .item-meta{line-height:1.35}
.tx .item-meta>span{max-width:100%;overflow-wrap:anywhere}
.tx .item-amt{flex-shrink:0}

/* Credit-card history rows get the same protection. */
.card-history-row{min-width:0}
.card-history-row .item-body{min-width:0}
.card-history-row .item-name{overflow-wrap:anywhere;white-space:normal}

/* Calendar values should wrap instead of colliding with the neighbouring day. */
.cal-cell{min-width:0}
.cal-val{white-space:normal;overflow:hidden;text-overflow:clip;line-height:1.15;overflow-wrap:anywhere}
.cal-pnl{line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Modal and forms */
.modal-bg{padding:max(14px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}
.modal{border-radius:24px}

/* Touch-first defaults */
@media (hover:none){
  .btn:hover,.item:hover,.tx:hover,.quick-link:hover,.theme-option:hover,.cal-cell:hover{transform:none}
}

@media (max-width:900px){
  .main{max-width:none;width:100%;padding:22px 18px calc(112px + env(safe-area-inset-bottom))}
  .topbar{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;margin-bottom:24px;align-items:start}
  .top-actions{width:100%;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .top-actions .sync-badge{order:0}
  .top-actions .btn-primary{order:1;margin-left:auto}
  .top-actions>.btn:not(.btn-primary){order:2}
  .top-actions>.btn{max-width:100%}
  .section-head{margin-top:28px}
  .grid{gap:12px}
  .item{gap:11px}
  .item-actions{gap:7px}
  .item-actions .btn{min-height:38px}
  .strategy-hero h2{max-width:100%}
  .priority-item{align-items:flex-start}
  .theme-option{min-height:76px}
}

  /* Mobile nav: exactly five full-width slots, remaining items scroll cleanly. */

/* Financial calculation helpers. Loan debt uses total remaining scheduled payments. */
function loanScheduledPayments(l) {
  return r2((Number(l && l.emi) || 0) * (Number(l && l.monthsLeft) || 0));

function loanRemainingTotal(l) {

function loanOutstandingPrincipal(l) {
  const emi = Number(l && l.emi) || 0;

  demats: [{ id: 'd1', name: 'My Demat', balance: 0, history: [], withdrawals: [] }],
  cards: [], loans: [], bills: [], inflows: [],
  netWorthHistory: [],
  netWorthHistoryVersion: 2,
  meta: { version: 2 }
};

function normalize(d) {
  const out = Object.assign({}, DEFAULT_DATA, d || {});
  ['banks','transactions','demats','cards','loans','bills','inflows','netWorthHistory'].forEach(k => { if (!Array.isArray(out[k])) out[k] = []; });
  // Older versions stored loan future payments as debt and produced misleading
  // net-worth history. Do not display or propagate those legacy snapshots.
  if (Number(out.netWorthHistoryVersion) < 2) { out.netWorthHistory = []; out.netWorthHistoryVersion = 2; }
  if (!Number(out.netWorthHistoryVersion)) out.netWorthHistoryVersion = 2;
  out.demats = out.demats.map(x => Object.assign({ history: [], withdrawals: [] }, x, { history: Array.isArray(x.history) ? x.history : [], withdrawals: Array.isArray(x.withdrawals) ? x.withdrawals : [] }));
  out.cards = out.cards.map(x => Object.assign({ paidCycles: [] }, x));
  out.loans = out.loans.map(x => Object.assign({ paidCycles: [], startDate: toISO(new Date()), originalMonths: x.monthsLeft || 0, closed: false, closedDate: null }, x));
  out.bills = out.bills.map(x => Object.assign({ paidCycles: [] }, x));
  out.inflows = out.inflows.map(x => Object.assign({ receivedCycles: [], recurring: x.recurring !== false }, x));
  if (!out.banks.length) out.banks = [{ id: 'b1', name: 'Main Bank', balance: 0 }];
  if (!out.demats.length) out.demats = [{ id: 'd1', name: 'My Demat', balance: 0, history: [], withdrawals: [] }];
  return out;
}

function useStore() {
  const [data, setData] = useState(null);
  const [sync, setSync] = useState({ state: db ? 'connecting' : 'local', lastSync: null, fromCache: false, error: null });
  const lastRef = useRef('');
  const timerRef = useRef(null);
  const cloudWriteEnabledRef = useRef(!db);

  // Public setter marks the state as intentionally changed by the user. This is
  // important: a missing Firestore document or a temporary read error must never
  // turn an empty DEFAULT_DATA object into an accidental cloud overwrite.
  const safeSetData = useCallback((updater) => {
    cloudWriteEnabledRef.current = true;
    setData(updater);
  }, []);

  useEffect(() => {
    if (!db) {
      let d = DEFAULT_DATA;
      try { const raw = localStorage.getItem('finvault_data'); if (raw) d = JSON.parse(raw); } catch (e) {}
      const n = normalize(d);
      lastRef.current = JSON.stringify(n);
      setData(n);
      cloudWriteEnabledRef.current = true;
      setSync({ state: 'local', lastSync: Date.now(), fromCache: false, error: null });
      return;
    }

    let mounted = true;
    const ref = db.collection('finvault').doc('main');
    const unsub = ref.onSnapshot({ includeMetadataChanges: true }, (snap) => {
      if (!mounted) return;
      const meta = snap.metadata || {};

      if (snap.exists) {
        const n = normalize(snap.data());
        cloudWriteEnabledRef.current = true;
        try { localStorage.setItem('finvault_data', JSON.stringify(n)); } catch (e) {}
        if (meta.hasPendingWrites) setSync(s => ({ ...s, state: 'syncing', fromCache: !!meta.fromCache }));
        else if (meta.fromCache) setSync(s => ({ ...s, state: navigator.onLine ? 'syncing' : 'offline', fromCache: true }));
        else setSync({ state: 'synced', lastSync: Date.now(), fromCache: false, error: null });
        if (!meta.hasPendingWrites || !lastRef.current) {
          const str = JSON.stringify(n);
          if (str !== lastRef.current) { lastRef.current = str; setData(n); }
        }
        return;
      }

      // Missing document is a safe state, not permission to create/overwrite it.
      // Use the browser recovery copy for display, but keep cloud writes disabled
      // until the user explicitly changes data through safeSetData.
      cloudWriteEnabledRef.current = false;
      let fallback = null;
      try {
        const raw = localStorage.getItem('finvault_data');
        if (raw) fallback = normalize(JSON.parse(raw));
      } catch (e) {}
      const n = fallback || normalize(DEFAULT_DATA);
      lastRef.current = JSON.stringify(n);
      setData(n);
      setSync(s => ({ ...s, state: fallback ? 'local' : (navigator.onLine ? 'error' : 'offline'), lastSync: fallback ? Date.now() : s.lastSync, fromCache: !!fallback, error: fallback ? null : 'Cloud vault was not found. No cloud data was changed.' }));
    }, (err) => {
      if (!mounted) return;
      cloudWriteEnabledRef.current = false;
      setSync(s => ({ ...s, state: 'error', error: err && err.message ? err.message : 'Sync error' }));
      // Never inject DEFAULT_DATA into state on a cloud read error. Keep any
      // existing in-memory data, or use the browser recovery copy if available.
      if (!lastRef.current) {
        let fallback = null;
        try { const raw = localStorage.getItem('finvault_data'); if (raw) fallback = normalize(JSON.parse(raw)); } catch (e) {}
        if (fallback) { lastRef.current = JSON.stringify(fallback); setData(fallback); }
      }
    });
    return () => { mounted = false; unsub(); if (timerRef.current) clearTimeout(timerRef.current); };
  }, []);

  useEffect(() => {
    if (!data) return;
    const str = JSON.stringify(data);
    if (str === lastRef.current) return;
    lastRef.current = str;
    try { localStorage.setItem('finvault_data', str); } catch (e) {}

    if (!cloudWriteEnabledRef.current) {
      setSync(prev => ({ ...prev, state: 'error', error: 'Cloud save is paused until you make an explicit data change or restore a backup.' }));
      return;
    }

    if (timerRef.current) clearTimeout(timerRef.current);
    setSync(prev => prev.state === 'local' ? prev : ({ ...prev, state: 'syncing' }));
    timerRef.current = setTimeout(() => {
      if (db) {
        db.collection('finvault').doc('main').set(data)
          .then(() => setSync(s => ({ ...s, state: 'synced', lastSync: Date.now(), error: null })))
          .catch(err => setSync(s => ({ ...s, state: 'error', error: err && err.message ? err.message : 'Write failed' })));
      } else {
        try { localStorage.setItem('finvault_data', str); setSync(s2 => ({ ...s2, state: 'local', lastSync: Date.now() })); } catch (e) {}
      }
    }, 400);
  }, [data]);

  useEffect(() => {
    if (!db) return;
    const goOnline = () => setSync(s => s.state === 'error' ? { ...s, state: 'syncing' } : (s.state === 'offline' ? { ...s, state: 'syncing' } : s));
    const goOffline = () => setSync(s => ({ ...s, state: 'offline' }));
    window.addEventListener('online', goOnline);
    window.addEventListener('offline', goOffline);
    if (!navigator.onLine) setSync(s => ({ ...s, state: 'offline' }));
    return () => { window.removeEventListener('online', goOnline); window.removeEventListener('offline', goOffline); };
  }, []);

  return [data, safeSetData, sync];
}

function reverseTxLink(d, tx) {
  if (!tx || !tx.link) return;
  const { type, id } = tx.link;
  const amt = Number(tx.amount) || 0;
  if (type === 'demat') {
    const a = d.demats.find(x => x.id === id);
    if (!a) return;
    a.balance = r2(a.balance + amt);
    a.withdrawals = (a.withdrawals || []).filter(w => w.txId !== tx.id);
  } else if (type === 'card') {
    const c = d.cards.find(x => x.id === id);
    if (!c) return;
    c.outstanding = r2(c.outstanding + amt);
    if (tx.link.cycle && c.paidCycles) c.paidCycles = c.paidCycles.filter(cy => cy !== tx.link.cycle);
  } else if (type === 'cardPurchase') {
    const c = d.cards.find(x => x.id === id);
    if (!c) return;
    c.outstanding = r2(Math.max(0, Number(c.outstanding) - amt));
  } else if (type === 'loan') {
    const l = d.loans.find(x => x.id === id);
    if (!l) return;
    const months = Number(tx.link.monthsAdvanced || 1);
    l.monthsLeft = (Number(l.monthsLeft) || 0) + months;
    l.remaining = r2((Number(l.emi) || 0) * l.monthsLeft);
    if (tx.link.cycle && l.paidCycles) l.paidCycles = l.paidCycles.filter(cy => cy !== tx.link.cycle);
    if (l.closed) { l.closed = false; l.closedDate = null; }
  } else if (type === 'bill') {
    const b = d.bills.find(x => x.id === id);
    if (!b) return;
    if (tx.link.cycle && b.paidCycles) b.paidCycles = b.paidCycles.filter(cy => cy !== tx.link.cycle);
  }
}

function applyTxLink(d, tx) {
  if (!tx || !tx.link) return;
  const { type, id } = tx.link;
  const amt = Number(tx.amount) || 0;
  if (type === 'demat') {
    const a = d.demats.find(x => x.id === id);
    if (!a) return;
    a.balance = r2(a.balance - amt);
    a.withdrawals = (a.withdrawals || []).concat([{ txId: tx.id, date: tx.date, amount: amt }]);
  } else if (type === 'card') {
    const c = d.cards.find(x => x.id === id);
    if (!c) return;
    c.outstanding = r2(Math.max(0, c.outstanding - amt));
    if (tx.link.cycle) c.paidCycles = (c.paidCycles || []).concat([tx.link.cycle]);
  } else if (type === 'cardPurchase') {
    const c = d.cards.find(x => x.id === id);
    if (!c) return;
    c.outstanding = r2((Number(c.outstanding) || 0) + amt);
  } else if (type === 'loan') {
    const l = d.loans.find(x => x.id === id);
    if (!l) return;
    const months = Number(tx.link.monthsAdvanced || 1);
    l.monthsLeft = Math.max(0, (Number(l.monthsLeft) || 0) - months);
    l.remaining = r2((Number(l.emi) || 0) * l.monthsLeft);
    if (tx.link.cycle) l.paidCycles = (l.paidCycles || []).concat([tx.link.cycle]);
    if (l.monthsLeft <= 0) { l.closed = true; l.closedDate = tx.date || toISO(new Date()); }
  } else if (type === 'bill') {
    const b = d.bills.find(x => x.id === id);
    if (!b) return;
    if (tx.link.cycle) b.paidCycles = (b.paidCycles || []).concat([tx.link.cycle]);
  }
}

const PIE_COLORS = ['#7c92ff', '#34d399', '#fbbf24', '#f87171', '#a78bfa', '#22d3ee', '#fb923c', '#ec4899', '#10b981', '#f472b6', '#64748b', '#94a3b8', '#facc15', '#60a5fa', '#84cc16'];

/* ========================================================================
   AI CHAT ENGINE v2 — context-aware, constraint-parsing, calculation-driven
   ======================================================================== */

function parseAmountToken(numStr, unitStr) {
  let v = Number(String(numStr).replace(/,/g, ''));
  if (!isFinite(v)) return null;
  const unit = String(unitStr || '').toLowerCase();
  if (unit === 'k') v *= 1000;
  else if (['lakh','lakhs','lac','lacs','l'].includes(unit)) v *= 100000;
  else if (['cr','crore','crores'].includes(unit)) v *= 10000000;
  return Math.round(v);
}

// Extract ALL amounts from a string, return the last (most likely the subject) plus a list
function extractAllAmounts(q) {
  const s = String(q || '');
  const re = /(?:₹|rs\.?|inr)?\s*(\d{1,3}(?:,\d{2,3})+|\d+(?:\.\d+)?)\s*(k|lakh|lakhs|lac|lacs|l|cr|crore|crores)?\b/gi;
  const results = [];
  let m;
  while ((m = re.exec(s)) !== null) {
    const amt = parseAmountToken(m[1], m[2]);
    if (amt && amt > 0) results.push(amt);
  }
  return results;
}

function extractAmount(q) {
  const all = extractAllAmounts(q);
  return all.length ? all[all.length - 1] : null;
}

function dataSummary(data) {
  const f = financialSnapshot(data);
  const mk = monthKey(new Date());
  const monthTx = data.transactions.filter(t => String(t.date).startsWith(mk));
  const mIn = r2(monthTx.filter(t => t.dir === 'in').reduce((s, t) => s + (Number(t.amount) || 0), 0));
  const mOut = r2(monthTx.filter(t => t.dir === 'out').reduce((s, t) => s + (Number(t.amount) || 0), 0));
  return { ...f, mIn, mOut };
}

function simulateLoans(loans, extra) {
  const ls = loans.map(l => ({
    name: l.name,
    rem: loanRemainingTotal(l),
    rate: Math.max(0, Number(l.rate) || 0),
    emi: Math.max(0, Number(l.emi) || 0)
  })).filter(l => l.rem > 0.5);
  let months = 0;
  let totalInterest = 0;
  const extraMonthly = Math.max(0, Number(extra) || 0);

  while (ls.some(l => l.rem > 0.5) && months < 720) {
    months++;
    // Highest-rate-first avalanche for any extra payment.
    ls.sort((a, b) => b.rate - a.rate);
    let pool = extraMonthly;

    for (let i = 0; i < ls.length; i++) {
      const l = ls[i];
      if (l.rem <= 0) continue;
      const monthlyRate = l.rate / 100 / 12;
      const interest = monthlyRate > 0 ? l.rem * monthlyRate : 0;
      let pay = Math.min(l.emi, l.rem + interest);
      if (pool > 0) {
        const room = Math.max(0, l.rem + interest - pay);
        const add = Math.min(pool, room);
        pay += add;
        pool -= add;
      }
      totalInterest += interest;
      l.rem = r2(Math.max(0, l.rem + interest - pay));
    }
  }
  return { months, totalInterest: r2(totalInterest) };
}

// Parse "keep X in bank" from natural language
function parseKeepInBank(q) {
  const s = String(q || '');
  // "keep 2k in bank" / "keep around 5000 in my bank" / "leave 1L as buffer"
  const m = s.match(/\b(?:keep|leave|reserve|retain|hold)\b[^0-9]{0,20}(?:₹|rs\.?|inr)?\s*(\d{1,3}(?:,\d{2,3})+|\d+(?:\.\d+)?)\s*(k|lakh|lakhs|lac|lacs|l|cr|crore|crores)?/i);
  if (m) {
    const amt = parseAmountToken(m[1], m[2]);
    if (amt && amt > 0 && amt < 1e8) return amt;
  }
  return null;
}

// Parse all "must-pay" numbers explicitly stated by user (e.g., "minimum 5k on card")
// Returns list of { target, amount }
function parseMustPay(q) {
  const s = String(q || '');
  const out = [];
  // "minimum pay" / "min pay" on cards
  const re = /\b(?:minimum|min|card bill|cc bill|emi|regular)\b[^0-9]{0,25}(?:₹|rs\.?|inr)?\s*(\d{1,3}(?:,\d{2,3})+|\d+(?:\.\d+)?)\s*(k|lakh|lakhs|lac|lacs|l|cr|crore|crores)?/gi;
  let m;
  while ((m = re.exec(s)) !== null) {
    const amt = parseAmountToken(m[1], m[2]);
    if (amt && amt > 0) out.push(amt);
  }
  return out;
}

// Compute upcoming dues in next N days from real data
function upcomingDues(data, daysAhead) {
  const today = startOfToday();
  const cutoff = new Date(today); cutoff.setDate(cutoff.getDate() + daysAhead);
  const out = { cards: [], loans: [], bills: [] };
  data.cards.forEach(c => {
    const due = nextDueDate(c.dueDay || 10, c.paidCycles);
    if (due >= today && due <= cutoff && Number(c.outstanding) > 0) {
      out.cards.push({ name: c.name, amount: Number(c.outstanding) || 0, due, rate: 40 });
    }
  });
  data.loans.filter(l => !l.closed).forEach(l => {
    const due = nextDueDate(l.dueDay || 5, l.paidCycles);
    if (due >= today && due <= cutoff && Number(l.emi) > 0) {
      out.loans.push({ name: l.name, amount: Number(l.emi) || 0, due, rate: Number(l.rate) || 0 });
    }
  });
  data.bills.forEach(b => {
    const due = nextDueDate(b.dueDay || 1, b.paidCycles);
    if (due >= today && due <= cutoff && Number(b.amount) > 0) {
      out.bills.push({ name: b.name, amount: Number(b.amount) || 0, due, rate: 0 });
    }
  });
  return out;
}

function LightRaysBackground({ theme }) {
  const containerRef = useRef(null);
  const cleanupRef = useRef(null);
  const mouseRef = useRef({ x: 0.5, y: 0.5 });
  const smoothRef = useRef({ x: 0.5, y: 0.5 });

  useEffect(() => {
    const ogl = window.ogl;
    if (!ogl || !containerRef.current) return;
    const { Renderer, Program, Triangle, Mesh } = ogl;
    if (!Renderer || !Program || !Triangle || !Mesh) return;
    const lightMode = theme === 'light';
    const hexToRgb = hex => {
      const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
      return m ? [parseInt(m[1],16)/255, parseInt(m[2],16)/255, parseInt(m[3],16)/255] : [1,1,1];
    };
    const getAnchorAndDir = (origin, w, h) => {
      const outside = 0.2;
      switch (origin) {
        case 'top-left': return { anchor: [0, -outside*h], dir: [0, 1] };
        case 'top-right': return { anchor: [w, -outside*h], dir: [0, 1] };
        case 'left': return { anchor: [-outside*w, 0.5*h], dir: [1, 0] };
        case 'right': return { anchor: [(1+outside)*w, 0.5*h], dir: [-1, 0] };
        case 'bottom-left': return { anchor: [0, (1+outside)*h], dir: [0, -1] };
        case 'bottom-center': return { anchor: [0.5*w, (1+outside)*h], dir: [0, -1] };
        case 'bottom-right': return { anchor: [w, (1+outside)*h], dir: [0, -1] };
        default: return { anchor: [0.5*w, -outside*h], dir: [0, 1] };
      }
    };
    const vert = `attribute vec2 position; varying vec2 vUv; void main() { vUv = position * 0.5 + 0.5; gl_Position = vec4(position, 0.0, 1.0); }`;
    const frag = `precision highp float;
uniform float iTime; uniform vec2 iResolution; uniform vec2 rayPos; uniform vec2 rayDir; uniform vec3 raysColor;
uniform float raysSpeed; uniform float lightSpread; uniform float rayLength; uniform float pulsating; uniform float fadeDistance;
uniform float saturation; uniform vec2 mousePos; uniform float mouseInfluence; uniform float noiseAmount; uniform float distortion; uniform float lightMode;
varying vec2 vUv;
float rayStrength(vec2 raySource, vec2 rayRefDirection, vec2 coord, float seedA, float seedB, float speed) {
  vec2 sourceToCoord = coord - raySource;
  vec2 dirNorm = normalize(sourceToCoord);
  float cosAngle = dot(dirNorm, rayRefDirection);
  float distortedAngle = cosAngle + distortion * sin(iTime * 2.0 + length(sourceToCoord) * 0.01) * 0.2;
  float spreadFactor = pow(max(distortedAngle, 0.0), 1.0 / max(lightSpread, 0.001));
  float distance = length(sourceToCoord);
  float maxDistance = iResolution.x * rayLength;
  float lengthFalloff = clamp((maxDistance - distance) / maxDistance, 0.0, 1.0);
  float fadeFalloff = clamp((iResolution.x * fadeDistance - distance) / (iResolution.x * fadeDistance), 0.5, 1.0);
  float pulse = pulsating > 0.5 ? (0.8 + 0.2 * sin(iTime * speed * 3.0)) : 1.0;
  float baseStrength = clamp((0.45 + 0.15 * sin(distortedAngle * seedA + iTime * speed)) + (0.3 + 0.2 * cos(-distortedAngle * seedB + iTime * speed)), 0.0, 1.0);
  return baseStrength * lengthFalloff * fadeFalloff * spreadFactor * pulse;
}
void mainImage(out vec4 fragColor, in vec2 fragCoord) {
  vec2 coord = vec2(fragCoord.x, iResolution.y - fragCoord.y);
  vec2 finalRayDir = rayDir;
  if (mouseInfluence > 0.0) {
    vec2 mouseScreenPos = mousePos * iResolution.xy;
    vec2 mouseDirection = normalize(mouseScreenPos - rayPos);
    finalRayDir = normalize(mix(rayDir, mouseDirection, mouseInfluence));
  }
  vec4 rays1 = vec4(1.0) * rayStrength(rayPos, finalRayDir, coord, 36.2214, 21.11349, 1.5 * raysSpeed);
  vec4 rays2 = vec4(1.0) * rayStrength(rayPos, finalRayDir, coord, 22.3991, 18.0234, 1.1 * raysSpeed);
  fragColor = rays1 * 0.5 + rays2 * 0.4;
  float brightness = 1.0 - (coord.y / iResolution.y);
  fragColor.x *= 0.1 + brightness * 0.8; fragColor.y *= 0.3 + brightness * 0.6; fragColor.z *= 0.5 + brightness * 0.5;
  fragColor.rgb *= raysColor;
  if (lightMode > 0.5) { vec3 mapped = vec3(1.0) - exp(-max(fragColor.rgb, vec3(0.0)) * 1.35); float energy = clamp(max(mapped.r, max(mapped.g, mapped.b)), 0.0, 1.0); vec3 hue = mapped / max(energy, 0.0001); vec3 ink = mix(hue * 0.25, hue * 0.72, energy); fragColor = vec4(mix(vec3(1.0), ink, energy), 1.0); }
}
void main() { vec4 color; mainImage(color, gl_FragCoord.xy); gl_FragColor = color; }`;
    const uniforms = {
      iTime: { value: 0 }, iResolution: { value: [1, 1] }, rayPos: { value: [0, 0] }, rayDir: { value: [0, 1] },
      raysColor: { value: hexToRgb('#7c92ff') }, raysSpeed: { value: 0.8 }, lightSpread: { value: 0.6 },
      rayLength: { value: 2.6 }, pulsating: { value: 0 }, fadeDistance: { value: 1.0 },
      saturation: { value: 1.0 }, mousePos: { value: [0.5, 0.5] }, mouseInfluence: { value: 0.08 },
      noiseAmount: { value: 0.0 }, distortion: { value: 0.0 }, lightMode: { value: lightMode ? 1 : 0 }
    };
    let renderer;
    try { renderer = new Renderer({ dpr: Math.min(window.devicePixelRatio, 2), alpha: true }); } catch (e) { return; }
    const gl = renderer.gl;
    gl.canvas.style.width = '100%'; gl.canvas.style.height = '100%';
    while (containerRef.current.firstChild) containerRef.current.removeChild(containerRef.current.firstChild);
    containerRef.current.appendChild(gl.canvas);
    const geometry = new Triangle(gl);
    const program = new Program(gl, { vertex: vert, fragment: frag, uniforms });
    const mesh = new Mesh(gl, { geometry, program });
    const updatePlacement = () => {
      if (!containerRef.current || !renderer) return;
      renderer.dpr = Math.min(window.devicePixelRatio, 2);
      const { clientWidth: wCSS, clientHeight: hCSS } = containerRef.current;
      if (wCSS === 0 || hCSS === 0) return;
      renderer.setSize(wCSS, hCSS);
      const dpr = renderer.dpr;
      const w = wCSS * dpr, h = hCSS * dpr;
      uniforms.iResolution.value = [w, h];
      const { anchor, dir } = getAnchorAndDir('top-center', w, h);
      uniforms.rayPos.value = anchor; uniforms.rayDir.value = dir;
    };
    let raf = null;
    const loop = t => {
      uniforms.iTime.value = t * 0.001;
      const smoothing = 0.92;
      smoothRef.current.x = smoothRef.current.x * smoothing + mouseRef.current.x * (1 - smoothing);
      smoothRef.current.y = smoothRef.current.y * smoothing + mouseRef.current.y * (1 - smoothing);
      uniforms.mousePos.value = [smoothRef.current.x, smoothRef.current.y];
      try { renderer.render({ scene: mesh }); raf = requestAnimationFrame(loop); } catch (e) {}
    };
    const onMouse = e => {
      if (!containerRef.current) return;
      const rect = containerRef.current.getBoundingClientRect();
      mouseRef.current = { x: (e.clientX - rect.left) / rect.width, y: (e.clientY - rect.top) / rect.height };
    };
    window.addEventListener('resize', updatePlacement);
    window.addEventListener('mousemove', onMouse);
    updatePlacement();
    raf = requestAnimationFrame(loop);
    cleanupRef.current = () => {
      if (raf) cancelAnimationFrame(raf);
      window.removeEventListener('resize', updatePlacement);
      window.removeEventListener('mousemove', onMouse);
      try {
        const canvas = renderer.gl.canvas;
        const loseContextExt = renderer.gl.getExtension('WEBGL_lose_context');
        if (loseContextExt) loseContextExt.loseContext();
        if (canvas && canvas.parentNode) canvas.parentNode.removeChild(canvas);
      } catch (e) {}
    };
    return () => { if (cleanupRef.current) { cleanupRef.current(); cleanupRef.current = null; } };
  }, [theme]);

  return <div className="rays-bg" aria-hidden="true"><div ref={containerRef} className="rays-container" /></div>;
}

function NetWorthChart({ points }) {

    });
    return Object.keys(map).sort().map(date => ({ date, value: map[date] }));
  }, [points]);

  if (!clean.length) return <div className="empty"><div className="empty-icon">{Ico.trend}</div><div className="empty-title">Net worth history is starting</div></div>;

  const first = clean[0], last = clean[clean.length - 1];
  const change = r2(last.value - first.value);
  const changePct = Math.abs(first.value) > 0.5 ? r2(change / Math.abs(first.value) * 100) : null;
  const lineColor = last.value >= 0 ? 'var(--green)' : 'var(--red)';

  if (clean.length === 1) return (

    </div>

  let min = Math.min(...vals), max = Math.max(...vals);
  const range = max - min;
  const padValue = range === 0 ? Math.max(100, Math.abs(max) * 0.08, 100) : Math.max(100, range * 0.16);
  min -= padValue; max += padValue;
  const plotW = W - PX * 2, plotH = H - PY * 2;
  const x = i => PX + (i * plotW) / Math.max(1, clean.length - 1);
  const y = v => H - PY - ((v - min) / Math.max(1, max - min)) * plotH;
  const pts = clean.map((p,i) => ({x:x(i), y:y(p.value)}));
  const smoothPath = () => {
    if (pts.length === 2) {
      const dx = (pts[1].x - pts[0].x) * 0.45;
      return `M ${pts[0].x.toFixed(2)} ${pts[0].y.toFixed(2)} C ${(pts[0].x+dx).toFixed(2)} ${pts[0].y.toFixed(2)}, ${(pts[1].x-dx).toFixed(2)} ${pts[1].y.toFixed(2)}, ${pts[1].x.toFixed(2)} ${pts[1].y.toFixed(2)}`;
    }

    for (let i=0;i<pts.length-1;i++) {
      const p0=pts[Math.max(0,i-1)], p1=pts[i], p2=pts[i+1], p3=pts[Math.min(pts.length-1,i+2)];
      const cp1x=p1.x+(p2.x-p0.x)/6, cp1y=p1.y+(p2.y-p0.y)/6;
      const cp2x=p2.x-(p3.x-p1.x)/6, cp2y=p2.y-(p3.y-p1.y)/6;
      d += ` C ${cp1x.toFixed(2)} ${cp1y.toFixed(2)}, ${cp2x.toFixed(2)} ${cp2y.toFixed(2)}, ${p2.x.toFixed(2)} ${p2.y.toFixed(2)}`;
    }
    return d;
  };
  const path = smoothPath();
  const area = path + ` L ${pts[pts.length-1].x.toFixed(2)} ${H-PY} L ${pts[0].x.toFixed(2)} ${H-PY} Z`;
  const zeroY = 0 >= min && 0 <= max ? y(0) : null;
  const ticks = [0,1,2,3,4].map(i => max - (max-min)*i/4);
  const hovered = hover === null ? null : clean[hover];
  const onMove = e => { const rect=e.currentTarget.getBoundingClientRect(); const ratio=Math.max(0,Math.min(1,(e.clientX-rect.left)/Math.max(1,rect.width))); setHover(Math.round(ratio*(clean.length-1))); };

  return <div>

      <span className={'pill ' + (change >= 0 ? 'green' : 'red')}><span className="pdot"></span>{change >= 0 ? '▲' : '▼'} {inr(Math.abs(change))}{changePct !== null ? ` (${changePct >= 0 ? '+' : ''}${changePct}%)` : ''}</span>
      
      
    </div>
    
    <div className="nw-chart-wrap liquid-chart" onMouseMove={onMove} onMouseLeave={()=>setHover(null)} onTouchMove={e=>{ const t=e.touches[0]; if(!t)return; const rect=e.currentTarget.getBoundingClientRect(); const ratio=Math.max(0,Math.min(1,(t.clientX-rect.left)/Math.max(1,rect.width))); setHover(Math.round(ratio*(clean.length-1))); }}>
      <svg viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="none" aria-label="Net worth history chart">
        <defs><linearGradient id="nwLiquidFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor={lineColor} stopOpacity=".28"/><stop offset="72%" stopColor={lineColor} stopOpacity=".06"/><stop offset="100%" stopColor={lineColor} stopOpacity="0"/></linearGradient><filter id="nwGlow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
        {ticks.map((v,i)=><React.Fragment key={i}><line x1={PX} x2={W-PX} y1={y(v)} y2={y(v)} stroke="var(--brd)" strokeWidth="1" vectorEffect="non-scaling-stroke"/><text x="4" y={y(v)+4} fill="var(--muted)" fontSize="10" fontFamily="Inter, sans-serif">{money(v).replace('.00','')}</text></React.Fragment>)}
        {zeroY !== null ? <line x1={PX} x2={W-PX} y1={zeroY} y2={zeroY} stroke="var(--muted-2)" strokeWidth="1" strokeDasharray="4 5" vectorEffect="non-scaling-stroke"/> : null}
        <path d={area} fill="url(#nwLiquidFill)"/>

        {pts.map((p,i)=><circle key={i} cx={p.x} cy={p.y} r={hover===i?5:2.7} fill={lineColor} stroke="var(--bg)" strokeWidth="1.8" vectorEffect="non-scaling-stroke"/>)}
        {hover !== null ? <line x1={pts[hover].x} x2={pts[hover].x} y1={PY} y2={H-PY} stroke="var(--muted-2)" strokeWidth="1" strokeDasharray="3 4" vectorEffect="non-scaling-stroke" opacity=".8"/> : null}
      </svg>

    </div>

  </div>;

  const W = 800, H = 240, P = 26;
  const vals = points.map(p => p.value);
  let min = Math.min.apply(null, vals);
  let max = Math.max.apply(null, vals);
  if (min === max) { min = min - Math.max(1, min * 0.05); max = max + Math.max(1, max * 0.05); }
  const padY = (max - min) * 0.14;
  min -= padY; max += padY;
  const n = points.length;
  const x = (i) => P + (i * (W - 2 * P)) / Math.max(1, n - 1);
  const y = (v) => H - P - ((v - min) / (max - min)) * (H - 2 * P);
  let d = '';
  points.forEach((p, i) => { d += (i ? ' L' : 'M') + x(i).toFixed(1) + ',' + y(p.value).toFixed(1); });
  const area = d + ' L' + x(n - 1).toFixed(1) + ',' + (H - P) + ' L' + x(0).toFixed(1) + ',' + (H - P) + ' Z';
  const last = points[n - 1];
  const first = points[0];
  const change = r2(last.value - first.value);
  const changePct = first.value ? r2((change / first.value) * 100) : 0;
  return (
    <div>
      <div style={{ display: 'flex', gap: '12px', alignItems: 'baseline', flexWrap: 'wrap', marginBottom: '8px' }}>
        <div style={{ fontSize: '22px', fontWeight: 700, letterSpacing: '-0.7px' }} className="mono">{inr(last.value)}</div>
        <div className={'pill ' + (change >= 0 ? 'green' : 'red')}><span className="pdot"></span>{change >= 0 ? '+' : ''}{inr(Math.abs(change))} ({changePct}%)</div>
        <div className="pill blue">{fmtDate(last.date)}</div>
      </div>
      <div className="chart-wrap">
        <svg viewBox={'0 0 ' + W + ' ' + H} preserveAspectRatio="none">
          <defs><linearGradient id="gradchart" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="var(--accent)" stopOpacity="0.3" /><stop offset="100%" stopColor="var(--accent)" stopOpacity="0" /></linearGradient></defs>
          {[0, 1, 2, 3].map(i => (<line key={i} x1={P} x2={W - P} y1={P + (i * (H - 2 * P)) / 3} y2={P + (i * (H - 2 * P)) / 3} stroke="var(--brd)" strokeWidth="1" vectorEffect="non-scaling-stroke" />))}
          <path d={area} fill="url(#gradchart)" />
          <path d={d} fill="none" stroke="var(--accent)" strokeWidth="2" vectorEffect="non-scaling-stroke" strokeLinejoin="round" strokeLinecap="round" />
          {points.map((p, i) => (<circle key={i} cx={x(i)} cy={y(p.value)} r="3" fill="var(--accent)" stroke="var(--bg)" strokeWidth="2" vectorEffect="non-scaling-stroke" />))}
        </svg>
      </div>
      <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: '11px', color: 'var(--muted)', marginTop: '8px' }}><span>{fmtDate(points[0].date)}</span><span>{fmtDate(points[points.length - 1].date)}</span></div>
    </div>
  );
}

function BackupRestore({ data, setData, showToast, sync, theme, toggleTheme }) {
  const fileRef = useRef(null);
  const [restoring, setRestoring] = useState(false);
  const [lastBackup, setLastBackup] = useState(null);

  const downloadBackup = useCallback(() => {
    try {
      const payload = {
        app: 'ShubhVault',
        backupVersion: 3,
        createdAt: new Date().toISOString(),
        theme: theme,
        data: data
      };
      const json = JSON.stringify(payload, null, 2);
      const blob = new Blob([json], { type: 'application/json;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const stamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
      a.href = url;
      a.download = 'ShubhVault-backup-' + stamp + '.json';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      setLastBackup(new Date());
      showToast('Complete ShubhVault backup downloaded');
    } catch (e) {
      showToast('Backup failed: ' + (e && e.message ? e.message : 'Unknown error'));
    }
  }, [data, theme, showToast]);

  const validateBackup = (raw) => {
    if (!raw || typeof raw !== 'object') throw new Error('Invalid backup file.');
    const source = raw.data && typeof raw.data === 'object' ? raw.data : raw;
    const required = ['banks','transactions','demats','cards','loans','bills','inflows'];
    const missing = required.filter(k => !Array.isArray(source[k]));
    if (missing.length) throw new Error('This does not look like a valid ShubhVault backup. Missing: ' + missing.join(', ') + '.');
    if (!Array.isArray(source.netWorthHistory)) source.netWorthHistory = [];
    source.netWorthHistoryVersion = 2;
    return { source: normalize(source), theme: raw.theme === 'light' ? 'light' : 'dark', createdAt: raw.createdAt || null };
  };

  const restoreFile = (file) => {
    if (!file) return;
    setRestoring(true);
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const raw = JSON.parse(String(reader.result || ''));
        const parsed = validateBackup(raw);
        const confirmText = parsed.createdAt
          ? 'Restore the ShubhVault backup created ' + new Date(parsed.createdAt).toLocaleString() + '?\\n\\nThis will replace the current data in this vault with the backup. Make sure you have downloaded your current backup first.'
          : 'Restore this ShubhVault backup?\\n\\nThis will replace the current data in this vault. Make sure you have downloaded your current backup first.';
        if (!window.confirm(confirmText)) { setRestoring(false); return; }
        // Keep a safety copy of the current state in localStorage before restore.
        try { localStorage.setItem('finvault_pre_restore_backup', JSON.stringify({ app:'ShubhVault', backupVersion:3, createdAt:new Date().toISOString(), theme, data })); } catch (e) {}
        const restored = parsed.source;
        setData(restored);
        try { localStorage.setItem('finvault_data', JSON.stringify(restored)); } catch (e) {}
        if (raw.theme === 'light' || raw.theme === 'dark') {
          localStorage.setItem('fv_theme', parsed.theme);
          document.documentElement.setAttribute('data-theme', parsed.theme);
        }
        showToast('Backup restored. Cloud sync will save the restored data.');
      } catch (e) {
        showToast('Restore failed: ' + (e && e.message ? e.message : 'Invalid backup'));
      } finally {
        setRestoring(false);
        if (fileRef.current) fileRef.current.value = '';
      }
    };
    reader.onerror = () => {
      setRestoring(false);
      showToast('Could not read the backup file');
      if (fileRef.current) fileRef.current.value = '';
    };
    reader.readAsText(file);
  };

  const restoreLocalSafety = () => {
    try {
      const raw = localStorage.getItem('finvault_pre_restore_backup');
      if (!raw) { showToast('No pre-restore safety copy is available'); return; }
      const parsed = validateBackup(JSON.parse(raw));
      if (!window.confirm('Restore the automatic safety copy from before the last restore?')) return;
      setData(parsed.source);
      try { localStorage.setItem('finvault_data', JSON.stringify(parsed.source)); } catch (e) {}
      showToast('Pre-restore safety copy restored');
    } catch (e) {
      showToast('Safety restore failed: ' + (e && e.message ? e.message : 'Unknown error'));
    }
  };

  const count = data.banks.length + data.transactions.length + data.demats.length + data.cards.length + data.loans.length + data.bills.length + data.inflows.length;

  return (
    <div>
      <PageHead title="Backup & Restore" sync={sync} openTx={openTxPlaceholder} />
      <div className="grid g2">
        <div className="glass" style={{ padding: '20px' }}>
          <div className="section-title"><span className="dot"></span>Backup entire vault</div>
          <div className="backup-drop" style={{ marginTop: '14px' }}>
            <div className="backup-icon">{Ico.down}</div>
            <button className="btn btn-primary" onClick={downloadBackup} style={{ marginTop: '16px' }}>{Ico.down}<span style={{ marginLeft: 4 }}>Download Backup</span></button>
          </div>
        </div>

        <div className="glass" style={{ padding: '20px' }}>
          <div className="section-title"><span className="dot"></span>Restore from backup</div>
          <div className="backup-drop" style={{ marginTop: '14px' }}>
            <div className="backup-icon">{Ico.up}</div>
            <input ref={fileRef} type="file" accept="application/json,.json" style={{ display: 'none' }} onChange={(e) => restoreFile(e.target.files && e.target.files[0])} />
            <button className="btn btn-primary" onClick={() => fileRef.current && fileRef.current.click()} disabled={restoring} style={{ marginTop: '16px' }}>{Ico.up}<span style={{ marginLeft: 4 }}>{restoring ? 'Restoring…' : 'Choose Backup File'}</span></button>
          </div>
          <div style={{ display: 'flex', gap: '8px', flexWrap: 'wrap', marginTop: '12px' }}><button className="btn btn-sm" onClick={restoreLocalSafety}>Restore automatic pre-restore safety copy</button><button className="btn btn-sm" onClick={() => { try { const raw = localStorage.getItem('finvault_data'); if (!raw) { showToast('No browser recovery copy available'); return; } const payload = { app:'ShubhVault', backupVersion:3, createdAt:new Date().toISOString(), source:'browser-recovery', theme:localStorage.getItem('fv_theme') || theme, data:normalize(JSON.parse(raw)) }; const blob = new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download='ShubhVault-browser-recovery.json'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),1000); showToast('Browser recovery backup downloaded'); } catch(e){ showToast('Could not export recovery copy'); } }}>Export browser recovery</button></div>
        </div>
      </div>
    </div>
  );
}
