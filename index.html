}

function simulate(loans, extra) {
  const ls = loans.map(l => ({ name: l.name, rem: r2(l.remaining), rate: r2(l.rate), emi: r2(l.emi) }));
  let months = 0;
  let totalInterest = 0;
  while (ls.some(l => l.rem > 0.5) && months < 720) {
    months++;
    ls.sort((a, b) => b.rate - a.rate);
    let pool = extra;
    for (let i = 0; i < ls.length; i++) {
      const l = ls[i];
      if (l.rem <= 0) continue;
      const interest = l.rem * (l.rate / 100) / 12;
      let pay = l.emi;
      if (pool > 0) {
        const room = Math.max(0, l.rem + interest - pay);
        const add = Math.min(pool, room);
        pay += add;
        pool -= add;
      }
      if (pay > l.rem + interest) pay = l.rem + interest;
      totalInterest += interest;
      l.rem = r2(l.rem + interest - pay);
      if (l.rem < 0) l.rem = 0;
    }
  }
  return { months, totalInterest: r2(totalInterest) };
}

function AiBrain({ data, sync }) {
  const [extra, setExtra] = useState('5000');
  const bankTotal = data.banks.reduce((s, b) => s + (Number(b.balance) || 0), 0);
  const dematTotal = data.demats.reduce((s, d) => s + (Number(d.balance) || 0), 0);
  const cardDebt = data.cards.reduce((s, c) => s + (Number(c.outstanding) || 0), 0);
  const loanDebt = data.loans.reduce((s, l) => s + (Number(l.remaining) || 0), 0);
  const assets = r2(bankTotal + dematTotal);
  const liabilities = r2(cardDebt + loanDebt);
  const netWorth = r2(assets - liabilities);

  const mk = monthKey(new Date());
  const monthTx = data.transactions.filter(t => String(t.date).startsWith(mk));
  const mIn = r2(monthTx.filter(t => t.dir === 'in').reduce((s, t) => s + (Number(t.amount) || 0), 0));
  const mOut = r2(monthTx.filter(t => t.dir === 'out').reduce((s, t) => s + (Number(t.amount) || 0), 0));

  const sortedLoans = data.loans.slice().sort((a, b) => (Number(b.rate) || 0) - (Number(a.rate) || 0));
  const smallest = data.loans.slice().sort((a, b) => (Number(a.remaining) || 0) - (Number(b.remaining) || 0));
  const sortedCards = data.cards.slice().sort((a, b) => (Number(b.outstanding) || 0) - (Number(a.outstanding) || 0));

  const base = useMemo(() => simulate(data.loans, 0), [data.loans]);
  const withExtra = useMemo(() => simulate(data.loans, r2(extra) || 0), [data.loans, extra]);
  const monthsSaved = Math.max(0, base.months - withExtra.months);
  const interestSaved = r2(Math.max(0, base.totalInterest - withExtra.totalInterest));

  const insights = [];
  if (liabilities === 0) insights.push({ icon: Ico.check, title: 'You are debt free', text: 'No loans and no credit card outstanding. Keep building your investments.' });
  if (cardDebt > 0) insights.push({ icon: Ico.card, title: 'Credit cards first', text: 'Credit card interest is usually 36% to 42% a year, way higher than most loans. Clear ' + (sortedCards[0] ? sortedCards[0].name : 'your card') + ' (' + inr(sortedCards[0] ? sortedCards[0].outstanding : 0) + ') before making extra payments on loans.' });
  if (sortedLoans.length > 0) {
    const top = sortedLoans[0];
    insights.push({ icon: Ico.loan, title: 'Attack this loan first', text: top.name + ' has the highest interest at ' + top.rate + '% a year. Put any extra money here first.' });
    const small = smallest[0];
    if (small !== top) insights.push({ icon: Ico.sparkle, title: 'Or try the quick win', text: 'If you need motivation, close ' + small.name + ' first. Only ' + inr(small.remaining) + ' left.' });
  }
  if (bankTotal > 0 && bankTotal < mOut) insights.push({ icon: Ico.bank, title: 'Thin cushion', text: 'Your bank balance is less than one month of spending. Try to keep at least 3 months of expenses (' + inr(r2(mOut * 3)) + ') as an emergency fund.' });
  else if (mOut > 0) insights.push({ icon: Ico.bank, title: 'Emergency fund check', text: 'A safe cushion is about 3 to 6 months of expenses. For you that is ' + inr(r2(mOut * 3)) + ' to ' + inr(r2(mOut * 6)) + '.' });
  if (mIn > 0) {
    const rate = r2(((mIn - mOut) / mIn) * 100);
    insights.push({ icon: Ico.sparkle, title: 'This month savings rate: ' + rate + '%', text: rate >= 20 ? 'Great going. You are keeping ' + inr(r2(mIn - mOut)) + ' this month.' : rate >= 0 ? 'You are saving ' + inr(r2(mIn - mOut)) + '. Try to push this above 20%.' : 'You spent more than you earned by ' + inr(Math.abs(r2(mIn - mOut))) + '.' });
  }
  const catTotals = {};
  monthTx.filter(t => t.dir === 'out').forEach(t => { const c = t.category || 'Other'; catTotals[c] = r2((catTotals[c] || 0) + (Number(t.amount) || 0)); });
  const topCats = Object.keys(catTotals).map(k => ({ k, v: catTotals[k] })).sort((a, b) => b.v - a.v).slice(0, 3);
  if (topCats.length) insights.push({ icon: Ico.bill, title: 'Where your money went this month', text: topCats.map(c => c.k + ' ' + inr(c.v)).join(' · ') });
  if (base.months > 0) insights.push({ icon: Ico.sparkle, title: 'Debt free in about ' + base.months + ' months', text: 'If you keep paying your normal EMIs, you will be debt free around ' + fmtDate(new Date(new Date().getFullYear(), new Date().getMonth() + base.months, 1)) + '.' });

  const foreclosable = data.loans.filter(l => Number(l.foreclosureAmount) > 0);
  const bestForeclose = foreclosable.slice().sort((a, b) => (Number(b.rate) || 0) - (Number(a.rate) || 0))[0];

  return (
    <div>
      <PageHead title="AI Brain" sub="Smart money analysis based on your real data" sync={sync} />

      <div className="grid g3" style={{ marginBottom: '18px' }}>
        <div className="kpi glass">
          <div className="kpi-head"><span className="kpi-dot green"></span><span className="kpi-label">Assets</span></div>
          <div className="kpi-val" style={{ color: 'var(--green)' }}>{inr(assets)}</div>
          <div className="kpi-note">Banks {inr(bankTotal)} + Demat {inr(dematTotal)}</div>
        </div>
        <div className="kpi glass">
          <div className="kpi-head"><span className="kpi-dot red"></span><span className="kpi-label">Debts</span></div>
          <div className="kpi-val" style={{ color: 'var(--red)' }}>{inr(liabilities)}</div>
          <div className="kpi-note">Loans {inr(loanDebt)} + Cards {inr(cardDebt)}</div>
        </div>
        <div className="kpi glass">
          <div className="kpi-head"><span className="kpi-dot amber"></span><span className="kpi-label">Net Worth</span></div>
          <div className="kpi-val">{inr(netWorth)}</div>
          <div className="kpi-note">{inr(assets)} − {inr(liabilities)}</div>
        </div>
      </div>

      <div className="section-head"><div className="section-title"><span className="dot"></span>What the AI sees</div></div>
      <div className="list">
        {insights.map((ins, i) => (
          <div className="item" key={i}>
            <div className="item-ico" style={{ color: 'var(--accent)' }}>{ins.icon}</div>
            <div className="item-body">
              <div className="item-name">{ins.title}</div>
              <div style={{ fontSize: '12.5px', color: 'var(--muted)', marginTop: '6px', lineHeight: 1.55 }}>{ins.text}</div>
            </div>
          </div>
        ))}
      </div>

      <div className="section-head"><div className="section-title"><span className="dot"></span>Extra Payment Planner</div></div>
      <div className="glass" style={{ padding: '20px' }}>
        <div className="field" style={{ maxWidth: '320px' }}>
          <label className="label">If I put this much extra every month</label>
          <MoneyInput value={extra} onChange={setExtra} />
        </div>
        <div className="grid g3" style={{ marginTop: '6px' }}>
          <div className="glass-soft" style={{ padding: '14px' }}>
            <div className="kpi-label">Debt free in</div>
            <div style={{ fontSize: '19px', fontWeight: 700, marginTop: '6px', letterSpacing: '-.4px' }} className="mono">{withExtra.months} months</div>
            <div style={{ fontSize: '11.5px', color: 'var(--muted)', marginTop: '4px' }}>Normal EMI: {base.months} months</div>
          </div>
          <div className="glass-soft" style={{ padding: '14px' }}>
            <div className="kpi-label">Months saved</div>
            <div style={{ fontSize: '19px', fontWeight: 700, marginTop: '6px', letterSpacing: '-.4px', color: 'var(--green)' }} className="mono">{monthsSaved}</div>
            <div style={{ fontSize: '11.5px', color: 'var(--muted)', marginTop: '4px' }}>That is {r2(monthsSaved / 12)} years faster</div>
          </div>
          <div className="glass-soft" style={{ padding: '14px' }}>
            <div className="kpi-label">Interest saved</div>
            <div style={{ fontSize: '19px', fontWeight: 700, marginTop: '6px', letterSpacing: '-.4px', color: 'var(--green)' }} className="mono">{inr(interestSaved)}</div>
            <div style={{ fontSize: '11.5px', color: 'var(--muted)', marginTop: '4px' }}>Total interest now {inr(base.totalInterest)}</div>
          </div>
        </div>
        {sortedLoans.length > 0 && r2(extra) > 0 ? (
          <div style={{ marginTop: '16px', fontSize: '12.5px', color: 'var(--muted)', lineHeight: 1.6 }}>
            Put the extra <b style={{ color: 'var(--txt)' }}>{inr(extra)}</b> into <b style={{ color: 'var(--txt)' }}>{sortedLoans[0].name}</b> first because it charges the highest interest at {sortedLoans[0].rate}% a year.
          </div>
        ) : null}
      </div>

      {bestForeclose ? (
        <React.Fragment>
          <div className="section-head"><div className="section-title"><span className="dot"></span>Foreclosure Advice</div></div>
          <div className="glass" style={{ padding: '20px', fontSize: '13px', lineHeight: 1.7 }}>
            <b>{bestForeclose.name}</b> can be closed today for <b>{inr(bestForeclose.foreclosureAmount)}</b>.
            You still owe <b>{inr(bestForeclose.remaining)}</b> and have <b>{bestForeclose.monthsLeft || 0} months</b> left at <b>{bestForeclose.rate}%</b>.
            Closing now saves you roughly <b>{inr(r2(Math.max(0, (Number(bestForeclose.emi) || 0) * (Number(bestForeclose.monthsLeft) || 0) - Number(bestForeclose.foreclosureAmount))))}</b> in future payments.
            {Number(bankTotal) >= Number(bestForeclose.foreclosureAmount)
              ? ' You have enough in the bank to do this right now.'
              : ' You need ' + inr(r2(Number(bestForeclose.foreclosureAmount) - bankTotal)) + ' more in the bank to do this today.'}
          </div>
        </React.Fragment>
      ) : null}

      <div className="section-head"><div className="section-title"><span className="dot"></span>Payoff Order</div></div>
      <div className="list">
        {sortedLoans.length === 0 && sortedCards.length === 0 ? (
          <div className="glass"><EmptyState icon={Ico.check} title="Nothing to pay off" sub="You are debt free. Nice." /></div>
        ) : null}
        {sortedLoans.map((l, i) => (
          <div className="item" key={l.id}>
            <div className="item-ico" style={{ fontWeight: 700, fontSize: '14px' }}>{i + 1}</div>
            <div className="item-body">
              <div className="item-name">{l.name}</div>
              <div className="item-meta">
                <span className="pill amber">{l.rate}% interest</span>
                <span className="pill">{l.monthsLeft || 0} months left</span>
                <span className="pill blue">EMI {inr(l.emi)}</span>
              </div>
            </div>
            <div className="item-amt">{inr(l.remaining)}</div>
          </div>
        ))}
        {sortedCards.map((c) => (
          <div className="item" key={c.id}>
            <div className="item-ico">{Ico.card}</div>
            <div className="item-body">
              <div className="item-name">{c.name} (credit card)</div>
              <div className="item-meta">
                <span className="pill red">very high interest</span>
                <span className="pill">due day {c.dueDay || 10}</span>
              </div>
            </div>
            <div className="item-amt">{inr(c.outstanding)}</div>
          </div>
        ))}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

<script>
(function () {
  var LIBS = [
    { name: 'React', optional: false, urls: [
      'https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js',
      'https://unpkg.com/react@18.3.1/umd/react.production.min.js',
      'https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js'
    ], check: function () { return window.React; } },
    { name: 'ReactDOM', optional: false, urls: [
      'https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js',
      'https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js',
      'https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js'
    ], check: function () { return window.ReactDOM; } },
    { name: 'FirebaseApp', optional: true, urls: [
      'https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js',
      'https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-app-compat.js',
      'https://unpkg.com/firebase@10.12.2/firebase-app-compat.js'
    ], check: function () { return window.firebase; } },
    { name: 'FirebaseStore', optional: true, urls: [
      'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js',
      'https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-firestore-compat.js',
      'https://unpkg.com/firebase@10.12.2/firebase-firestore-compat.js'
    ], check: function () { return window.firebase && window.firebase.firestore; } },
    { name: 'Babel', optional: false, urls: [
      'https://cdn.jsdelivr.net/npm/@babel/standalone@7.24.7/babel.min.js',
      'https://unpkg.com/@babel/standalone@7.24.7/babel.min.js',
      'https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js'
    ], check: function () { return window.Babel; } }
  ];

  function loadOne(lib) {
    return new Promise(function (resolve, reject) {
      var i = 0;
      function tryNext() {
        if (i >= lib.urls.length) {
          if (lib.optional) resolve(false);
          else reject(new Error('Could not load ' + lib.name));
          return;
        }
        var url = lib.urls[i++];
        var s = document.createElement('script');
        s.src = url;
        s.async = false;
        s.onload = function () {
          if (lib.check && !lib.check()) tryNext();
          else resolve(true);
        };
        s.onerror = tryNext;
        document.head.appendChild(s);
      }
      tryNext();
    });
  }

  function loadOgl() {
    var urls = [
      'https://esm.sh/ogl@1.0.6',
      'https://cdn.jsdelivr.net/npm/ogl@1.0.6/+esm',
      'https://unpkg.com/ogl@1.0.6?module'
    ];
    var i = 0;
    function tryNext() {
      if (i >= urls.length) return Promise.resolve(null);
      var url = urls[i++];
      return import(url).then(function (mod) {
        if (mod && mod.Renderer && mod.Program && mod.Triangle && mod.Mesh) {
          window.ogl = mod;
          return mod;
        }
        return tryNext();
      }).catch(function () { return tryNext(); });
    }
    return tryNext();
  }

  function showError(err) {
    var d = document.createElement('div');
    d.style.cssText = 'position:fixed;inset:0;z-index:9999;background:#05060a;color:#f87171;padding:28px;font-family:ui-monospace,Menlo,monospace;font-size:13px;line-height:1.7;overflow:auto;white-space:pre-wrap';
    d.textContent = 'ShubhVault could not start.\n\n' + (err && err.stack ? err.stack : String(err)) +
      '\n\nTry a hard refresh (Ctrl+Shift+R). If it still fails, your network or browser may be blocking the script CDN.';
    document.body.appendChild(d);
  }

  window.addEventListener('error', function (e) {
    if (document.getElementById('root') && document.getElementById('root').children.length === 0) {
      showError(e.error || e.message);
    }
  });

  (async function () {
    try {
      for (var i = 0; i < LIBS.length; i++) {
        await loadOne(LIBS[i]);
      }
      try { await loadOgl(); } catch (e) { console.warn('ogl not available', e); }

      var src = document.getElementById('app-src').textContent;
      var out = window.Babel.transform(src, { presets: ['react'] }).code;
      (0, eval)(out);
    } catch (err) {
      showError(err);
    }
  })();
})();
</script>
</body>
</html>
