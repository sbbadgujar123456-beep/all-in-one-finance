function App() {
  const [authed, setAuthed] = useState(() => sessionStorage.getItem('fv_auth') === '1');
  const [theme, setTheme] = useState(() => localStorage.getItem('fv_theme') === 'light' ? 'light' : 'dark');
  const [page, setPage] = useState('home');
  const [data, setData, sync] = useStore();
  const [toast, setToast] = useState({ msg: '', action: null, onAction: null });
  const toastTimerRef = useRef(null);

  const [txOpen, setTxOpen] = useState(false);
  const [txPrefill, setTxPrefill] = useState(null);

  useEffect(() => { document.documentElement.setAttribute('data-theme', theme); localStorage.setItem('fv_theme', theme); }, [theme]);

  const showToast = useCallback((msg, undoFn) => {
    if (toastTimerRef.current) clearTimeout(toastTimerRef.current);
    setToast({ msg, action: undoFn ? 'Undo' : null, onAction: undoFn || null });
    const delay = undoFn ? 8000 : 2600;
    toastTimerRef.current = setTimeout(() => setToast({ msg: '', action: null, onAction: null }), delay);
  }, []);

  const mut = useCallback((fn) => { setData(prev => { if (!prev) return prev; const next = JSON.parse(JSON.stringify(prev)); fn(next); return next; }); }, [setData]);
  const toggleTheme = () => setTheme(t => (t === 'dark' ? 'light' : 'dark'));

  const openTx = (prefill = null) => { setTxPrefill(prefill); setTxOpen(true); };

  const saveTx = (payload, id) => {
    mut(d => {
      if (id) {
        const old = d.transactions.find(t => t.id === id);
        if (old && old.affectsBalance && old.bankId) { 
          const ob = d.banks.find(b => b.id === old.bankId); 
          if (ob) ob.balance = r2(ob.balance - (old.dir === 'in' ? old.amount : -old.amount)); 
        }
        if (old) {
          reverseTxLink(d, old);
          const newLink = payload.link !== undefined ? payload.link : old.link;
          Object.assign(old, payload);
          if (newLink) old.link = newLink;
        }
        const t = d.transactions.find(x => x.id === id);
        if (t) {
          if (t.affectsBalance && t.bankId) { 
            const nb = d.banks.find(b => b.id === t.bankId); 
            if (nb) nb.balance = r2(nb.balance + (t.dir === 'in' ? t.amount : -t.amount)); 
          }
          applyTxLink(d, t);
        }
      } else {
        const t = Object.assign({ id: uid(), ts: Date.now() }, payload);
        d.transactions.push(t);
        if (t.affectsBalance && t.bankId) { 
          const nb = d.banks.find(b => b.id === t.bankId); 
          if (nb) nb.balance = r2(nb.balance + (t.dir === 'in' ? t.amount : -t.amount)); 
        }
        applyTxLink(d, t);
      }
    });
    setTxOpen(false);
    setTxPrefill(null);
    showToast(id ? 'Transaction updated' : 'Transaction added');
    if (txPrefill && txPrefill._onSave) txPrefill._onSave(payload);
  };

  const currentSnapshot = useMemo(() => data ? financialSnapshot(data) : null, [data]);
  const currentNetWorth = currentSnapshot ? currentSnapshot.netWorth : 0;

  const meaningful = useMemo(() => {
    if (!currentSnapshot) return false;
    return currentSnapshot.assets > 0.5 || currentSnapshot.liabilities > 0.5 ||
      data.transactions.length > 0 || data.bills.length > 0 || data.inflows.length > 0;
  }, [currentSnapshot, data]);

  const nwRecordRef = useRef({ date: null, value: null });

  useEffect(() => {
    if (!data) return;
    if (!meaningful) return;
    // Never let automatic chart bookkeeping create a missing cloud document.
    if (db && sync.state !== 'synced' && sync.state !== 'syncing') return;
    const today = toISO(new Date());
    const hist = data.netWorthHistory || [];
    const todayEntry = hist.find(h => h.date === today);
    if (todayEntry && Math.abs(todayEntry.value - currentNetWorth) < 0.005) { nwRecordRef.current = { date: today, value: currentNetWorth }; return; }
    if (nwRecordRef.current.date === today && Math.abs(nwRecordRef.current.value - currentNetWorth) < 0.005) return;
    nwRecordRef.current = { date: today, value: currentNetWorth };
    mut(d => {
      d.netWorthHistory = (d.netWorthHistory || []).filter(h => h.date !== today);
      d.netWorthHistory.push({ date: today, value: currentNetWorth });
      d.netWorthHistoryVersion = 2;
      d.netWorthHistory.sort((a, b) => a.date.localeCompare(b.date));
      if (d.netWorthHistory.length > 180) d.netWorthHistory = d.netWorthHistory.slice(-180);
    });
  }, [currentNetWorth, data, mut, meaningful, sync.state]);

  if (!authed) return <Login onOk={() => setAuthed(true)} />;
  if (!data) return (
    <div className="boot">
      <div className="boot-inner" style={{ maxWidth:'440px', padding:'24px', textAlign:'center' }}>
        <div className="boot-logo">SV</div>
        {sync.state === 'error' ? <React.Fragment><div style={{ color:'var(--red)', fontWeight:700 }}>Your vault could not be loaded safely</div><div style={{ color:'var(--muted)', fontSize:'12px', lineHeight:1.6 }}>{sync.error || 'The cloud database returned an error. No empty data was written.'}</div><button className="btn btn-primary" onClick={() => window.location.reload()}>Try Again</button></React.Fragment> : <div>Loading your vault…</div>}
      </div>
    </div>
  );

  const props = { data, setData, mut, showToast, go: setPage, theme, setTheme, toggleTheme, sync, openTx };
  const NAV = [
    { id: 'home', label: 'Home', icon: Ico.home },
    { id: 'banks', label: 'Banks', icon: Ico.bank },
    { id: 'cards', label: 'Credit Cards', icon: Ico.card },
    { id: 'loans', label: 'Loans', icon: Ico.loan },
    { id: 'bills', label: 'Bills', icon: Ico.bill },
    { id: 'demat', label: 'Demat', icon: Ico.demat },
    { id: 'ai', label: 'Money Brain', icon: Ico.ai },
    { id: 'backup', label: 'Backup & Restore', icon: Ico.cloud },
    { id: 'profile', label: 'Profile', icon: Ico.user }
  ];

  return (
    <React.Fragment>
      <LightRaysBackground theme={theme} />
      <div className="app">
        <aside className="sidebar">
          <div className="brand"><div className="brand-logo">SV</div><div><div className="brand-name">ShubhVault</div><div className="brand-sub">MONEY TRACKER</div></div></div>
          {NAV.map(n => (<button key={n.id} className={'nav-item' + (page === n.id ? ' active' : '')} onClick={() => setPage(n.id)}><span className="nav-ico">{n.icon}</span><span>{n.label}</span></button>))}
          <div className="side-foot">
            <div style={{ padding: '10px 12px 6px' }}><SyncBadge sync={sync} /></div>
            <button className="nav-item" onClick={() => { sessionStorage.removeItem('fv_auth'); setAuthed(false); }}><span className="nav-ico">{Ico.logout}</span><span>Log Out</span></button>
          </div>
        </aside>
        <main className="main">
          {page === 'home' && <Home {...props} />}
          {page === 'banks' && <Banks {...props} />}
          {page === 'cards' && <Cards {...props} />}
          {page === 'loans' && <Loans {...props} />}
          {page === 'bills' && <Bills {...props} />}
          {page === 'demat' && <Demat {...props} />}
          {page === 'ai' && <AiBrain {...props} />}
          {page === 'backup' && <BackupRestore {...props} />}
          {page === 'profile' && <Profile {...props} />}
        </main>
        <nav className="mobile-nav">
          {NAV.map(n => (<button key={n.id} className={'mnav' + (page === n.id ? ' active' : '')} onClick={() => setPage(n.id)}>{n.icon}<span>{n.label}</span></button>))}
        </nav>
        <Toast msg={toast.msg} action={toast.action} onAction={toast.onAction} />
        <TxModal open={txOpen} onClose={() => { setTxOpen(false); setTxPrefill(null); }} banks={data.banks} cards={data.cards} prefill={txPrefill} onSave={saveTx} />
      </div>
    </React.Fragment>
  );
}

function Home({ data, mut, showToast, go, sync, openTx }) {
  const snapshot = useMemo(() => financialSnapshot(data), [data]);
  const bankTotal = snapshot.bankTotal;
  const dematTotal = snapshot.dematTotal;
  const cardDebt = snapshot.cardDebt;
  const loanDebt = snapshot.loanDebt;
  const scheduledLoanPayments = snapshot.scheduledLoanPayments;
  const assets = snapshot.assets;
  const liabilities = snapshot.liabilities;
  const netWorth = snapshot.netWorth;

  const [inflowTarget, setInflowTarget] = useState(null);
  const [withdrawHint, setWithdrawHint] = useState(null);
  const [withdrawHintAmt, setWithdrawHintAmt] = useState('');
  const [withdrawHintBank, setWithdrawHintBank] = useState(defaultBankId(data.banks));
  const [expandedGroups, setExpandedGroups] = useState({});

  const loanItems = useMemo(() => data.loans.filter(l => !l.closed).map(l => { const due = nextDueDate(l.dueDay || 5, l.paidCycles); return { kind: 'loan', ref: l, id: l.id, name: l.name, amount: r2(l.emi), due, days: daysUntil(due) }; }).sort((a, b) => a.due - b.due), [data.loans]);
  const cardItems = useMemo(() => data.cards.map(c => { const due = nextDueDate(c.dueDay || 10, c.paidCycles); return { kind: 'card', ref: c, id: c.id, name: c.name, amount: r2(c.outstanding), due, days: daysUntil(due) }; }).sort((a, b) => a.due - b.due), [data.cards]);
  const billItems = useMemo(() => data.bills.map(b => { const due = nextDueDate(b.dueDay || 1, b.paidCycles); return { kind: 'bill', ref: b, id: b.id, name: b.name, amount: r2(b.amount), due, days: daysUntil(due) }; }).sort((a, b) => a.due - b.due), [data.bills]);
  const inflowItems = useMemo(() => data.inflows.map(f => {
    const due = nextInflowDueDate(f);
    if (!due) return null;
    return { kind: 'inflow', ref: f, id: f.id, name: f.name, amount: r2(f.amount), due, days: daysUntil(due), recurring: f.recurring !== false };
  }).filter(Boolean).sort((a, b) => a.due - b.due), [data.inflows]);

  const feed = useMemo(() => [].concat(loanItems, cardItems, billItems, inflowItems).sort((a, b) => a.due - b.due), [loanItems, cardItems, billItems, inflowItems]);

  const groupedFeed = useMemo(() => {
    const map = {}; const order = [];
    feed.forEach(item => {
      const base = stripTrailingNumber(item.name);
      const kindGroup = item.kind === 'inflow' ? 'in' : 'out';
      const key = base ? (kindGroup + '|' + base.toLowerCase()) : null;
      if (key && map[key]) {
        map[key].items.push(item);
        if (item.due < map[key].due) map[key].due = item.due;
        if (item.days < map[key].days) map[key].days = item.days;
      } else {
        const newKey = key || ('single|' + item.kind + '|' + item.id);
        map[newKey] = { key: newKey, due: item.due, days: item.days, items: [item], baseName: base || item.name };
        order.push(newKey);
      }
    });
    return order.map(k => map[k]).sort((a, b) => a.due - b.due);
  }, [feed]);

  const nwPoints = useMemo(() => {
    const map = {};
    (data.netWorthHistory || []).forEach(h => {
      if (/^\d{4}-\d{2}-\d{2}$/.test(String(h.date || '')) && Number.isFinite(Number(h.value))) map[h.date] = r2(h.value);
    });
    const today = toISO(new Date());
    map[today] = netWorth;
    return Object.keys(map).sort().map(date => ({ date, value: map[date] }));
  }, [data.netWorthHistory, netWorth]);


  const planAhead = useMemo(() => {
    const today = startOfToday();
    const cutoff = new Date(today); cutoff.setDate(cutoff.getDate() + 5);
    const dues = [];
    data.loans.filter(l => !l.closed).forEach(l => { const due = nextDueDate(l.dueDay || 5, l.paidCycles); if (due >= today && due <= cutoff && Number(l.emi) > 0) dues.push({ kind: 'loan', name: l.name, amount: r2(l.emi), due, days: daysUntil(due) }); });
    data.cards.forEach(c => { const due = nextDueDate(c.dueDay || 10, c.paidCycles); if (due >= today && due <= cutoff && Number(c.outstanding) > 0) dues.push({ kind: 'card', name: c.name, amount: r2(c.outstanding), due, days: daysUntil(due) }); });
    data.bills.forEach(b => { const due = nextDueDate(b.dueDay || 1, b.paidCycles); if (due >= today && due <= cutoff && Number(b.amount) > 0) dues.push({ kind: 'bill', name: b.name, amount: r2(b.amount), due, days: daysUntil(due) }); });
    if (dues.length === 0) return [];
    dues.sort((a, b) => a.due - b.due);
    let runningBank = bankTotal;
    const usedInflowKeys = {};
    const result = [];
    dues.forEach(d => {
      let inflowSum = 0;
      data.inflows.forEach(f => {
        const iDue = nextInflowDueDate(f);
        if (iDue && iDue <= d.due) {
          const key = f.id + '|' + toISO(iDue);
          if (!usedInflowKeys[key]) { inflowSum += Number(f.amount) || 0; usedInflowKeys[key] = true; }
        }
      });
      const available = r2(runningBank + inflowSum);
      const needs = available < d.amount;
      if (needs) {
        const withdraw = r2(Math.max(0, d.amount - inflowSum));
        result.push({ ...d, needsWithdraw: true, withdraw, bankBefore: r2(runningBank), inflowsBefore: r2(inflowSum), available });
        runningBank = r2(runningBank + withdraw + inflowSum - d.amount);
      } else {
        result.push({ ...d, needsWithdraw: false, withdraw: 0, bankBefore: r2(runningBank), inflowsBefore: r2(inflowSum), available });
        runningBank = r2(available - d.amount);
      }
    });
    return result;
  }, [data, bankTotal]);

  const mk = monthKey(new Date());
  const monthTx = data.transactions.filter(t => String(t.date).startsWith(mk));
  const mIn = r2(monthTx.filter(t => t.dir === 'in').reduce((s, t) => s + (Number(t.amount) || 0), 0));
  const mOut = r2(monthTx.filter(t => t.dir === 'out').reduce((s, t) => s + (Number(t.amount) || 0), 0));

  const cycleOf = (item) => {
    if (item.kind === 'inflow' && item.recurring === false && item.ref.date) return item.ref.date;
    return monthKey(nextDueDate(item.ref.dueDay || item.ref.day || 1, item.ref.paidCycles || item.ref.receivedCycles));
  };

  const undoSkips = (skipped) => {
    mut(d => {
      skipped.forEach(({ kind, id, cycle }) => {
        let arr = null;
        if (kind === 'loan') arr = d.loans; else if (kind === 'card') arr = d.cards; else if (kind === 'bill') arr = d.bills; else if (kind === 'inflow') arr = d.inflows;
        if (!arr) return;
        const t = arr.find(x => x.id === id);
        if (!t) return;
        if (kind === 'inflow') t.receivedCycles = (t.receivedCycles || []).filter(c => c !== cycle);
        else t.paidCycles = (t.paidCycles || []).filter(c => c !== cycle);
      });
    });
  };
  const applySkips = (skipped) => {
    mut(d => {
      skipped.forEach(({ kind, id, cycle }) => {
        let arr = null;
        if (kind === 'loan') arr = d.loans; else if (kind === 'card') arr = d.cards; else if (kind === 'bill') arr = d.bills; else if (kind === 'inflow') arr = d.inflows;
        if (!arr) return;
        const t = arr.find(x => x.id === id);
        if (!t) return;
        if (kind === 'inflow') t.receivedCycles = (t.receivedCycles || []).concat([cycle]);
        else t.paidCycles = (t.paidCycles || []).concat([cycle]);
      });
    });
  };
  const markDone = (item) => {
    const cycle = cycleOf(item);
    mut(d => {
      if (item.kind === 'loan') { const t = d.loans.find(x => x.id === item.id); t.paidCycles = (t.paidCycles || []).concat([cycle]); }
      else if (item.kind === 'card') { const t = d.cards.find(x => x.id === item.id); t.paidCycles = (t.paidCycles || []).concat([cycle]); }
      else if (item.kind === 'bill') { const t = d.bills.find(x => x.id === item.id); t.paidCycles = (t.paidCycles || []).concat([cycle]); }
      else if (item.kind === 'inflow') { const t = d.inflows.find(x => x.id === item.id); t.receivedCycles = (t.receivedCycles || []).concat([cycle]); }
    });
    showToast('Marked done for this month');
  };
  const skipItem = (item) => {
    if (item.kind === 'inflow') return;
    const cycle = cycleOf(item);
    const skipped = [{ kind: item.kind, id: item.id, cycle }];
    applySkips(skipped);
    showToast(item.name + ' skipped · moved to next month', () => { undoSkips(skipped); showToast('Skip undone'); });
  };
  const markGroupDone = (group) => { group.items.filter(i => i.kind !== 'inflow').forEach(item => markDone(item)); };
  const skipGroup = (group) => {
    const skipped = group.items.filter(i => i.kind !== 'inflow').map(item => ({ kind: item.kind, id: item.id, cycle: cycleOf(item) }));
    if (!skipped.length) return;
    applySkips(skipped);
    showToast('Skipped ' + skipped.length + ' item' + (skipped.length !== 1 ? 's' : '') + ' · moved to next month', () => { undoSkips(skipped); showToast('Skips undone'); });
  };

  const openPay = (item) => {
    const cycle = monthKey(nextDueDate(item.ref.dueDay || 1, item.ref.paidCycles));
    openTx({
      bankId: defaultBankId(data.banks),
      dir: 'out',
      amount: String(item.amount),
      note: item.name + (item.kind === 'card' ? ' Card Payment' : item.kind === 'loan' ? ' EMI' : ' Bill Payment'),
      category: item.kind === 'card' ? 'Credit Card' : item.kind === 'loan' ? 'Loan EMI' : 'Bills',
      date: toISO(new Date()),
      affectsBalance: true,
      link: { type: item.kind, id: item.id, cycle, monthsAdvanced: item.kind === 'loan' ? 1 : undefined }
    });
  };

  const confirmInflow = (actualAmount, bankId, adjust) => {
    const f = inflowTarget;
    const amt = r2(actualAmount);
    const cycle = (f.recurring === false && f.ref.date) ? f.ref.date : monthKey(nextDueDate(f.ref.day || 1, f.ref.receivedCycles));
    mut(d => {
      const bank = d.banks.find(b => b.id === bankId);
      if (bank) bank.balance = r2(bank.balance + amt);
      d.transactions.push({ id: uid(), bankId, amount: amt, dir: 'in', note: f.name + ' received', category: 'Salary', date: toISO(new Date()), affectsBalance: true, ts: Date.now() });
      const inf = d.inflows.find(x => x.id === f.id);
      if (inf) { inf.receivedCycles = (inf.receivedCycles || []).concat([cycle]); if (adjust) inf.amount = amt; }
    });
    setInflowTarget(null);
    showToast('Money added to your bank');
  };

  const executeWithdraw = () => {
    if (!withdrawHint) return;
    const amt = r2(withdrawHintAmt);
    if (!amt || amt <= 0) { showToast('Enter a valid amount'); return; }
    const a0 = withdrawHint;
    let pickDemat = data.demats.find(x => Number(x.balance) >= amt);
    if (!pickDemat) pickDemat = data.demats[0];
    if (!pickDemat) { showToast('Add a demat account first'); return; }
    const txId = uid();
    mut(d => {
      const a = d.demats.find(x => x.id === pickDemat.id);
      const b = d.banks.find(x => x.id === withdrawHintBank);
      if (!a || !b) return;
      a.balance = r2(a.balance - amt);
      a.withdrawals = (a.withdrawals || []).concat([{ txId, date: toISO(new Date()), amount: amt }]);
      b.balance = r2(b.balance + amt);
      d.transactions.push({ id: txId, bankId: withdrawHintBank, amount: amt, dir: 'in', note: 'Withdrawn from ' + a.name + ' for ' + a0.name, category: 'Upstox Withdrawal', date: toISO(new Date()), affectsBalance: true, ts: Date.now(), link: { type: 'demat', id: a.id } });
    });
    setWithdrawHint(null);
    showToast('Money moved from Demat to your bank');
  };

  const renderItem = (item) => {
    const isIn = item.kind === 'inflow';
    const I = CategoryIcon({ kind: item.kind });
    const isOneTime = isIn && item.recurring === false;
    return (
      <div className="item" key={item.kind + item.id}>
        <div className="item-ico">{I}</div>
        <div className="item-body">
          <div className="item-name">{item.name}</div>
          <div className="item-meta">
            <span className={'pill ' + (isIn ? 'green' : item.days <= 3 ? 'red' : item.days <= 7 ? 'amber' : 'blue')}>
              <span className="pdot"></span>{isIn ? 'receiving ' + relDays(item.days) : 'due ' + relDays(item.days)}
            </span>
            <span>{fmtDate(item.due)}</span>
            {isOneTime ? <span className="pill">one-time</span> : null}
          </div>
        </div>
        <div style={{ textAlign: 'right' }}>
          <div className="item-amt" style={{ color: isIn ? 'var(--green)' : 'inherit' }}>{isIn ? '+' : ''}{inr(item.amount)}</div>
          <div className="item-actions" style={{ marginTop: '7px', justifyContent: 'flex-end' }}>
            {isIn ? (<button className="btn btn-sm btn-primary" onClick={() => setInflowTarget(item)}>Received?</button>) : (
              <React.Fragment>
                <button className="btn btn-sm btn-primary" onClick={() => openPay(item)}>Pay</button>
                <button className="btn btn-sm" onClick={() => markDone(item)}>Done</button>
                <button className="btn btn-sm btn-warn" onClick={() => skipItem(item)}>Skip</button>
              </React.Fragment>
            )}
          </div>
        </div>
      </div>
    );
  };

  const renderGroup = (group) => {
    if (group.items.length === 1) return renderItem(group.items[0]);
    const isExpanded = !!expandedGroups[group.key];
    const total = r2(group.items.reduce((s, i) => s + (Number(i.amount) || 0), 0));
    const allInflows = group.items.every(i => i.kind === 'inflow');
    const kinds = Array.from(new Set(group.items.map(i => i.kind)));
    const firstIco = allInflows ? Ico.down : (kinds.includes('loan') ? Ico.loan : kinds.includes('card') ? Ico.card : Ico.bill);
    const colorClass = allInflows ? 'green' : group.days <= 3 ? 'red' : group.days <= 7 ? 'amber' : 'blue';
    const baseName = group.baseName || group.items[0].name;
    return (
      <div key={group.key} className={'item group-item' + (isExpanded ? ' expanded' : '')}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 14, width: '100%', flexWrap: 'wrap' }} onClick={() => setExpandedGroups(e => ({ ...e, [group.key]: !e[group.key] }))}>
          <div className="item-ico" style={{ color: allInflows ? 'var(--green)' : 'inherit', cursor: 'pointer' }}>{firstIco}</div>
          <div className="item-body" style={{ minWidth: 0, flex: '1 1 260px' }}>
            <div className="item-name" style={{ display: 'flex', alignItems: 'center', gap: '7px' }}>
              <span className="expand-chev" style={{ color: 'var(--muted)' }}>{Ico.chev}</span>
              <span style={{ overflow: 'hidden', textOverflow: 'ellipsis' }}>{baseName} · {group.items.length} items</span>
            </div>
            <div className="item-meta" style={{ flexWrap: 'wrap' }}>
              <span className={'pill ' + colorClass}><span className="pdot"></span>{allInflows ? 'next receiving ' + relDays(group.days) : 'next due ' + relDays(group.days)}</span>
              <span style={{ whiteSpace: 'nowrap' }}>{fmtDate(group.due)}</span>
              <span className="pill"></span>
            </div>
          </div>
          <div style={{ textAlign: 'right', flexShrink: 0 }} onClick={e => e.stopPropagation()}>
            <div className="item-amt" style={{ color: allInflows ? 'var(--green)' : 'inherit', whiteSpace: 'nowrap' }}>{allInflows ? '+' : ''}{inr(total)}</div>
            <div className="item-actions" style={{ marginTop: '7px', justifyContent: 'flex-end', flexWrap: 'nowrap' }}>
              {!allInflows && (<React.Fragment>
                <button className="btn btn-sm" style={{ whiteSpace: 'nowrap' }} onClick={() => markGroupDone(group)}>Mark all done</button>
                <button className="btn btn-sm btn-warn" style={{ whiteSpace: 'nowrap' }} onClick={() => skipGroup(group)}>Skip all</button>
              </React.Fragment>)}
            </div>
          </div>
        </div>
        {isExpanded && (
          <div className="group-children" onClick={e => e.stopPropagation()}>
            {group.items.map(item => {
              const isIn = item.kind === 'inflow';
              const I = CategoryIcon({ kind: item.kind });
              const isOneTime = isIn && item.recurring === false;
              return (
                <div className="group-child" key={item.kind + item.id} style={{ flexWrap: 'wrap' }}>
                  <div className="item-ico" style={{ width: 30, height: 30, color: isIn ? 'var(--green)' : 'inherit', flexShrink: 0 }}>{I}</div>
                  <div style={{ flex: '1 1 160px', minWidth: 0 }}>
                    <div className="item-name" style={{ overflow: 'hidden', textOverflow: 'ellipsis' }}>{item.name}</div>
                    <div className="item-meta" style={{ marginTop: 3, flexWrap: 'wrap' }}>
                      <span className="pill" style={{ fontSize: '10px' }}>{item.kind === 'loan' ? 'Loan EMI' : item.kind === 'card' ? 'Credit Card' : item.kind === 'bill' ? 'Bill' : (isOneTime ? 'One-time' : 'Inflow')}</span>
                      <span style={{ whiteSpace: 'nowrap', fontSize: 11, color: 'var(--muted)' }}>due {fmtDate(item.due)}</span>
                    </div>
                  </div>
                  <div className="item-amt" style={{ fontSize: '13px', color: isIn ? 'var(--green)' : 'inherit', flexShrink: 0 }}>{isIn ? '+' : ''}{inr(item.amount)}</div>
                  <div className="item-actions" style={{ flexShrink: 0, flexWrap: 'nowrap' }}>
                    {isIn ? (<button className="btn btn-sm btn-primary" onClick={() => setInflowTarget(item)}>Received?</button>) : (
                      <React.Fragment>
                        <button className="btn btn-sm btn-primary" onClick={() => openPay(item)}>Pay</button>
                        <button className="btn btn-sm" onClick={() => markDone(item)}>Done</button>
                        <button className="btn btn-sm btn-warn" onClick={() => skipItem(item)}>Skip</button>
                      </React.Fragment>
                    )}
                  </div>
                </div>
              );
            })}
          </div>
        )}
      </div>
    );
  };

  const planNeedingWithdraw = planAhead.filter(p => p.needsWithdraw);

  return (
    <div>
      <PageHead title="Home" sync={sync} openTx={openTx} />

      <div className="grid g4">
        <div className="kpi glass"><div className="kpi-head"><span className="kpi-dot accent"></span><span className="kpi-label">Total Bank Balance</span></div><div className="kpi-val amount-positive">{inr(bankTotal)}</div><div className="kpi-note">{data.banks.length} bank account{data.banks.length > 1 ? 's' : ''}</div></div>
        <div className="kpi glass"><div className="kpi-head"><span className="kpi-dot green"></span><span className="kpi-label">Demat Value</span></div><div className="kpi-val amount-positive">{inr(dematTotal)}</div><div className="kpi-note">{data.demats.length} demat account{data.demats.length > 1 ? 's' : ''}</div></div>
        <div className="kpi glass"><div className="kpi-head"><span className="kpi-dot red"></span><span className="kpi-label">Total Money Owed</span></div><div className="kpi-val amount-negative">{inr(liabilities)}</div><div className="kpi-note">Loans {inr(loanDebt)} · Cards {inr(cardDebt)}</div></div>
        <div className="kpi glass"><div className="kpi-head"><span className="kpi-dot amber"></span><span className="kpi-label">Net Worth</span></div><div className="kpi-val" style={{ color: netWorth >= 0 ? 'var(--green)' : 'var(--red)' }}>{inr(netWorth)}</div><div className="kpi-note">Assets {inr(assets)} − Debts {inr(liabilities)}</div></div>
      </div>

      <div className="section-head">
        <div className="section-title"><span className="dot"></span>Net Worth Progress</div>
        <div style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
          
          
        </div>
      </div>
      <div className="glass" style={{ padding: '20px' }}><NetWorthChart points={nwPoints} /></div>

      {planNeedingWithdraw.length > 0 ? (
        <React.Fragment>
          <div className="section-head"><div className="section-title"><span className="dot"></span>Plan Ahead — withdrawals needed from Demat</div><span className="pill amber"><span className="pdot"></span>action in next 5 days</span></div>
          <div className="glass plan-box" style={{ padding: '16px' }}>
            {planNeedingWithdraw.map((p, i) => (
              <div className="plan-item" key={i}>
                <div className="item-ico" style={{ color: 'var(--amber)' }}>{CategoryIcon({ kind: p.kind })}</div>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', flexWrap: 'wrap', gap: '10px' }}>
                    <div>
                      <div className="item-name">{p.name}</div>
                      <div className="item-meta">
                        <span className={'pill ' + (p.days <= 2 ? 'red' : p.days <= 4 ? 'amber' : 'blue')}><span className="pdot"></span>due {relDays(p.days)}</span>
                        <span>{fmtDate(p.due)}</span>
                        <span className="pill">due amount {inr(p.amount)}</span>
                      </div>
                    </div>
                    <div style={{ textAlign: 'right' }}>
                      <div className="plan-amt">{inr(p.withdraw)}</div>
                      <div style={{ fontSize: '10.5px', color: 'var(--muted)', marginTop: '3px', letterSpacing: '.3px', textTransform: 'uppercase', fontWeight: 600 }}>withdraw from demat</div>
                    </div>
                  </div>
                  <div className="plan-action">Bank has <b style={{ color: 'var(--txt-2)' }}>{inr(p.bankBefore)}</b>{p.inflowsBefore > 0 ? <React.Fragment> · inflows before due <b style={{ color: 'var(--green)' }}>{inr(p.inflowsBefore)}</b></React.Fragment> : null}{' '}· after withdrawal + payment, your bank keeps <b style={{ color: 'var(--txt-2)' }}>{inr(p.bankBefore)}</b> as buffer</div>
                  <div style={{ marginTop: '10px', display: 'flex', gap: '6px', flexWrap: 'wrap' }}><button className="btn btn-sm btn-primary" onClick={() => { setWithdrawHint(p); setWithdrawHintAmt(String(p.withdraw)); setWithdrawHintBank(defaultBankId(data.banks)); }}>Move {inr(p.withdraw)} now</button></div>
                </div>
              </div>
            ))}
          </div>
        </React.Fragment>
      ) : planAhead.length > 0 ? (
        <React.Fragment>
          <div className="section-head"><div className="section-title"><span className="dot"></span>Plan Ahead — next 5 days</div><span className="pill green"><span className="pdot"></span>all covered</span></div>
          <div className="glass" style={{ padding: '14px' }}><div style={{ padding: '6px 4px', fontSize: '13px', color: 'var(--muted)', lineHeight: 1.6 }}>You have upcoming dues in the next 5 days but your bank balance covers them. {planAhead.length} item{planAhead.length !== 1 ? 's' : ''} due · total {inr(r2(planAhead.reduce((s, p) => s + p.amount, 0)))}. No demat withdrawal needed right now.</div></div>
        </React.Fragment>
      ) : null}

      <div className="section-head"><div className="section-title"><span className="dot"></span>Notifications — everything coming up</div><span className="pill blue">{feed.length} item{feed.length !== 1 ? 's' : ''} · {groupedFeed.length} group{groupedFeed.length !== 1 ? 's' : ''}</span></div>
      <div className="glass" style={{ padding: '14px' }}>
        {feed.length === 0 ? (<EmptyState icon={Ico.inbox} title="Nothing coming up" />) : (<div className="list">{groupedFeed.map(renderGroup)}</div>)}
      </div>

      <div className="section-head"><div className="section-title"><span className="dot"></span>Loans — remaining <b>{inr(loanDebt)}</b></div><button className="btn btn-sm" onClick={() => go('loans')}>Manage</button></div>
      <div className="glass" style={{ padding: '14px' }}>
        {loanItems.length === 0 ? (<EmptyState icon={Ico.loan} title="No loans added yet" action={<button className="btn btn-sm btn-primary" onClick={() => go('loans')}>Add your first loan</button>} />) : (<div className="list">{loanItems.map(renderItem)}</div>)}
      </div>

      <div className="section-head"><div className="section-title"><span className="dot"></span>Credit Cards — total <b>{inr(cardDebt)}</b></div><button className="btn btn-sm" onClick={() => go('cards')}>Manage</button></div>
      <div className="glass" style={{ padding: '14px' }}>
        {cardItems.length === 0 ? (<EmptyState icon={Ico.card} title="No credit cards added yet" action={<button className="btn btn-sm btn-primary" onClick={() => go('cards')}>Add your first card</button>} />) : (<div className="list">{cardItems.map(renderItem)}</div>)}
      </div>

      {billItems.length > 0 && (
        <React.Fragment>
          <div className="section-head"><div className="section-title"><span className="dot"></span>Other Bills &amp; Subscriptions</div></div>
          <div className="glass" style={{ padding: '14px' }}><div className="list">{billItems.map(renderItem)}</div></div>
        </React.Fragment>
      )}

      <div className="section-head"><div className="section-title"><span className="dot"></span>Money Coming In</div><button className="btn btn-sm" onClick={() => go('bills')}>Manage</button></div>
      <div className="glass" style={{ padding: '14px' }}>
        {inflowItems.length === 0 ? (<EmptyState icon={Ico.down} title="No incoming payments yet" action={<button className="btn btn-sm btn-primary" onClick={() => go('bills')}>Add income</button>} />) : (<div className="list">{inflowItems.map(renderItem)}</div>)}
      </div>

      <div className="section-head"><div className="section-title"><span className="dot"></span>This Month</div><span className="pill">{MONTHS_FULL[new Date().getMonth()] + ' ' + new Date().getFullYear()}</span></div>
      <div className="grid g2">
        <div className="kpi glass spotlight green"><div className="kpi-head"><span className="kpi-dot green"></span><span className="kpi-label">Money In</span></div><div className="kpi-val" style={{ color: 'var(--green)' }}>{inr(mIn)}</div></div>
        <div className="kpi glass spotlight red"><div className="kpi-head"><span className="kpi-dot red"></span><span className="kpi-label">Money Out</span></div><div className="kpi-val" style={{ color: 'var(--red)' }}>{inr(mOut)}</div></div>
      </div>
      <div className="glass" style={{ padding: '14px 18px', marginTop: '14px', display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: '10px' }}>
        <div className="kpi-label">Net this month</div>
        <div style={{ fontSize: '17px', fontWeight: 700, letterSpacing: '-.4px', color: r2(mIn - mOut) >= 0 ? 'var(--green)' : 'var(--red)' }} className="mono">{inr(r2(mIn - mOut))}</div>
      </div>

      <InflowModal target={inflowTarget} data={data} onClose={() => setInflowTarget(null)} onConfirm={confirmInflow} />

      <Modal open={!!withdrawHint} onClose={() => setWithdrawHint(null)} title={withdrawHint ? 'Withdraw for ' + withdrawHint.name : ''} onSubmit={executeWithdraw}>
        {withdrawHint && (
          <div>
            <div className="glass-soft" style={{ padding: '13px 15px', marginBottom: '16px' }}>
              <div className="kpi-label">Suggested amount from Demat</div>
              <div style={{ fontSize: '20px', fontWeight: 700, marginTop: '5px', letterSpacing: '-.4px', color: 'var(--amber)' }} className="mono">{inr(withdrawHint.withdraw)}</div>
              <div style={{ fontSize: '12px', color: 'var(--muted)', marginTop: '6px', lineHeight: 1.5 }}>Due {fmtDate(withdrawHint.due)} · Due amount {inr(withdrawHint.amount)} · Bank currently {inr(withdrawHint.bankBefore)}</div>
            </div>
            <div className="field"><label className="label">Amount to withdraw</label><MoneyInput value={withdrawHintAmt} onChange={setWithdrawHintAmt} /></div>
            <div className="field"><label className="label">Add to which bank?</label>
              <select className="select" value={withdrawHintBank} onChange={(e) => setWithdrawHintBank(e.target.value)}>{data.banks.map(b => <option key={b.id} value={b.id}>{b.name} — {inr(b.balance)}</option>)}</select>
            </div>
            <button className="btn btn-primary" style={{ width: '100%', justifyContent: 'center', padding: '11px' }} onClick={executeWithdraw}>Move {inr(withdrawHintAmt || 0)} to bank</button>
          </div>
        )}
      </Modal>
    </div>
  );
}

function InflowModal({ target, data, onClose, onConfirm }) {
  const [amt, setAmt] = useState('');
  const [bank, setBank] = useState(defaultBankId(data.banks));
  const [adjust, setAdjust] = useState(false);
  useEffect(() => { if (target) { setAmt(String(target.amount)); setAdjust(false); setBank(defaultBankId(data.banks)); } }, [target]);
  if (!target) return null;
  const submit = () => onConfirm(amt, bank, adjust);
  return (
    <Modal open={!!target} onClose={onClose} title={'Did you receive ' + target.name + '?'} onSubmit={submit}>
      <div className="glass-soft" style={{ padding: '13px 15px', marginBottom: '16px' }}>
        <div className="kpi-label">Expected Amount</div>
        <div style={{ fontSize: '20px', fontWeight: 700, marginTop: '5px', letterSpacing: '-.4px' }} className="mono">{inr(target.amount)}</div>
        <div style={{ fontSize: '12px', color: 'var(--muted)', marginTop: '5px' }}>Expected {fmtDate(target.due)}{target.recurring === false ? ' · one-time' : ''}</div>
      </div>
      <div className="field"><label className="label">How much did you actually get?</label><MoneyInput value={amt} onChange={setAmt} /></div>
      <div className="switch" onClick={() => setAdjust(a => !a)}>
        <div className={'switch-track' + (adjust ? ' on' : '')}><div className="switch-knob"></div></div>
        <div className="switch-lbl">Update the expected amount to this new value for future months</div>
      </div>
      <div className="field" style={{ marginTop: '8px' }}>
        <label className="label">Add to which bank?</label>
        <select className="select" value={bank} onChange={(e) => setBank(e.target.value)}>{data.banks.map(b => <option key={b.id} value={b.id}>{b.name} — {inr(b.balance)}</option>)}</select>
      </div>
      <button className="btn btn-primary" style={{ width: '100%', justifyContent: 'center', padding: '11px' }} onClick={submit}>Yes, I received it</button>
    </Modal>
  );
}

function Banks({ data, mut, showToast, sync, openTx }) {
  const [txOpen, setTxOpen] = useState(false);
  const [editTx, setEditTx] = useState(null);
  const [bankOpen, setBankOpen] = useState(false);
  const [editBank, setEditBank] = useState(null);
  const [transferOpen, setTransferOpen] = useState(false);
  const [confirmDel, setConfirmDel] = useState(null);
  const [search, setSearch] = useState('');
  const [chartRange, setChartRange] = useState('month');

  const total = data.banks.reduce((s, b) => s + (Number(b.balance) || 0), 0);

  const scopedTx = useMemo(() => {
    if (chartRange === 'all') return data.transactions;
    const mk = monthKey(new Date());
    return data.transactions.filter(t => String(t.date).startsWith(mk));
  }, [data.transactions, chartRange]);

  const outCategories = useMemo(() => {
    const totals = {}; let overall = 0;
    scopedTx.forEach(t => {
      if (t.dir !== 'out') return;
      const c = t.category || 'Other';
      const amt = Number(t.amount) || 0;
      totals[c] = r2((totals[c] || 0) + amt);
      overall += amt;
    });
    const arr = Object.keys(totals).map(k => ({ name: k, amount: totals[k], pct: overall > 0 ? r2((totals[k] / overall) * 100) : 0 }));
    arr.sort((a, b) => b.amount - a.amount);
    return { items: arr, total: r2(overall) };
  }, [scopedTx]);

  const inCategories = useMemo(() => {
    const totals = {}; let overall = 0;
    scopedTx.forEach(t => {
      if (t.dir !== 'in') return;
      const c = t.category || 'Other';
      const amt = Number(t.amount) || 0;
      totals[c] = r2((totals[c] || 0) + amt);
      overall += amt;
    });
    const arr = Object.keys(totals).map(k => ({ name: k, amount: totals[k], pct: overall > 0 ? r2((totals[k] / overall) * 100) : 0 }));
    arr.sort((a, b) => b.amount - a.amount);
    return { items: arr, total: r2(overall) };
  }, [scopedTx]);

  const filtered = useMemo(() => {
    const q = search.trim().toLowerCase();
    if (!q) return data.transactions;
    return data.transactions.filter(t => {
      const bank = data.banks.find(b => b.id === t.bankId);
      return (t.note || '').toLowerCase().includes(q)
        || (t.category || '').toLowerCase().includes(q)
        || String(t.amount).includes(q)
        || (t.date || '').includes(q)
        || (bank && bank.name.toLowerCase().includes(q));
    });
  }, [data.transactions, data.banks, search]);

  const grouped = useMemo(() => {
    const list = filtered.slice().sort((a, b) => {
      const c = String(b.date).localeCompare(String(a.date));
      if (c !== 0) return c;
      return (b.ts || 0) - (a.ts || 0);
    });
    const years = []; const yearMap = {};
    list.forEach(t => {
      const d = parseISO(t.date);
      const y = d.getFullYear();
      const mIdx = d.getMonth();
      const dKey = toISO(d);
      if (!yearMap[y]) { yearMap[y] = { year: y, months: [], monthMap: {} }; years.push(yearMap[y]); }
      const ym = yearMap[y];
      if (!ym.monthMap[mIdx]) { ym.monthMap[mIdx] = { month: mIdx, days: [], dayMap: {} }; ym.months.push(ym.monthMap[mIdx]); }
      const mm = ym.monthMap[mIdx];
      if (!mm.dayMap[dKey]) { mm.dayMap[dKey] = { date: dKey, items: [] }; mm.days.push(mm.dayMap[dKey]); }
      mm.dayMap[dKey].items.push(t);
    });
    years.sort((a, b) => b.year - a.year);
    years.forEach(y => {
      y.months.sort((a, b) => b.month - a.month);
      y.months.forEach(m => { m.days.sort((a, b) => b.date.localeCompare(a.date)); });
    });
    return years;
  }, [filtered]);

  const saveBank = (name, balance, id) => {
    mut(d => {
      if (id) { const b = d.banks.find(x => x.id === id); if (b) { b.name = name; b.balance = r2(balance); } }
      else d.banks.push({ id: uid(), name, balance: r2(balance) });
    });
    setBankOpen(false); setEditBank(null);
    showToast(id ? 'Bank updated' : 'Bank added');
  };

  const deleteBank = (id) => { mut(d => { d.banks = d.banks.filter(b => b.id !== id); d.transactions = d.transactions.filter(t => t.bankId !== id); }); setConfirmDel(null); showToast('Bank removed'); };

  const saveTx = (payload, id) => {
    mut(d => {
      if (id) {
        const old = d.transactions.find(t => t.id === id);
        if (old && old.affectsBalance && old.bankId) { const ob = d.banks.find(b => b.id === old.bankId); if (ob) ob.balance = r2(ob.balance - (old.dir === 'in' ? old.amount : -old.amount)); }
        if (old) { reverseTxLink(d, old); const newLink = payload.link !== undefined ? payload.link : null; Object.assign(old, payload); if (newLink) old.link = newLink; else delete old.link; }
        const t = d.transactions.find(x => x.id === id);
        if (t) {
          if (t.affectsBalance && t.bankId) { const nb = d.banks.find(b => b.id === t.bankId); if (nb) nb.balance = r2(nb.balance + (t.dir === 'in' ? t.amount : -t.amount)); }
          applyTxLink(d, t);
        }
      } else {
        const t = Object.assign({ id: uid(), ts: Date.now() }, payload);
        d.transactions.push(t);
        if (t.affectsBalance && t.bankId) { const nb = d.banks.find(b => b.id === t.bankId); if (nb) nb.balance = r2(nb.balance + (t.dir === 'in' ? t.amount : -t.amount)); }
        applyTxLink(d, t);
      }
    });
    setTxOpen(false); setEditTx(null);
    showToast(id ? 'Transaction updated' : 'Transaction added');
  };

  const deleteTx = (id) => {
    mut(d => {
      const t = d.transactions.find(x => x.id === id);
      if (t) {
        if (t.affectsBalance && t.bankId) { const b = d.banks.find(x => x.id === t.bankId); if (b) b.balance = r2(b.balance - (t.dir === 'in' ? t.amount : -t.amount)); }
        reverseTxLink(d, t);
      }
      d.transactions = d.transactions.filter(x => x.id !== id);
    });
    showToast('Transaction deleted');
  };

  const doTransfer = (from, to, amount) => {
    const amt = r2(amount);
    if (!from || !to || from === to || !amt || amt <= 0) { showToast('Check the transfer details'); return false; }
    mut(d => {
      const fb = d.banks.find(b => b.id === from); const tb = d.banks.find(b => b.id === to);
      if (!fb || !tb) return;
      fb.balance = r2(fb.balance - amt); tb.balance = r2(tb.balance + amt);
      d.transactions.push({ id: uid(), bankId: from, amount: amt, dir: 'out', note: 'Transfer to ' + tb.name, category: 'Transfer', date: toISO(new Date()), affectsBalance: true, ts: Date.now() });
      d.transactions.push({ id: uid(), bankId: to, amount: amt, dir: 'in', note: 'Transfer from ' + fb.name, category: 'Transfer', date: toISO(new Date()), affectsBalance: true, ts: Date.now() + 1 });
    });
    setTransferOpen(false); showToast('Transfer done');
    return true;
  };

  return (
    <div>
      <PageHead title="Bank Accounts" sync={sync} openTx={openTx}>
        <button className="btn btn-sm btn-primary" onClick={() => setTransferOpen(true)}>Transfer</button>
        <button className="btn btn-sm" onClick={() => { setEditBank(null); setBankOpen(true); }}>Add Bank</button>
      </PageHead>

      <div className="kpi glass spotlight" style={{ marginBottom: '18px' }}><div className="kpi-head"><span className="kpi-dot accent"></span><span className="kpi-label">Total Balance Across All Banks</span></div><div className="kpi-val" style={{ fontSize: '28px', marginTop: '10px' }}>{inr(total)}</div></div>

      <div className="grid g3">
        {data.banks.map(b => (
          <div className="glass" style={{ padding: '16px' }} key={b.id}>
            <div className="kpi-label">{b.name}</div>
            <div style={{ fontSize: '20px', fontWeight: 700, marginTop: '8px', letterSpacing: '-.5px', color: 'var(--green)' }} className="mono">{inr(b.balance)}</div>
            <div className="item-actions" style={{ marginTop: '14px' }}><button className="btn btn-sm" onClick={() => { setEditBank(b); setBankOpen(true); }}>Edit</button><button className="btn btn-sm btn-danger" onClick={() => setConfirmDel(b)}>Delete</button></div>
          </div>
        ))}
      </div>

      <div className="section-head">
        <div className="section-title"><span className="dot"></span>Money Movement — by category</div>
        <div className="seg">
          <button className={'seg-btn' + (chartRange === 'month' ? ' active' : '')} onClick={() => setChartRange('month')}>This month</button>
          <button className={'seg-btn' + (chartRange === 'all' ? ' active' : '')} onClick={() => setChartRange('all')}>All time</button>
        </div>
      </div>

      <div className="pie-grid">
        <div className="glass pie-card">
          <div className="pie-card-head">
            <div className="pie-card-title"><span className="pie-dot out"></span>Money Out</div>
            <div className="pie-card-total" style={{ color: 'var(--red)' }}>{inr(outCategories.total)}</div>
          </div>
          <div className="pie-body">
            <div className="pie-visual"><DonutChart items={outCategories.items} total={outCategories.total} /></div>
            <div className="pie-legend">
              {outCategories.items.length === 0 ? (<div style={{ color: 'var(--muted)', fontSize: 12, padding: '10px 0' }}>No data</div>) : outCategories.items.map((c, i) => (
                <div className="legend-row" key={c.name}>
                  <span className="legend-dot" style={{ background: PIE_COLORS[i % PIE_COLORS.length] }}></span>
                  <span className="legend-name" title={c.name}>{c.name}</span>
                  <span className="legend-amt">{inr(c.amount)}</span>
                  <span className="legend-pct">{c.pct}%</span>
                </div>
              ))}
            </div>
          </div>
        </div>

        <div className="glass pie-card">
          <div className="pie-card-head">
            <div className="pie-card-title"><span className="pie-dot in"></span>Money In</div>
            <div className="pie-card-total" style={{ color: 'var(--green)' }}>{inr(inCategories.total)}</div>
          </div>
          <div className="pie-body">
            <div className="pie-visual"><DonutChart items={inCategories.items} total={inCategories.total} /></div>
            <div className="pie-legend">
              {inCategories.items.length === 0 ? (<div style={{ color: 'var(--muted)', fontSize: 12, padding: '10px 0' }}>No data</div>) : inCategories.items.map((c, i) => (
                <div className="legend-row" key={c.name}>
                  <span className="legend-dot" style={{ background: PIE_COLORS[i % PIE_COLORS.length] }}></span>
                  <span className="legend-name" title={c.name}>{c.name}</span>
                  <span className="legend-amt">{inr(c.amount)}</span>
                  <span className="legend-pct">{c.pct}%</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      </div>

      <div className="section-head">
        <div className="section-title"><span className="dot"></span>Transaction Log</div>
        <div style={{ display: 'flex', gap: '8px', alignItems: 'center', flexWrap: 'wrap' }}>
          <div className="search-wrap">
            <span className="search-ico">{Ico.search}</span>
            <input className="input" value={search} onChange={(e) => setSearch(e.target.value)} placeholder="Search transactions…" />
            {search ? (<button className="search-clear" onClick={() => setSearch('')}>{Ico.close}</button>) : null}
          </div>
          <span className="pill">{filtered.length}{search ? ' of ' + data.transactions.length : ''} entries</span>
        </div>
      </div>

      {grouped.length === 0 ? (
        <div className="glass"><EmptyState icon={Ico.inbox} title={search ? 'No matching transactions' : 'No transactions yet'} action={!search ? <button className="btn btn-sm btn-primary" onClick={() => openTx()}>Add transaction</button> : null} /></div>
      ) : (
        grouped.map(ydata => (
          <div className="log-year" key={ydata.year}>
            <div className="log-year-head"><span className="log-year-num">{ydata.year}</span></div>
            {ydata.months.map(mdata => {
              const monthCount = mdata.days.reduce((s, d) => s + d.items.length, 0);
              const monthTotal = mdata.days.reduce((s, d) => s + d.items.reduce((ss, it) => ss + (it.dir === 'in' ? Number(it.amount) : -Number(it.amount)), 0), 0);
              return (
                <div className="log-month" key={mdata.month}>
                  <div className="log-month-head">
                    <span>{MONTHS_FULL[mdata.month]}</span>
                    <span className="log-month-count">{monthCount} entr{monthCount === 1 ? 'y' : 'ies'}</span>
                    <span className={'pill ' + (monthTotal >= 0 ? 'green' : 'red')} style={{ marginLeft: 'auto' }}>
                      {monthTotal >= 0 ? '+' : '−'}{inr(Math.abs(monthTotal))}
                    </span>
                  </div>
                  {mdata.days.map(day => (
                    <div className="log-day" key={day.date}>
                      <div className="log-day-head">{fmtDate(day.date)}</div>
                      {day.items.map(t => {
                        const bank = data.banks.find(b => b.id === t.bankId);
                        const I = t.dir === 'in' ? Ico.down : Ico.up;
                        return (
                          <div className="tx" key={t.id}>
                            <div className="item-ico" style={{ color: t.dir === 'in' ? 'var(--green)' : 'var(--red)' }}>{I}</div>
                            <div className="item-body"><div className="item-name">{t.note || t.category || 'Transaction'}</div><div className="item-meta"><span>{t.paymentMode === 'card' && t.cardId ? ((data.cards.find(c=>c.id===t.cardId)||{}).name || 'Credit Card') : (bank ? bank.name : 'No bank')}</span>{t.paymentMode === 'card' ? <span className="pill blue">Credit Card</span> : null}{t.category ? <span className="pill">{t.category}</span> : null}{t.link ? <span className="pill blue">linked</span> : null}{!t.affectsBalance ? <span className="pill amber">balance not changed</span> : null}</div></div>
                            <div className="item-amt" style={{ color: t.dir === 'in' ? 'var(--green)' : 'var(--red)' }}>{t.dir === 'in' ? '+' : '−'}{inr(t.amount)}</div>
                            <div className="item-actions"><button className="btn btn-sm" onClick={() => { setEditTx(t); setTxOpen(true); }}>Edit</button><button className="btn btn-sm btn-danger" onClick={() => deleteTx(t.id)}>Delete</button></div>
                          </div>
                        );
                      })}
                    </div>
                  ))}
                </div>
              );
            })}
          </div>
        ))
      )}

      <TxModal open={txOpen} onClose={() => { setTxOpen(false); setEditTx(null); }} banks={data.banks} cards={data.cards} tx={editTx} onSave={saveTx} />
      <BankModal open={bankOpen} onClose={() => { setBankOpen(false); setEditBank(null); }} bank={editBank} onSave={saveBank} />

function TxModal({ open, onClose, banks, cards, tx, prefill, onSave }) {
  const [bankId, setBankId] = useState('');
  const [cardId, setCardId] = useState('');
  const [paymentMode, setPaymentMode] = useState('bank');
  const [dir, setDir] = useState('out');
  const [amount, setAmount] = useState('');
  const [note, setNote] = useState('');
  const [category, setCategory] = useState('Food');
  const [date, setDate] = useState(toISO(new Date()));
  const [affects, setAffects] = useState(true);
  const IN_CATEGORIES=['Salary','Interest','Cashback','Upstox Withdrawal','UPI','Cash','Transfer','Investment','Other'];
  const OUT_CATEGORIES=['Food','Transportation','Rent','Shopping','Bills','Credit Card','Loan EMI','Travel','Medical','Investment','Transfer','Cash','Other'];

  useEffect(() => {
    if (!open) return;
    if (tx) {
      const inferredMode = tx.paymentMode || (tx.cardId ? 'card' : 'bank');
      setBankId(tx.bankId || defaultBankId(banks)); setCardId(tx.cardId || ''); setPaymentMode(inferredMode);
      setDir(tx.dir || 'out'); setAmount(String(tx.amount || '')); setNote(tx.note || ''); setCategory(tx.category || (tx.dir === 'in' ? 'Salary' : 'Food')); setDate(tx.date || toISO(new Date())); setAffects(tx.affectsBalance !== false);
    } else if (prefill) {
      const inferredMode = prefill.paymentMode || 'bank';
      setBankId(prefill.bankId || defaultBankId(banks)); setCardId(prefill.cardId || ''); setPaymentMode(inferredMode);
      setDir(prefill.dir || 'out'); setAmount(prefill.amount || ''); setNote(prefill.note || ''); setCategory(prefill.category || 'Food'); setDate(prefill.date || toISO(new Date())); setAffects(prefill.affectsBalance !== false);
    } else {
      setBankId(defaultBankId(banks)); setCardId(cards && cards[0] ? cards[0].id : ''); setPaymentMode('bank'); setDir('out'); setAmount(''); setNote(''); setCategory('Food'); setDate(toISO(new Date())); setAffects(true);
    }
  }, [open, tx, prefill, banks, cards]);

  if (!open) return null;
  const switchDir = next => { setDir(next); if (next === 'in') { setPaymentMode('bank'); setAffects(true); setCategory('Salary'); } else setCategory('Food'); };
  const chooseMode = mode => { setPaymentMode(mode); if (mode === 'card') setAffects(false); else setAffects(true); };
  const submit = () => {
    const amt=r2(amount); if (!amt || amt<=0) return;
    if (dir === 'out' && paymentMode === 'card' && !cardId) return;
    const payload={ bankId: paymentMode==='bank' ? bankId : '', cardId: dir==='out' && paymentMode==='card' ? cardId : '', paymentMode: dir==='out' ? paymentMode : 'bank', dir, amount:amt, note, category, date, affectsBalance: dir==='out' && paymentMode==='card' ? false : affects };
    if (dir==='out' && paymentMode==='card' && cardId) payload.link={ type:'cardPurchase', id:cardId };
    else if (tx && tx.link) payload.link=tx.link;
    else if (prefill && prefill.link) payload.link=prefill.link;
    onSave(payload, tx ? tx.id : null);
  };
  let activeCategories=dir==='in'?IN_CATEGORIES:OUT_CATEGORIES;
  if(category && !activeCategories.includes(category)) activeCategories=[...activeCategories,category];
  const selectedCard=cards && cards.find(c=>c.id===cardId);
  return <Modal open={open} onClose={onClose} title={tx?'Edit Transaction':'Add Transaction'} onSubmit={submit}>
    <div className="field"><label className="label">Money movement</label><div className="seg seg-full"><button type="button" className={'seg-btn'+(dir==='out'?' active':'')} onClick={()=>switchDir('out')}>Expense / Out</button><button type="button" className={'seg-btn'+(dir==='in'?' active':'')} onClick={()=>switchDir('in')}>Income / In</button></div></div>
    <div className="row2"><div className="field"><label className="label">Amount</label><MoneyInput value={amount} onChange={setAmount} autoFocus /></div><div className="field"><label className="label">Date</label><input className="input" type="date" value={date} onChange={e=>setDate(e.target.value)} /></div></div>
    {dir==='out' ? <div className="field"><label className="label">Payment mode</label><div className="payment-mode-grid"><button type="button" className={'payment-mode'+(paymentMode==='bank'?' active':'')} onClick={()=>chooseMode('bank')}>{Ico.bank}<span>Bank</span></button><button type="button" className={'payment-mode'+(paymentMode==='card'?' active':'')} onClick={()=>chooseMode('card')}>{Ico.card}<span>Credit Card</span></button></div></div> : null}
    {dir==='out' && paymentMode==='card' ? <div className="field"><label className="label">Credit card</label>{cards && cards.length ? <><select className="select" value={cardId} onChange={e=>setCardId(e.target.value)}>{cards.map(c=><option key={c.id} value={c.id}>{c.name} · {inr(c.outstanding)} outstanding</option>)}</select></> : <div className="empty-inline">Add a credit card first from Credit Cards.</div>}</div> : <div className="field"><label className="label">Bank account</label><select className="select" value={bankId} onChange={e=>setBankId(e.target.value)}>{banks.map(b=><option key={b.id} value={b.id}>{b.name}</option>)}</select></div>}
    <div className="field"><label className="label">Note</label><input className="input" value={note} onChange={e=>setNote(e.target.value)} /></div>
    <div className="field"><label className="label">Category</label><select className="select" value={category} onChange={e=>setCategory(e.target.value)}>{activeCategories.map(c=><option key={c} value={c}>{c}</option>)}</select></div>
    {!(dir==='out' && paymentMode==='card') ? <div className="switch" onClick={()=>setAffects(a=>!a)}><div className={'switch-track'+(affects?' on':'')}><div className="switch-knob"></div></div><div className="switch-lbl">Adjust {dir==='in'?'bank':'bank'} balance with this transaction</div></div> : null}
    <button className="btn btn-primary" style={{width:'100%',justifyContent:'center',marginTop:'10px',padding:'12px'}} onClick={submit}>{tx?'Save Changes':'Add Transaction'}</button>
  </Modal>;
}

function TransferModal({ open, onClose, banks, onTransfer }) {
  const [from, setFrom] = useState('');
  const [to, setTo] = useState('');
  const [amount, setAmount] = useState('');
  useEffect(() => {
    if (open) {
      const f = defaultBankId(banks);
      const firstOther = banks.find(b => b.id !== f);
      setFrom(f);
      setTo(firstOther ? firstOther.id : '');
      setAmount('');
    }
  }, [open, banks]);
  if (!open) return null;

  const submit = () => {
    const ok = onTransfer(from, to, amount);
    if (ok) onClose();
  };
  return (
    <Modal open={open} onClose={onClose} title="Transfer Between Banks" onSubmit={submit}>
      <div className="field"><label className="label">From</label>
        <select className="select" value={from} onChange={(e) => { const v = e.target.value; setFrom(v); if (v === to) { const alt = banks.find(b => b.id !== v); setTo(alt ? alt.id : ''); } }}>{banks.map(b => <option key={b.id} value={b.id}>{b.name} — {inr(b.balance)}</option>)}</select>

      <div className="field"><label className="label">To</label>

function Cards({ data, mut, showToast, sync, openTx }) {
  const [formOpen, setFormOpen] = useState(false);
  const [edit, setEdit] = useState(null);
  const [adjustTarget, setAdjustTarget] = useState(null);
  const [adjustVal, setAdjustVal] = useState('');
  const [confirmDel, setConfirmDel] = useState(null);
  const totalOut = data.cards.reduce((s, c) => s + (Number(c.outstanding) || 0), 0);

  const sortedCards = useMemo(() => {
    const arr = data.cards.slice();
    arr.sort((a, b) => {
      const da = nextDueDate(a.dueDay || 10, a.paidCycles);
      const db = nextDueDate(b.dueDay || 10, b.paidCycles);
      if (da - db !== 0) return da - db;
      return naturalCompare(a.name, b.name);
    });
    return arr;
  }, [data.cards]);

  const save = (payload, id) => {
    mut(d => {
      if (id) { const c = d.cards.find(x => x.id === id); if (c) Object.assign(c, payload); }
      else d.cards.push(Object.assign({ id: uid(), paidCycles: [] }, payload));
    });
    setFormOpen(false); setEdit(null);
    showToast(id ? 'Card updated' : 'Card added');
  };

  const markDone = (card) => {
    const cycle = monthKey(nextDueDate(card.dueDay || 10, card.paidCycles));
    mut(d => { const c = d.cards.find(x => x.id === card.id); if (c) c.paidCycles = Array.from(new Set((c.paidCycles || []).concat([cycle]))); });
    showToast('Marked done for this month');
  };

  const revertCard = (card) => {
    const todayCycle = monthKey(new Date());
    if (!(card.paidCycles || []).includes(todayCycle)) { showToast('Nothing to revert today'); return; }
    mut(d => { const c = d.cards.find(x => x.id === card.id); if (c) c.paidCycles = (c.paidCycles || []).filter(x => x !== todayCycle); });
    showToast('Reverted today’s card status');
  };

  const skipCard = (card) => {
    const cycle = monthKey(nextDueDate(card.dueDay || 10, card.paidCycles));
    const id = card.id;
    mut(d => { const c = d.cards.find(x => x.id === id); if (c) c.paidCycles = (c.paidCycles || []).concat([cycle]); });
    showToast(card.name + ' skipped · moved to next month', () => {
      mut(d => { const c = d.cards.find(x => x.id === id); if (c) c.paidCycles = (c.paidCycles || []).filter(x => x !== cycle); });
      showToast('Skip undone');
    });
  };

  const openPay = (card) => {
    const cycle = monthKey(nextDueDate(card.dueDay || 10, card.paidCycles));
    openTx({
      bankId: defaultBankId(data.banks),
      dir: 'out', amount: String(card.outstanding),
      note: card.name + ' Card Payment', category: 'Credit Card',
      date: toISO(new Date()), affectsBalance: true,
      link: { type: 'card', id: card.id, cycle }
    });
  };

  const saveAdjust = () => {
    const v = r2(adjustVal);
    mut(d => { const c = d.cards.find(x => x.id === adjustTarget.id); if (c) c.outstanding = v; });
    setAdjustTarget(null); showToast('Outstanding updated');
  };

  return (
    <div>
      <PageHead title="Credit Cards" sync={sync} openTx={openTx}>
        <button className="btn btn-sm btn-primary" onClick={() => { setEdit(null); setFormOpen(true); }}>+ Add Card</button>
      </PageHead>

      {data.cards.length === 0 ? (
        <div className="glass"><EmptyState icon={Ico.card} title="No credit cards yet" action={<button className="btn btn-sm btn-primary" onClick={() => { setEdit(null); setFormOpen(true); }}>Add your first card</button>} /></div>
      ) : (
        <div className="grid g2">
          {sortedCards.map(c => (<FlipCard key={c.id} card={c} onEdit={() => { setEdit(c); setFormOpen(true); }} onDelete={() => setConfirmDel(c)} onMarkDone={() => markDone(c)} onRevert={() => revertCard(c)} onSkip={() => skipCard(c)} onPay={() => openPay(c)} />))}
        </div>
      )}

      {data.cards.length > 0 && (
        <React.Fragment>
          <div className="section-head"><div className="section-title"><span className="dot"></span>Adjust Outstanding</div></div>
          <div className="glass" style={{ padding: '14px' }}>
            <div className="list">
              {sortedCards.map(c => (
                <div className="item" key={c.id}>
                  <div className="item-ico">{Ico.card}</div>
                  <div className="item-body"><div className="item-name">{c.name}</div><div className="item-meta"><span>Current outstanding {inr(c.outstanding)}</span><span className="pill">due {fmtDate(nextDueDate(c.dueDay || 10, c.paidCycles))}</span></div></div>
                  <button className="btn btn-sm" onClick={() => { setAdjustTarget(c); setAdjustVal(String(c.outstanding)); }}>Adjust</button>
                </div>
              ))}
            </div>
          </div>
        </React.Fragment>
      )}


      <div className="section-head"><div className="section-title"><span className="dot"></span>Card Transaction History</div><span className="pill blue"></span></div>
      <div className="card-history-stack">
        {sortedCards.map(c => {
          const txs = data.transactions.filter(t => t.cardId === c.id || (t.link && t.link.type === 'card' && t.link.id === c.id)).slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'') || (b.ts||0)-(a.ts||0));
          const purchases = txs.filter(t => t.link && t.link.type === 'cardPurchase');
          const payments = txs.filter(t => t.link && t.link.type === 'card');
          const purchaseTotal = r2(purchases.reduce((s,t)=>s+(Number(t.amount)||0),0));
          const paymentTotal = r2(payments.reduce((s,t)=>s+(Number(t.amount)||0),0));
          return <div className="glass card-history-card" key={c.id}>
            <div className="card-history-head"><div><div className="item-name">{c.name}</div><div className="item-meta"><span className="pill red">{Number(c.interestRate || c.rate || 40)}% APR</span><span>{txs.length} transaction{txs.length!==1?'s':''}</span></div></div><div className="mono card-history-balance">{inr(c.outstanding)}</div></div>
            <div className="card-history-stats"><div><span>Purchases</span><b>{inr(purchaseTotal)}</b></div><div><span>Payments</span><b>{inr(paymentTotal)}</b></div><div><span>Outstanding</span><b>{inr(c.outstanding)}</b></div></div>
            {txs.length===0 ? <div className="empty-inline">No transactions</div> : <div className="card-history-list">{txs.map(t=><div className="card-history-row" key={t.id}><div className="item-ico">{t.link && t.link.type==='card' ? Ico.down : Ico.up}</div><div className="item-body"><div className="item-name">{t.link && t.link.type==='card' ? 'Card payment' : (t.note || 'Card purchase')}</div><div className="item-meta"><span>{fmtDate(t.date)}</span>{t.category?<span className="pill">{t.category}</span>:null}</div></div><div className="item-amt" style={{color:t.link && t.link.type==='card'?'var(--green)':'var(--red)'}}>{t.link && t.link.type==='card'?'+':'−'}{inr(t.amount)}</div></div>)}</div>}
          </div>;
        })}
      </div>

      <CardModal open={formOpen} onClose={() => { setFormOpen(false); setEdit(null); }} card={edit} onSave={save} />

      <Modal open={!!adjustTarget} onClose={() => setAdjustTarget(null)} title="Adjust Outstanding" onSubmit={saveAdjust}>
        <div className="field"><label className="label">Correct outstanding amount</label><MoneyInput value={adjustVal} onChange={setAdjustVal} /></div>
        <button className="btn btn-primary" style={{ width: '100%', justifyContent: 'center', padding: '11px' }} onClick={saveAdjust}>Save</button>
      </Modal>

      <Modal open={!!confirmDel} onClose={() => setConfirmDel(null)} title="Delete this card?">
        <p style={{ fontSize: '13.5px', color: 'var(--muted)', marginBottom: '18px', lineHeight: 1.55 }}>This will remove the card and its due date. </p>
        <div style={{ display: 'flex', gap: '10px' }}><button className="btn" style={{ flex: 1, justifyContent: 'center' }} onClick={() => setConfirmDel(null)}>Cancel</button><button className="btn btn-danger" style={{ flex: 1, justifyContent: 'center' }} onClick={() => { mut(d => { d.cards = d.cards.filter(x => x.id !== confirmDel.id); }); setConfirmDel(null); showToast('Card removed'); }}>Delete</button></div>
      </Modal>
    </div>
  );
}
